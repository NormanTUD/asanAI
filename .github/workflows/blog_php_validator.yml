name: Blog PHP Validator

on:
  # Weekly catch for link rot — runs even when nothing in blog/ changed.
  schedule:
    - cron: '0 6 * * 1'
  push:
    branches:
      - master
    paths:
      - 'blog/**'
  pull_request:
    branches:
      - master
    paths:
      - 'blog/**'

# Don't run two link-check sweeps against the same ref concurrently.
concurrency:
  group: blog-validator-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  php-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Install PHP CLI
        run: |
          sudo apt-get update
          sudo apt-get install -y php-cli

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Run PHP Validator
        run: |
          uv run blog/tests/php_validator.py blog/

      - name: Run JS Validator
        run: |
          uv run blog/tests/js_validator.py blog/

      - name: Run Lesson Guard
        # Static regression guards on lesson templates + their JS modules
        # (headings-in-md, citation keys, 3-D wiring, fold quad map, …).
        run: |
          uv run blog/tests/lesson_guard.py blog/

      - name: Run Literature Link Checker
        run: |
          mkdir -p link-report
          uv run blog/tests/link_checker.py blog/ \
            --no-color \
            | tee link-report/link-check.txt

      - name: Upload link-check report
        # Always upload — even on failure, so we can review soft passes too.
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: blog-link-check
          path: link-report/link-check.txt
          if-no-files-found: warn
          retention-days: 30

  # Fast, dependency-free node unit tests for the client-side interactivity:
  # topic/interest registry, tone picker, learned state + course progress,
  # math-comfort 5-stop snapping, math-alternative text, keypoint cards, search.
  # No browser required — completes in well under a minute.
  js-unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run topics / learned / progress tests
        run: node blog/tests/topics_test.js

      - name: Run math-alt tests
        run: node blog/tests/math_alt_test.js

      - name: Run keypoint tests
        run: node blog/tests/keypoint_test.js

      - name: Run search tests
        run: node blog/tests/search_js_test.js

  php-render-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Install PHP CLI
        run: |
          sudo apt-get update
          sudo apt-get install -y php-cli

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Setup Chrome
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: stable

      - name: Remove mismatched chromedriver
        run: |
          sudo rm -f /usr/bin/chromedriver
          sudo rm -f /usr/local/bin/chromedriver

      - name: Run PHP Render Validator
        run: |
          uv run blog/tests/php_render_validator.py blog/

  # Fails the suite if any lesson has content wider than the reading column
  # (margin notes and boxes are exempt). Runs the production layout_guardrail.js
  # in headless Chrome against every lesson page.
  width-layout-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Install PHP CLI
        run: |
          sudo apt-get update
          sudo apt-get install -y php-cli

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Setup Chrome
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: stable

      - name: Remove mismatched chromedriver
        run: |
          sudo rm -f /usr/bin/chromedriver
          sudo rm -f /usr/local/bin/chromedriver

      #- name: Run Width Layout Guard (all lessons)
      #  run: |
      #    uv run blog/tests/php_render_validator.py blog/ \
      #      --all-lessons --check-width --width-only --width-timeout 25
