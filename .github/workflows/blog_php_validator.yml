name: Blog PHP Validator

on:
  # Weekly catch for link rot — runs even when nothing in blog/ changed.
  schedule:
    - cron: '0 6 * * 1'
  push:
    branches:
      - master
    paths:
      - 'blog/**'
  pull_request:
    branches:
      - master
    paths:
      - 'blog/**'

# Don't run two link-check sweeps against the same ref concurrently.
concurrency:
  group: blog-validator-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  php-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Install PHP CLI
        run: |
          sudo apt-get update
          sudo apt-get install -y php-cli

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Run PHP Validator
        run: |
          uv run blog/tests/php_validator.py blog/

      - name: Run JS Validator
        run: |
          uv run blog/tests/js_validator.py blog/

      - name: Run Literature Link Checker
        run: |
          mkdir -p link-report
          uv run blog/tests/link_checker.py blog/ \
            --no-color \
            | tee link-report/link-check.txt

      - name: Upload link-check report
        # Always upload — even on failure, so we can review soft passes too.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blog-link-check
          path: link-report/link-check.txt
          if-no-files-found: warn
          retention-days: 30

  php-render-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Install PHP CLI
        run: |
          sudo apt-get update
          sudo apt-get install -y php-cli

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Setup Chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Remove mismatched chromedriver
        run: |
          sudo rm -f /usr/bin/chromedriver
          sudo rm -f /usr/local/bin/chromedriver

      - name: Run PHP Render Validator
        run: |
          uv run blog/tests/php_render_validator.py blog/
