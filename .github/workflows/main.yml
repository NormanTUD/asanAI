name: CI

on:
  push:
    branches:
      - master
    # Die Action wird NICHT ausgelöst, wenn NUR Dateien in diesen Pfaden geändert wurden
    paths-ignore:
      - 'AGENTS.md'
      - 'blog/**'
      - 'praesentation/**'
  pull_request:
    branches:
      - master
    paths-ignore:
      - 'AGENTS.md'
      - 'blog/**'
      - 'praesentation/**'
  workflow_dispatch:

jobs:
  smoke-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get remove --purge man-db
          sudo apt-get autoremove -y
          sudo apt-get install -y ack-grep

      - name: Run Smoke Tests
        run: |
          sudo Xvfb :99 -ac &
          export DISPLAY=:99
          bash tests/smoke_tests

  playwright:
    needs: smoke-tests
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get remove --purge man-db
          sudo apt-get autoremove -y
          sudo apt-get install -y chromium-browser x11-apps python3-pil

      - name: Run Playwright Tests
        run: |
          sudo Xvfb :99 -ac &
          export DISPLAY=:99
          bash run_tests --no-smoke-tests

      - name: Create a new version
        if: ${{ success() }}
        run: |
          echo "Creating new version"
          git tag ${{ github.run_number }} || true
          git push origin --tags || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Windows/macOS cannot run the Linux Docker container used above. Serve the
  # app directly with PHP and drive it with Playwright instead. The bundled
  # Chromium gets the full suite; other engines get the quick suite.
  playwright-cross-platform:
    needs: smoke-tests
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            browser: chromium
            install: chromium
            quick: false
          - os: macos-latest
            browser: chromium
            install: chromium
            quick: false
          - os: windows-latest
            browser: firefox
            install: firefox
            quick: true
          - os: macos-latest
            browser: firefox
            install: firefox
            quick: true
          - os: windows-latest
            browser: chrome
            quick: true
          - os: macos-latest
            browser: chrome
            quick: true
          - os: windows-latest
            browser: msedge
            quick: true
          - os: macos-latest
            browser: msedge
            quick: true
          # WebKit is Playwright's Safari engine. Its quick suite currently
          # trips a tooltip-color assertion, so keep it non-blocking until
          # that engine-specific difference is fixed.
          - os: windows-latest
            browser: webkit
            install: webkit
            quick: true
            experimental: true
          - os: macos-latest
            browser: webkit
            install: webkit
            quick: true
            experimental: true
          # Playwright has no official Opera support; this launches the
          # installed Opera binary through its Chromium engine best-effort.
          - os: windows-latest
            browser: opera
            quick: true
            experimental: true
          - os: macos-latest
            browser: opera
            quick: true
            experimental: true
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Opera (Windows)
        if: matrix.browser == 'opera' && runner.os == 'Windows'
        shell: pwsh
        run: choco install opera -y --no-progress

      - name: Install Opera (macOS)
        if: matrix.browser == 'opera' && runner.os == 'macOS'
        shell: bash
        run: HOMEBREW_NO_AUTO_UPDATE=1 brew install --cask opera

      - name: Install Playwright
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright Pillow
          if [ -n "${{ matrix.install }}" ]; then
            python -m playwright install "${{ matrix.install }}"
          fi

      - name: Run browser tests
        shell: bash
        run: |
          php -S 127.0.0.1:1122 -t . > php-server.log 2>&1 &
          PHP_PID=$!
          trap 'kill "$PHP_PID" 2>/dev/null || true' EXIT

          for _ in {1..60}; do
            if curl -fsS http://127.0.0.1:1122/index.php > /dev/null; then
              echo "PHP server ready"
              break
            fi
            sleep 1
          done

          if ! curl -fsS http://127.0.0.1:1122/index.php > /dev/null; then
            echo "PHP server did not start"
            cat php-server.log
            exit 1
          fi

          QUICK=""
          if [ "${{ matrix.quick }}" = "true" ]; then
            QUICK="--quick"
          fi

          python _run_tests.py \
            --url http://127.0.0.1:1122/index.php \
            --browser "${{ matrix.browser }}" \
            --enable-fake-media \
            --fake-video tests/fake.y4m \
            $QUICK

      - name: Show PHP server log
        if: failure()
        shell: bash
        run: cat php-server.log || true
