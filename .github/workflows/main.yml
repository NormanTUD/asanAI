name: CI

on:
  push:
    branches:
      - master
    # Die Action wird NICHT ausgelöst, wenn NUR Dateien in diesen Pfaden geändert wurden
    paths-ignore:
      - 'AGENTS.md'
      - 'blog/**'
      - 'praesentation/**'
  pull_request:
    branches:
      - master
    paths-ignore:
      - 'AGENTS.md'
      - 'blog/**'
      - 'praesentation/**'
  workflow_dispatch:

# Deliberately no workflow concurrency: a new push must not cancel running
# jobs. Runs queue instead.

jobs:
  smoke-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get remove --purge man-db
          sudo apt-get autoremove -y
          sudo apt-get install -y ack-grep

      - name: Run Smoke Tests
        run: |
          sudo Xvfb :99 -ac &
          export DISPLAY=:99
          bash tests/smoke_tests

  playwright:
    needs: smoke-tests
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get remove --purge man-db
          sudo apt-get autoremove -y
          sudo apt-get install -y chromium-browser x11-apps python3-pil

      - name: Run Playwright Tests
        run: |
          sudo Xvfb :99 -ac &
          export DISPLAY=:99
          bash run_tests --no-smoke-tests


  # One job per OS. Every browser runs in that job; --parallel controls how many
  # run at once. Windows runs three at a time; macOS runs one at a time because
  # the standard runner has only 3 cores / 7 GB and must also respect the
  # plan-wide concurrent-macOS limit.
  playwright-cross-platform:
    name: all browsers / ${{ matrix.os }} / full (parallel ${{ matrix.parallel }})
    needs: smoke-tests
    runs-on: ${{ matrix.os }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            parallel: 3
          - os: macos-latest
            parallel: 1
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'tests/ci-requirements.txt'

      - name: Install Opera (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install opera -y --no-progress

      - name: Install Opera (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: HOMEBREW_NO_AUTO_UPDATE=1 brew install --cask opera

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/ms-playwright
            ~/Library/Caches/ms-playwright
            ~\AppData\Local\ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('tests/ci-requirements.txt') }}

      - name: Install Playwright
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r tests/ci-requirements.txt
          python -m playwright install chromium firefox webkit

      - name: Run browser tests
        shell: bash
        run: |
          php -S 127.0.0.1:1122 -t . > php-server.log 2>&1 &
          PHP_PID=$!
          trap 'kill "$PHP_PID" 2>/dev/null || true' EXIT

          for _ in {1..60}; do
            if curl -fsS http://127.0.0.1:1122/index.php > /dev/null; then
              echo "PHP server ready"
              break
            fi
            sleep 1
          done

          if ! curl -fsS http://127.0.0.1:1122/index.php > /dev/null; then
            echo "PHP server did not start"
            cat php-server.log
            exit 1
          fi

          BROWSER_ARGS=()
          for browser in chromium firefox chrome msedge webkit opera; do
            BROWSER_ARGS+=(--browser "$browser")
          done

          set -o pipefail
          python _run_tests.py \
            --url http://127.0.0.1:1122/index.php \
            "${BROWSER_ARGS[@]}" \
            --parallel "${{ matrix.parallel }}" \
            --stop-on-failure \
            --timings-json browser-timings.json \
            --timings-os "${{ matrix.os }}" \
            --artifacts-dir test-artifacts \
            --enable-fake-media \
            --fake-video tests/fake.y4m 2>&1 | tee browser-tests.log

      - name: Show PHP server log
        if: failure()
        shell: bash
        run: cat php-server.log || true

      - name: Write failure summary
        if: failure()
        shell: bash
        run: |
          summary="$GITHUB_STEP_SUMMARY"
          echo "## Browser tests failed on ${{ matrix.os }}" >> "$summary"
          echo >> "$summary"

          if [ ! -f browser-tests.log ]; then
            echo "No browser-tests.log was produced." >> "$summary"
            exit 0
          fi

          failed_test=$(grep -o 'Test >[^<]*< failed' browser-tests.log | head -n1 | sed -e 's/^Test >//' -e 's/< failed$//' || true)
          if [ -n "$failed_test" ]; then
            echo "**Failing test:** \`$failed_test\`" >> "$summary"
            echo "::error::Browser test failed: $failed_test"
          fi

          counts=$(grep -oE '[0-9]+ tests, ok: [0-9]+, failed: [0-9]+' browser-tests.log | tail -n1 || true)
          if [ -n "$counts" ]; then
            echo "**Result:** $counts" >> "$summary"
          fi

          debug=$(grep '\[feature-map-tooltip-theme\]' browser-tests.log | tail -n1 || true)
          if [ -n "$debug" ]; then
            echo "**Tooltip debug:** \`$debug\`" >> "$summary"
            echo "::error::$debug"
          fi

          concrete_line=$(grep -n -E '\[test_no_new_errors\]|\[test_no_new_warnings\]' browser-tests.log | tail -n1 | cut -d: -f1 || true)
          concrete=""
          if [ -n "$concrete_line" ]; then
            concrete=$(sed -n "${concrete_line},$((concrete_line + 20))p" browser-tests.log)
            encoded_concrete=$(printf '%s' "$concrete" | sed -e 's/%/%25/g' -e 's/\r/%0D/g' -e ':a;N;$!ba;s/\n/%0A/g')
            echo "::error::$encoded_concrete"
          fi

          model_debug=$(grep -E '\[_add_layers_to_model\]|\[test_activation_atlas\]' browser-tests.log | tail -n 20 || true)
          if [ -n "$model_debug" ]; then
            encoded_model=$(printf '%s' "$model_debug" | sed -e 's/%/%25/g' -e 's/\r/%0D/g' -e ':a;N;$!ba;s/\n/%0A/g')
            echo "::error::$encoded_model"
          fi

          {
            echo
            echo "### Concrete errors / warnings"
            echo
            echo '```text'
            if [ -n "$concrete" ]; then
              printf '%s\n' "$concrete"
            else
              grep -E 'Stack-Trace:' browser-tests.log | tail -n 20 || true
            fi
            echo '```'
            echo
            if [ -n "$model_debug" ]; then
              echo "### Model / atlas debug"
              echo
              echo '```text'
              printf '%s\n' "$model_debug"
              echo '```'
              echo
            fi
            echo "<details><summary>Failure output</summary>"
            echo
            echo '```text'
            grep -E 'Test-name:|\[test_equal\]|ERROR\. Is:|Should be:|feature-map-tooltip-theme|test_no_new_errors|test_no_new_warnings|_add_layers_to_model|test_activation_atlas|Stack-Trace:|tests, ok:|Test suite took|Playwright evaluation error' browser-tests.log | tail -n 180 || true
            echo '```'
            echo
            echo "</details>"
          } >> "$summary"

      - name: Write browser timing summary
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = process.env.GITHUB_WORKSPACE + '/browser-timings.json';

            if (!fs.existsSync(path)) {
              core.info('No browser-timings.json produced');
              return;
            }

            const timings = JSON.parse(fs.readFileSync(path, 'utf8'));
            const summarize = require(process.env.GITHUB_WORKSPACE + '/tests/job_timing_summary.js');
            await core.summary.addRaw(summarize.build_browser_summary('${{ matrix.os }}', timings)).write();

      - name: Upload browser test log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-tests-${{ matrix.os }}
          path: |
            browser-tests.log
            php-server.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-artifacts-${{ matrix.os }}
          path: test-artifacts/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload browser timings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-timings-${{ matrix.os }}
          path: browser-timings.json
          if-no-files-found: ignore
          retention-days: 7

  run-summary:
    needs:
      - smoke-tests
      - playwright
      - playwright-cross-platform
    runs-on: ubuntu-latest
    if: ${{ always() }}
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Download browser timings
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: browser-timings-*
          path: browser-timings

      - name: Write job timing summary
        uses: actions/github-script@v7
        with:
          script: |
            const summarize = require(process.env.GITHUB_WORKSPACE + "/tests/job_timing_summary.js");
            await summarize.write_run_summary({ github, context, core });

  tag-version:
    needs:
      - smoke-tests
      - playwright
      - playwright-cross-platform
      - run-summary
    runs-on: ubuntu-latest
    if: ${{ success() }}
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Create a new version
        run: |
          echo "Creating new version"
          git tag ${{ github.run_number }} || true
          git push origin --tags || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
