name: CI

on:
  push:
    branches:
      - master
    # Die Action wird NICHT ausgelöst, wenn NUR Dateien in diesen Pfaden geändert wurden
    paths-ignore:
      - 'AGENTS.md'
      - 'blog/**'
      - 'praesentation/**'
  pull_request:
    branches:
      - master
    paths-ignore:
      - 'AGENTS.md'
      - 'blog/**'
      - 'praesentation/**'
  workflow_dispatch:

jobs:
  smoke-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get remove --purge man-db
          sudo apt-get autoremove -y
          sudo apt-get install -y ack-grep

      - name: Run Smoke Tests
        run: |
          sudo Xvfb :99 -ac &
          export DISPLAY=:99
          bash tests/smoke_tests

  playwright:
    needs: smoke-tests
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get remove --purge man-db
          sudo apt-get autoremove -y
          sudo apt-get install -y chromium-browser x11-apps python3-pil

      - name: Run Playwright Tests
        run: |
          sudo Xvfb :99 -ac &
          export DISPLAY=:99
          bash run_tests --no-smoke-tests


  # Windows/macOS cannot run the Linux Docker container used above. Serve the
  # app directly with PHP and drive it with Playwright instead. Every browser
  # runs the full suite. All jobs are blocking so the watchdog can cancel on
  # any failure.
  playwright-cross-platform:
    name: ${{ matrix.browser }} / ${{ matrix.os }} / ${{ matrix.quick && 'quick' || 'full' }}
    needs: smoke-tests
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: windows-latest
            browser: chromium
            install: chromium
            quick: false
          - os: macos-latest
            browser: chromium
            install: chromium
            quick: false
          - os: windows-latest
            browser: firefox
            install: firefox
            quick: false
          - os: macos-latest
            browser: firefox
            install: firefox
            quick: false
          - os: windows-latest
            browser: chrome
            quick: false
          - os: macos-latest
            browser: chrome
            quick: false
          - os: windows-latest
            browser: msedge
            quick: false
          - os: macos-latest
            browser: msedge
            quick: false
          # WebKit is Playwright's Safari engine.
          - os: windows-latest
            browser: webkit
            install: webkit
            quick: false
          - os: macos-latest
            browser: webkit
            install: webkit
            quick: false
          # Playwright has no official Opera support; this launches the
          # installed Opera binary through its Chromium engine best-effort.
          - os: windows-latest
            browser: opera
            quick: false
          - os: macos-latest
            browser: opera
            quick: false
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Opera (Windows)
        if: matrix.browser == 'opera' && runner.os == 'Windows'
        shell: pwsh
        run: choco install opera -y --no-progress

      - name: Install Opera (macOS)
        if: matrix.browser == 'opera' && runner.os == 'macOS'
        shell: bash
        run: HOMEBREW_NO_AUTO_UPDATE=1 brew install --cask opera

      - name: Install Playwright
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright Pillow
          if [ -n "${{ matrix.install }}" ]; then
            python -m playwright install "${{ matrix.install }}"
          fi

      - name: Run browser tests
        shell: bash
        run: |
          php -S 127.0.0.1:1122 -t . > php-server.log 2>&1 &
          PHP_PID=$!
          trap 'kill "$PHP_PID" 2>/dev/null || true' EXIT

          for _ in {1..60}; do
            if curl -fsS http://127.0.0.1:1122/index.php > /dev/null; then
              echo "PHP server ready"
              break
            fi
            sleep 1
          done

          if ! curl -fsS http://127.0.0.1:1122/index.php > /dev/null; then
            echo "PHP server did not start"
            cat php-server.log
            exit 1
          fi

          QUICK=""
          if [ "${{ matrix.quick }}" = "true" ]; then
            QUICK="--quick"
          fi

          set -o pipefail
          python _run_tests.py \
            --url http://127.0.0.1:1122/index.php \
            --browser "${{ matrix.browser }}" \
            --enable-fake-media \
            --fake-video tests/fake.y4m \
            $QUICK 2>&1 | tee browser-tests.log

      - name: Show PHP server log
        if: failure()
        shell: bash
        run: cat php-server.log || true

      - name: Write failure summary
        if: failure()
        shell: bash
        run: |
          summary="$GITHUB_STEP_SUMMARY"
          echo "## Browser tests failed: ${{ matrix.browser }} on ${{ matrix.os }}" >> "$summary"
          echo >> "$summary"

          if [ ! -f browser-tests.log ]; then
            echo "No browser-tests.log was produced." >> "$summary"
            exit 0
          fi

          failed_test=$(grep -o 'Test >[^<]*< failed' browser-tests.log | head -n1 | sed -e 's/^Test >//' -e 's/< failed$//' || true)
          if [ -n "$failed_test" ]; then
            echo "**Failing test:** \`$failed_test\`" >> "$summary"
            echo "::error::Browser test failed: $failed_test"
          fi

          counts=$(grep -oE '[0-9]+ tests, ok: [0-9]+, failed: [0-9]+' browser-tests.log | tail -n1 || true)
          if [ -n "$counts" ]; then
            echo "**Result:** $counts" >> "$summary"
          fi

          debug=$(grep '\[feature-map-tooltip-theme\]' browser-tests.log | tail -n1 || true)
          if [ -n "$debug" ]; then
            echo "**Tooltip debug:** \`$debug\`" >> "$summary"
            echo "::error::$debug"
          fi

          concrete_line=$(grep -n -E '\[test_no_new_errors\]|\[test_no_new_warnings\]' browser-tests.log | tail -n1 | cut -d: -f1 || true)
          concrete=""
          if [ -n "$concrete_line" ]; then
            concrete=$(sed -n "${concrete_line},$((concrete_line + 20))p" browser-tests.log)
            encoded_concrete=$(printf '%s' "$concrete" | sed -e 's/%/%25/g' -e 's/\r/%0D/g' -e ':a;N;$!ba;s/\n/%0A/g')
            echo "::error::$encoded_concrete"
          fi

          {
            echo
            echo "### Concrete errors / warnings"
            echo
            echo '```text'
            if [ -n "$concrete" ]; then
              printf '%s\n' "$concrete"
            else
              grep -E 'Stack-Trace:' browser-tests.log | tail -n 20 || true
            fi
            echo '```'
            echo
            echo "<details><summary>Failure output</summary>"
            echo
            echo '```text'
            grep -E 'Test-name:|\[test_equal\]|ERROR\. Is:|Should be:|feature-map-tooltip-theme|test_no_new_errors|test_no_new_warnings|Stack-Trace:|tests, ok:|Test suite took|Playwright evaluation error' browser-tests.log | tail -n 160 || true
            echo '```'
            echo
            echo "</details>"
          } >> "$summary"

      - name: Upload browser test log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-tests-${{ matrix.os }}-${{ matrix.browser }}-quick-${{ matrix.quick }}
          path: |
            browser-tests.log
            php-server.log
          if-no-files-found: ignore

  # GitHub's fail-fast only covers one matrix. This watchdog cancels the whole
  # run as soon as any job fails.
  cancel-on-failure:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      actions: write
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Cancel remaining jobs after the first failure
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const run_id = context.runId;
            const failed = new Set(["failure", "timed_out", "cancelled", "action_required", "stale"]);
            const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

            for (let attempt = 0; attempt < 720; attempt++) {
              const { data } = await github.rest.actions.listJobsForWorkflowRun({
                owner,
                repo,
                run_id,
                per_page: 100,
              });

              const jobs = data.jobs.filter((job) => job.name !== "cancel-on-failure");
              const failure = jobs.find((job) => failed.has(job.conclusion));

              if (failure) {
                core.notice(`Job "${failure.name}" failed; cancelling the rest of the run.`);
                const summarize = require(process.env.GITHUB_WORKSPACE + "/tests/job_timing_summary.js");
                await summarize.write_run_summary({ github, context, core });
                try {
                  await github.rest.actions.cancelWorkflowRun({ owner, repo, run_id });
                } catch (error) {
                  core.warning(String(error));
                }
                return;
              }

              if (jobs.length > 0 && jobs.every((job) => job.status === "completed")) {
                return;
              }

              await sleep(30000);
            }

  run-summary:
    needs:
      - smoke-tests
      - playwright
      - playwright-cross-platform
    runs-on: ubuntu-latest
    if: ${{ success() }}
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Write job timing summary
        uses: actions/github-script@v7
        with:
          script: |
            const summarize = require(process.env.GITHUB_WORKSPACE + "/tests/job_timing_summary.js");
            await summarize.write_run_summary({ github, context, core });

  tag-version:
    needs:
      - smoke-tests
      - playwright
      - playwright-cross-platform
      - run-summary
    runs-on: ubuntu-latest
    if: ${{ success() }}
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Create a new version
        run: |
          echo "Creating new version"
          git tag ${{ github.run_number }} || true
          git push origin --tags || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
