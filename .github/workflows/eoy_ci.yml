name: EOY Interactions

on:
  push:
    branches:
      - master
    paths:
      - 'blog/eoy/**'
      - 'blog/tests/eoy_*.py'
      - '.github/workflows/eoy_ci.yml'
  pull_request:
    branches:
      - master
    paths:
      - 'blog/eoy/**'
      - 'blog/tests/eoy_*.py'
      - '.github/workflows/eoy_ci.yml'
  workflow_dispatch:

concurrency:
  group: eoy-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  eoy-interactions:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Install PHP CLI
        run: |
          sudo apt-get update
          sudo apt-get install -y php-cli php-curl

      - name: Install Chromium dependencies
        run: |
          sudo apt-get install -y \
            libnss3 libnspr4 libatk1.0-0 libatk-bridge2.0-0 libcups2 \
            libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 \
            libxrandr2 libgbm1 libpango-1.0-0 libcairo2 libasound2t64

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Setup Chrome
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: stable

      - name: Remove mismatched chromedriver
        run: |
          sudo rm -f /usr/bin/chromedriver
          sudo rm -f /usr/local/bin/chromedriver

      - name: Run eoy media interaction stress tests
        # Search → swipe-up nav → desktop → KI-Chat, plus rapid sprints,
        # random clicks, invalid API input, corrupted localStorage, reduced
        # motion, mobile viewports, resizes, CPU throttling, slow and missing
        # wallpaper, offline launch, and keyboard/tab races.
        run: |
          uv run --with playwright python3 blog/tests/eoy_media_interactions_test.py

      - name: Run eoy unembed guardrails
        run: |
          uv run blog/tests/eoy_unembed_guard_test.py
          uv run --with playwright python3 blog/tests/eoy_unembed_browser_test.py --langs de,en

      - name: Run eoy page walk
        run: |
          uv run blog/tests/eoy_pages_test.py --langs en,de

      - name: Run eoy tensor leak walk
        timeout-minutes: 30
        run: |
          uv run blog/tests/eoy_tensor_leak_test.py --lang de --passes 2
