<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Flatten — visuell</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#fff;color:#0d1117;
       font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,sans-serif;
       -webkit-font-smoothing:antialiased;line-height:1.5;
       height:100vh;overflow:hidden;display:flex;flex-direction:column;
       align-items:center;justify-content:center;gap:24px;padding:32px 16px}

  .head{text-align:center;height:150px;display:flex;flex-direction:column;
        align-items:center;justify-content:flex-end;position:relative;width:100%}
  .kicker{font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:#9aa1ad;
          font-weight:700;margin-bottom:12px}
  h1{font-size:clamp(25px,3.9vw,45px);font-weight:800;letter-spacing:-.032em;
     line-height:1.08;max-width:20ch}
  h1 em{font-style:normal;color:#2563eb;transition:color 1s cubic-bezier(.4,0,.2,1)}
  h1 em.gray{color:#6b7280}
  .tswap{position:absolute;left:50%;bottom:0;transform:translateX(-50%);width:max-content;
         will-change:transform,opacity,filter}

  .stage{position:relative;width:min(97vw,1180px);height:min(52vh,450px)}
  canvas{position:absolute;inset:0;width:100%;height:100%}

  .foot{height:82px;display:flex;flex-direction:column;align-items:center;
        justify-content:flex-start;gap:13px;position:relative;width:100%}
  .fswap{position:absolute;left:50%;top:0;transform:translateX(-50%);
         display:flex;flex-direction:column;align-items:center;gap:13px;
         width:max-content;will-change:transform,opacity}
  .pill{background:#f6f8fb;border:1px solid #eef0f4;padding:9px 20px;border-radius:99px;
        font-size:13.5px;font-weight:600;color:#374151;min-height:40px;
        display:flex;align-items:center;white-space:nowrap}
  .pill b{color:#f43f5e;font-variant-numeric:tabular-nums;min-width:1.3em;
          display:inline-block;text-align:center}
  .chip{font-family:ui-monospace,Menlo,monospace;font-size:13.5px;font-weight:700;
        padding:8px 15px;border-radius:99px;background:#eff5ff;border:1px solid #cfe0ff;color:#2563eb}
  .chip.g{background:#f4f5f7;border-color:#e3e7ee;color:#6b7280}
  .chip.r{background:#fff1f3;border-color:#ffd4dc;color:#f43f5e}
  .arrow{color:#c3c8d2;font-size:18px;font-weight:700}
  .chips{display:flex;align-items:center;gap:11px}

  .nav{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
       display:flex;align-items:center;gap:16px;z-index:20}
  .key{width:38px;height:38px;border-radius:11px;border:none;cursor:pointer;background:#fff;
       box-shadow:inset 0 0 0 1.5px #e7e9ee,0 2px 6px rgba(16,24,40,.05);font-size:14px;color:#6b7280;
       transition:transform .2s cubic-bezier(.2,.9,.3,1),box-shadow .2s,opacity .3s}
  .key:hover:not(:disabled){transform:translateY(-2px);box-shadow:inset 0 0 0 1.5px #cfd5e0,0 5px 14px rgba(16,24,40,.1)}
  .key:disabled{opacity:.28;cursor:default}
  .dots{display:flex;gap:7px}
  .dot{width:7px;height:7px;border-radius:50%;background:#e3e7ee;
       transition:background .6s cubic-bezier(.4,0,.2,1),transform .6s cubic-bezier(.2,1.3,.4,1)}
  .dot.act{background:#2563eb;transform:scale(1.4)}
  .navhint{position:fixed;bottom:70px;left:50%;transform:translateX(-50%);font-size:11px;
           color:#c9ced8;font-weight:600;letter-spacing:.12em;text-transform:uppercase;
           transition:opacity .9s}
  .navhint.hide{opacity:0}
</style>
</head>
<body>

<div class="head"><div class="tswap" id="tswap">
  <div class="kicker" id="kicker">Schritt 1</div>
  <h1 id="title">Jeder Pixel ist<br>nur eine <em>Zahl</em>.</h1>
</div></div>

<div class="stage"><canvas id="cv"></canvas></div>

<div class="foot"><div class="fswap" id="fswap">
  <div class="pill" id="pill">Das Originalbild · 32 × 32 Pixel</div>
  <div class="chips" id="chips"><span class="chip">(32, 32, 3)</span></div>
</div></div>

<div class="navhint" id="navhint">← → zum Blättern</div>
<div class="nav">
  <button class="key" id="prev">←</button>
  <div class="dots" id="dots"></div>
  <button class="key" id="next">→</button>
</div>

<script>
/* ═══════════ Daten ═══════════ */
const P={'.':'#B5B02B',k:'#141414',d:'#4A332A',b:'#7A5238',w:'#FBF4E6',W:'#FFFFFF',
         y:'#E2C72E',n:'#F2A594',m:'#C98878',p:'#F0A08A'};
const ART=[
"................................",".........kk..........kk.........",
"........kddk........kddk........",".......kdbbk.......kdbbk........",
"......kdbbbdk.....kdbbbdk.......",".....kkdbbbdkkkkkkkdbbbdkk......",
"....kkkdbbdkkkwkkkkdbbdkkk......","....kkkkddkkkkwkkkkkddkkkkk.....",
"...kkkkkkkkkkwwwkkkkkkkkkkk.....","...kkkkkkkkkkwwwkkkkkkkkkkkk....",
"..kkkyyykkkkkwwwkkkkyyykkkkk....","..kkyyyyykkkkwwwkkkyyyyykkkk....",
"W.kkyykkykkkwwwwwkkyykkykkkk....",".Wkkyykkykkwwwwwwwkyykkykkkk.W..",
"W.kkyyyyykkwwwwwwwkyyyyykkkk.W..",".WkkkyyykkkwwwwwwwkkyyykkkkkW...",
"..kkkkkkkkwwwnnnwwwkkkkkkkkk....","...kkkkkkkwwmnnnmwwkkkkkkkk.W...",
"....kkkkkkwwwmnmwwwkkkkkkkk.....","...W.kkkkkwwwwmwwwwwkkkkkkkkW...",
"......kkkkwwwwwwwwwwkkkkkkkkk...",".......kkkbwwwwwwwwkkkkkkkkkkk..",
"......W.kkbwwwwwwwkkkkkkkkkkkkk.","..........kbwwwwwkkkkkkkkkkkkkkk",
"......wwwkkbwwwwkkkkkkkkkkkkkkkk",".....wwwwwkbwwwkkkkkkkkkkkkkkkkk",
".....dwwwwdkkkkkkkkkkkkkkkkkkkkk","......dddkkkkkkkkkkkkkkkkkkkkkk.",
"...wwwkkkkkkkkkkkkkkkkkkkkkkkk..","..wpwpwwkkkkkkkkkkkkkkkkkkkk....",
"..dwpwpwdkkkkkkkkkkkkkkkk.......","...dwwwwd......................."];
const N=32, TOT=N*N, PICK=1;

const hex=h=>[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];
const RGB=[];
for(let r=0;r<N;r++){const row=(ART[r]||'').padEnd(N,'.');
  for(let c=0;c<N;c++)RGB.push(hex(P[row[c]]||P['.']));}
const GREEN=RGB.map(v=>v[1]);
const tint=(v,i)=> i===0?[255,255-v,255-v] : i===1?[255-v,255,255-v] : [255-v,255-v,255];

/* ═══════════ Canvas ═══════════ */
const cv=document.getElementById('cv'), ctx=cv.getContext('2d',{alpha:false});
const stage=cv.parentElement;
let W=0,H=0,DPR=1;
function resize(){
  DPR=Math.min(devicePixelRatio||1,2);
  W=stage.clientWidth; H=stage.clientHeight;
  cv.width=Math.round(W*DPR); cv.height=Math.round(H*DPR);
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.imageSmoothingEnabled=false;
}
resize();

/* ═══════════ State: 3 Kanal-Instanzen ═══════════ */
/* Jede Instanz hat GLOBALE Transform-Werte (x,y,scale,alpha) statt pro Pixel.
   Das ist der Schlüssel: keine Lücken, weil wir im Zielraster zeichnen. */
const inst=[0,1,2].map(i=>({
  x:0,y:0,s:10,a:i===0?1:0,         // aktuell
  tx:0,ty:0,ts:10,ta:i===0?1:0,     // Ziel
  mix:0,tmix:0                      // 0 = Originalfarbe, 1 = Kanaltönung
}));
let grayMix=0,  tGrayMix=0;         // Kanaltönung → Graustufen
let flatP=0;                        // 0..N  (wie viele Zeilen ausgerollt)
let railA=0, tRailA=0;              // Alpha der Schnur-Box
let tagA=[0,0,0], tTagA=[0,0,0];

const lerp=(a,b,t)=>a+(b-a)*t;
const eInOut=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;

/* ═══════════ Layouts ═══════════ */
let MODE=0;
function layout(){
  if(MODE===0){                                    // Original
    const s=Math.min(H/N*.95,W/N*.95,13);
    inst.forEach((o,i)=>{
      o.ts=s; o.tx=(W-N*s)/2; o.ty=(H-N*s)/2;
      o.ta=i===0?1:0; o.tmix=0;
    });
    tTagA=[0,0,0]; tRailA=0; tGrayMix=0;
  }
  else if(MODE===1||MODE===2||MODE===3){           // Kanäle
    const gap=Math.min(W*.035,46);
    const s=Math.min((W-gap*2)/(N*3)*.96, H/N*.82, 8);
    const bw=N*s, tot=bw*3+gap*2, ox=(W-tot)/2, oy=(H-N*s)/2+8;
    inst.forEach((o,i)=>{
      o.ts=s; o.tx=ox+i*(bw+gap); o.ty=oy;
      o.tmix=1;
      o.ta = (MODE===1) ? 1 : (i===PICK?1:0);
      tTagA[i]=o.ta;
    });
    tRailA=0;
    tGrayMix = MODE===3 ? 1 : 0;
  }
  else {                                           // Flatten
    const gs=Math.min(H*.50/N, W*.30/N, 9.5);
    inst.forEach((o,i)=>{
      o.ts=gs; o.tx=(W-N*gs)/2; o.ty=6; o.tmix=1; o.ta=i===PICK?1:0;
    });
    tTagA=[0,0,0]; tRailA=1; tGrayMix=1;
  }
}

/* ═══════════ Zeichnen ═══════════ */
function colorOf(i,ch,mix,gmix){
  const [R,G,B]=RGB[i];
  const v=RGB[i][ch];
  const [tr,tg,tb]=tint(v,ch);
  // Original → Kanaltönung
  let r=lerp(R,tr,mix), g=lerp(G,tg,mix), b=lerp(B,tb,mix);
  // Kanaltönung → Graustufe
  r=lerp(r,v,gmix); g=lerp(g,v,gmix); b=lerp(b,v,gmix);
  return `rgb(${r|0},${g|0},${b|0})`;
}

function drawGrid(o,ch){
  if(o.a<0.005)return;
  ctx.globalAlpha=o.a;
  const s=o.s;
  // ceil auf ganze Gerätepixel → garantiert keine Lücken
  const step=s, pad=Math.max(step*0.06,0.5);
  for(let r=0;r<N;r++){
    const y=o.y+r*step, yh=Math.ceil(y+step)-Math.floor(y);
    for(let c=0;c<N;c++){
      const i=r*N+c;
      const x=o.x+c*step, xw=Math.ceil(x+step)-Math.floor(x);
      ctx.fillStyle=colorOf(i,ch,o.mix,ch===PICK?grayMix:0);
      ctx.fillRect(Math.floor(x),Math.floor(y),xw,yh);
    }
  }
  ctx.globalAlpha=1;
}

/* Flatten: zeilenweise. rowsDone = wieviele Zeilen fertig,
   rowT = Fortschritt der aktuell fliegenden Zeile (0..1) */
function drawFlat(){
  const o=inst[PICK], s=o.s;
  const rowsDone=Math.floor(flatP), rowT=flatP-rowsDone;

  // Schnur-Geometrie
  const railW=Math.min(W*.97,1140);
  const pw=railW/TOT;
  const rx=(W-railW)/2;
  const ry=o.y+N*s+46;
  const rh=Math.min(H-ry-4,54);

  // Rahmen
  if(railA>0.01){
    ctx.globalAlpha=railA*0.9;
    ctx.fillStyle='#fff';
    ctx.strokeStyle='#eef0f4'; ctx.lineWidth=1;
    roundRect(rx-7,ry-7,railW+14,rh+14,11); ctx.fill(); ctx.stroke();
    ctx.globalAlpha=1;
  }

  // 1) verbleibendes Raster (noch nicht ausgerollte Zeilen)
  for(let r=0;r<N;r++){
    const y=o.y+r*s, yh=Math.ceil(y+s)-Math.floor(y);
    if(r<rowsDone){                       // erledigt → ausgegraut
      ctx.globalAlpha=0.10;
    }else if(r===rowsDone){               // fliegt gerade
      ctx.globalAlpha=1-rowT;
    }else{
      ctx.globalAlpha=1;
    }
    for(let c=0;c<N;c++){
      const i=r*N+c, v=GREEN[i];
      const x=o.x+c*s, xw=Math.ceil(x+s)-Math.floor(x);
      ctx.fillStyle=`rgb(${v},${v},${v})`;
      ctx.fillRect(Math.floor(x),Math.floor(y),xw,yh);
    }
  }
  ctx.globalAlpha=1;

  // 2) bereits abgelegte Zeilen in der Schnur
  for(let r=0;r<rowsDone;r++)drawRowInRail(r,1,rx,ry,rh,pw);

  // 3) die fliegende Zeile: morpht vom Raster in die Schnur
  if(rowsDone<N&&rowT>0){
    const t=eInOut(rowT);
    const srcY=o.y+rowsDone*s;
    const dstY=ry;
    const y=lerp(srcY,dstY,t);
    const hh=lerp(s,rh,t);
    for(let c=0;c<N;c++){
      const i=rowsDone*N+c, v=GREEN[i];
      const srcX=o.x+c*s, srcW=s;
      const dstX=rx+(rowsDone*N+c)*pw, dstW=pw;
      const x=lerp(srcX,dstX,t), w=lerp(srcW,dstW,t);
      ctx.fillStyle=`rgb(${v},${v},${v})`;
      ctx.fillRect(Math.floor(x),Math.floor(y),Math.ceil(x+w)-Math.floor(x),Math.ceil(y+hh)-Math.floor(y));
    }
    // Leuchtlinie unter der fliegenden Zeile
    ctx.globalAlpha=(1-Math.abs(t*2-1))*0.5;
    ctx.fillStyle='#f43f5e';
    ctx.fillRect(Math.floor(lerp(o.x,rx,t)),Math.floor(y+hh+2),
                 Math.ceil(lerp(N*s,N*pw,t)),2);
    ctx.globalAlpha=1;
  }
}

function drawRowInRail(r,alpha,rx,ry,rh,pw){
  ctx.globalAlpha=alpha;
  for(let c=0;c<N;c++){
    const i=r*N+c, v=GREEN[i];
    const x=rx+i*pw;
    ctx.fillStyle=`rgb(${v},${v},${v})`;
    ctx.fillRect(Math.floor(x),Math.floor(ry),Math.ceil(x+pw)-Math.floor(x),Math.round(rh));
  }
  ctx.globalAlpha=1;
}

function roundRect(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath();
}

/* Kanal-Labels als Canvas-Text */
const TAGS=[['ROT','#f43f5e'],['GRÜN','#10b981'],['BLAU','#3b82f6']];
function drawTags(){
  inst.forEach((o,i)=>{
    if(tagA[i]<0.01)return;
    const gray = i===PICK&&grayMix>0.5;
    const label = gray?'GRAUSTUFEN':TAGS[i][0];
    const col   = gray?'#6b7280':TAGS[i][1];
    ctx.globalAlpha=tagA[i];
    ctx.font='800 10px -apple-system,sans-serif';
    ctx.textAlign='center'; ctx.textBaseline='middle';
    const tw=ctx.measureText(label).width+24;
    const cx=o.x+N*o.s/2, cy=o.y-16;
    ctx.fillStyle=col; roundRect(cx-tw/2,cy-9,tw,18,9); ctx.fill();
    ctx.fillStyle='#fff';
    ctx.fillText(label.split('').join('\u200a'),cx,cy+.5);
    ctx.globalAlpha=1;
  });
}

/* ═══════════ Loop ═══════════ */
let last=0;
function frame(ts){
  const dt=Math.min((ts-last)/16.667,3); last=ts;
  const k=1-Math.pow(1-0.085,dt);          // framerate-unabhängiges Lerp

  inst.forEach(o=>{
    o.x=lerp(o.x,o.tx,k); o.y=lerp(o.y,o.ty,k);
    o.s=lerp(o.s,o.ts,k); o.a=lerp(o.a,o.ta,k*1.25);
    o.mix=lerp(o.mix,o.tmix,k);
  });
  grayMix=lerp(grayMix,tGrayMix,k);
  railA=lerp(railA,tRailA,k);
  for(let i=0;i<3;i++)tagA[i]=lerp(tagA[i],tTagA[i],k*1.2);

  if(MODE===4){
    flatP=Math.min(flatP+dt*(N/ (10.5*60)) *60/60*1.0, N);
    // ≈ 10,5 s für 32 Zeilen
    flatP=Math.min(flatP, N);
    const done=Math.floor(flatP);
    if(flatP>=N){
      if(!flatMsg){flatMsg=1;
        setFoot('Fertig — <b>1024</b> Zahlen in einer einzigen Reihe',
         '<span class="chip g">(32, 32)</span><span class="arrow">→</span><span class="chip r">(1024,)</span>');}
    }else{
      pill.innerHTML=`Zeile <b>${done}</b> von 32 · <b>${done*N}</b> Zahlen`;
    }
  }

  ctx.fillStyle='#fff'; ctx.fillRect(0,0,W,H);
  if(MODE===4){ drawFlat(); }
  else{ inst.forEach((o,i)=>drawGrid(o,i)); drawTags(); }

  requestAnimationFrame(frame);
}
let flatMsg=0;

/* ═══════════ Slides ═══════════ */
const kicker=document.getElementById('kicker'),title=document.getElementById('title'),
      pill=document.getElementById('pill'),chips=document.getElementById('chips'),
      tswap=document.getElementById('tswap'),fswap=document.getElementById('fswap');
function setFoot(p,c){pill.innerHTML=p;chips.innerHTML=c;}

const SLIDES=[
 {k:'Schritt 1',t:'Jeder Pixel ist<br>nur eine <em>Zahl</em>.',
  p:'Das Originalbild · 32 × 32 Pixel',
  c:'<span class="chip">(32, 32, 3)</span>', m:0},

 {k:'Schritt 2',t:'Farbbilder haben<br><em>drei</em> Stapel.',
  p:'Rot, Grün und Blau — drei eigene Zahlen-Raster',
  c:'<span class="chip">(32, 32, 3)</span><span class="arrow">=</span><span class="chip">3 × (32, 32)</span>', m:1},

 {k:'Schritt 3',t:'Nimm einen davon:<br>den <em>Grün-Kanal</em>.',
  p:'Ein einzelner Kanal ist ein Raster aus 1024 Zahlen',
  c:'<span class="chip">(32, 32)</span>', m:2},

 {k:'Schritt 4',t:'Ein Kanal ist nur<br><em class="gray">Grau</em>.',
  p:'Die grüne Farbe war nur Deko — es sind reine Zahlen',
  c:'<span class="chip g">(32, 32)</span><span class="arrow">·</span><span class="chip g">0 – 255</span>', m:3},

 {k:'Schritt 5',t:'Flatten rollt<br>das Raster zu<br>einer <em>Schnur</em> aus.',
  p:'Zeile <b>0</b> von 32 · <b>0</b> Zahlen',
  c:'<span class="chip g">(32, 32)</span><span class="arrow">→</span><span class="chip r">(1024,)</span>', m:4}
];

/* ── Text-Swap: Kopf nach oben raus / von unten rein, Fuß gegenläufig ── */
function swapText(s){
  tswap.style.transition='transform .4s cubic-bezier(.4,0,1,1),opacity .4s,filter .4s';
  tswap.style.transform='translateX(-50%) translateY(-14px)';
  tswap.style.opacity='0'; tswap.style.filter='blur(3px)';
  fswap.style.transition='transform .4s cubic-bezier(.4,0,1,1),opacity .4s';
  fswap.style.transform='translateX(-50%) translateY(10px)';
  fswap.style.opacity='0';

  setTimeout(()=>{
    kicker.textContent=s.k; title.innerHTML=s.t; setFoot(s.p,s.c);

    tswap.style.transition='none';
    tswap.style.transform='translateX(-50%) translateY(16px)';
    tswap.style.filter='blur(4px)';
    fswap.style.transition='none';
    fswap.style.transform='translateX(-50%) translateY(-12px)';
    void tswap.offsetWidth; void fswap.offsetWidth;

    tswap.style.transition='transform .9s cubic-bezier(.16,1,.3,1),opacity .75s cubic-bezier(.16,1,.3,1),filter .75s cubic-bezier(.16,1,.3,1)';
    tswap.style.transform='translateX(-50%) translateY(0)';
    tswap.style.opacity='1'; tswap.style.filter='blur(0px)';

    fswap.style.transition='transform .9s cubic-bezier(.16,1,.3,1) .06s,opacity .75s cubic-bezier(.16,1,.3,1) .06s';
    fswap.style.transform='translateX(-50%) translateY(0)';
    fswap.style.opacity='1';
  },410);
}

/* ── Slide-Wechsel ── */
let cur=-1, busy=false;
const dotsEl=document.getElementById('dots');
SLIDES.forEach(()=>{const d=document.createElement('div');d.className='dot';dotsEl.appendChild(d);});
const dots=[...dotsEl.children];
const prevBtn=document.getElementById('prev'),
      nextBtn=document.getElementById('next'),
      navhint=document.getElementById('navhint');

function go(n,instant){
  n=Math.max(0,Math.min(SLIDES.length-1,n));
  if(n===cur||busy)return;
  busy=true;
  const s=SLIDES[n];

  if(s.m===4&&MODE!==4){ flatP=0; flatMsg=0; }   // Flatten neu starten
  if(s.m!==4){ flatP=0; flatMsg=0; }

  MODE=s.m;
  layout();

  if(instant){
    kicker.textContent=s.k; title.innerHTML=s.t; setFoot(s.p,s.c);
  }else swapText(s);

  dots.forEach((d,i)=>d.classList.toggle('act',i===n));
  prevBtn.disabled=n===0;
  nextBtn.disabled=n===SLIDES.length-1;
  cur=n;
  setTimeout(()=>{busy=false;},instant?60:420);
}

/* ── Steuerung ── */
const hideHint=()=>navhint.classList.add('hide');
prevBtn.onclick=()=>{go(cur-1);hideHint();};
nextBtn.onclick=()=>{go(cur+1);hideHint();};

addEventListener('keydown',e=>{
  const k=e.key;
  if(k==='ArrowRight'||k==='ArrowDown'||k===' '||k==='PageDown'||k==='Enter'){
    e.preventDefault(); go(cur+1); hideHint();
  }else if(k==='ArrowLeft'||k==='ArrowUp'||k==='PageUp'||k==='Backspace'){
    e.preventDefault(); go(cur-1); hideHint();
  }else if(k==='Home'){e.preventDefault();go(0);hideHint();}
  else if(k==='End'){e.preventDefault();go(SLIDES.length-1);hideHint();}
  else if(k==='r'||k==='R'){ if(MODE===4){flatP=0;flatMsg=0;} }
});

let wheelLock=0;
addEventListener('wheel',e=>{
  const now=performance.now();
  if(now-wheelLock<850||Math.abs(e.deltaY)<18)return;
  wheelLock=now; go(cur+(e.deltaY>0?1:-1)); hideHint();
},{passive:true});

let touchY=null;
addEventListener('touchstart',e=>{touchY=e.touches[0].clientY;},{passive:true});
addEventListener('touchend',e=>{
  if(touchY===null)return;
  const dy=touchY-e.changedTouches[0].clientY;
  if(Math.abs(dy)>52){go(cur+(dy>0?1:-1));hideHint();}
  touchY=null;
},{passive:true});

let rsz=null;
addEventListener('resize',()=>{
  clearTimeout(rsz);
  rsz=setTimeout(()=>{resize();layout();},110);
});

/* ── Start: Pixel fahren aus der Mitte auf ── */
inst.forEach((o,i)=>{ o.s=1; o.x=W/2; o.y=H/2; o.a=i===0?0:0; });
layout();
inst[0].a=0;
requestAnimationFrame(frame);
go(0,true);
setTimeout(hideHint,6500);
</script>
</body>
