<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Offline — asanAI</title>
	<meta name="theme-color" content="#0f172a">
	<style>
		:root {
			color-scheme: light dark;
			--bg: #faf8f1;
			--surface: #ffffff;
			--text: #1a1f30;
			--muted: #5b6172;
			--accent: #7299d2;
			--border: rgba(60, 60, 67, 0.14);
		}
		@media (prefers-color-scheme: dark) {
			:root {
				--bg: #0f172a;
				--surface: #1a1f30;
				--text: #e7ebf5;
				--muted: #9aa3b5;
				--accent: #8fb4e8;
				--border: rgba(255, 255, 255, 0.14);
			}
		}
		* { box-sizing: border-box; }
		body {
			margin: 0;
			min-height: 100vh;
			display: grid;
			place-items: center;
			padding: 24px;
			background: var(--bg);
			color: var(--text);
			font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
		}
		main {
			width: min(520px, 100%);
			padding: 28px;
			border: 1px solid var(--border);
			border-radius: 16px;
			background: var(--surface);
			box-shadow: 0 18px 50px rgba(0, 0, 0, 0.12);
		}
		h1 { margin: 0 0 10px; font-size: 26px; }
		p { margin: 0 0 14px; line-height: 1.55; color: var(--muted); }
		.actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 20px; }
		a, button {
			display: inline-flex;
			align-items: center;
			justify-content: center;
			min-height: 40px;
			padding: 0 16px;
			border: 1px solid var(--border);
			border-radius: 999px;
			background: var(--surface);
			color: var(--text);
			font: inherit;
			font-weight: 600;
			text-decoration: none;
			cursor: pointer;
		}
		a.primary, button.primary {
			border-color: transparent;
			background: var(--accent);
			color: #fff;
		}
	</style>
</head>
<body>
	<main>
		<h1>You are offline</h1>
		<p>This page has not been cached yet. Pages you have already visited, and the app itself, still work without a network connection.</p>
		<p>Reconnect and reload to fetch the page.</p>
		<div class="actions">
			<a class="primary" href="./">Open asanAI</a>
			<button class="primary" type="button" onclick="location.reload()">Try again</button>
		</div>
	</main>
</body>
</html>
