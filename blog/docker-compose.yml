services:
  asanai-blog:
    build:
      context: .
    image: asanai-blog
    ports:
      - "${LOCAL_PORT:-8080}:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost/index.php"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
