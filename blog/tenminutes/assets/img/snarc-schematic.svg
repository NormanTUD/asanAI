<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-labelledby="title desc">
	<title id="title">SNARC schematic</title>
	<desc id="desc">A schematic of the 1951 SNARC: a maze, forty vacuum-tube neurons, a reinforcement signal, and a clutch that changes the connection weights.</desc>
	<defs>
		<marker id="arrow-green" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
			<path d="M0,0 L9,4.5 L0,9 Z" fill="#63a44b"/>
		</marker>
		<marker id="arrow-gold" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
			<path d="M0,0 L9,4.5 L0,9 Z" fill="#9f9700"/>
		</marker>
		<marker id="arrow-sky" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
			<path d="M0,0 L9,4.5 L0,9 Z" fill="#5c9baf"/>
		</marker>
	</defs>

	<rect x="1" y="1" width="638" height="398" rx="18" fill="#fdfbf4" stroke="#d8d2c0"/>

	<text x="30" y="44" font-family="ui-sans-serif, system-ui, sans-serif" font-size="23" font-weight="700" fill="#004b6f">SNARC · 1951</text>
	<text x="30" y="64" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#627476">Stochastic Neural Analog Reinforcement Calculator</text>

	<!-- maze -->
	<g stroke="#004b6f" stroke-width="3" fill="none" stroke-linecap="round">
		<rect x="34" y="120" width="150" height="150" rx="8"/>
		<path d="M34 170 H108 V120"/>
		<path d="M84 270 V220 H150"/>
		<path d="M34 220 H60 V170"/>
		<path d="M108 170 V220 H184"/>
		<path d="M60 220 V270"/>
		<path d="M134 120 V195 H184"/>
		<path d="M108 245 H134"/>
	</g>
	<circle cx="60" cy="145" r="9" fill="#9185be" stroke="#004b6f" stroke-width="2"/>
	<circle cx="160" cy="245" r="9" fill="#63a44b" stroke="#004b6f" stroke-width="2"/>
	<text x="109" y="296" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#627476">maze</text>
	<text x="60" y="149" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9" fill="#fdfbf4">rat</text>
	<text x="160" y="249" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9" fill="#fdfbf4">goal</text>

	<!-- reinforcement arrow -->
	<path d="M184 190 C206 190 206 170 228 170" fill="none" stroke="#63a44b" stroke-width="2.4" marker-end="url(#arrow-green)"/>
	<text x="206" y="154" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#004b6f">reward</text>

	<!-- neuron rack -->
	<rect x="230" y="104" width="230" height="190" rx="14" fill="#f7f3e8" stroke="#004b6f" stroke-width="2"/>
	<text x="345" y="126" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#004b6f">40 vacuum-tube neurons</text>
	<g>
		<g fill="#63a44b" stroke="#004b6f" stroke-width="1.4">
			<circle cx="255" cy="150" r="7"/><circle cx="283" cy="150" r="7"/><circle cx="311" cy="150" r="7"/><circle cx="339" cy="150" r="7"/><circle cx="367" cy="150" r="7"/><circle cx="395" cy="150" r="7"/><circle cx="423" cy="150" r="7"/><circle cx="451" cy="150" r="7"/>
		</g>
		<g fill="#5c9baf" stroke="#004b6f" stroke-width="1.4">
			<circle cx="255" cy="176" r="7"/><circle cx="283" cy="176" r="7"/><circle cx="311" cy="176" r="7"/><circle cx="339" cy="176" r="7"/><circle cx="367" cy="176" r="7"/><circle cx="395" cy="176" r="7"/><circle cx="423" cy="176" r="7"/><circle cx="451" cy="176" r="7"/>
		</g>
		<g fill="#9f9700" stroke="#004b6f" stroke-width="1.4">
			<circle cx="255" cy="202" r="7"/><circle cx="283" cy="202" r="7"/><circle cx="311" cy="202" r="7"/><circle cx="339" cy="202" r="7"/><circle cx="367" cy="202" r="7"/><circle cx="395" cy="202" r="7"/><circle cx="423" cy="202" r="7"/><circle cx="451" cy="202" r="7"/>
		</g>
		<g fill="#9185be" stroke="#004b6f" stroke-width="1.4">
			<circle cx="255" cy="228" r="7"/><circle cx="283" cy="228" r="7"/><circle cx="311" cy="228" r="7"/><circle cx="339" cy="228" r="7"/><circle cx="367" cy="228" r="7"/><circle cx="395" cy="228" r="7"/><circle cx="423" cy="228" r="7"/><circle cx="451" cy="228" r="7"/>
		</g>
		<g fill="#869b55" stroke="#004b6f" stroke-width="1.4">
			<circle cx="255" cy="254" r="7"/><circle cx="283" cy="254" r="7"/><circle cx="311" cy="254" r="7"/><circle cx="339" cy="254" r="7"/><circle cx="367" cy="254" r="7"/><circle cx="395" cy="254" r="7"/><circle cx="423" cy="254" r="7"/><circle cx="451" cy="254" r="7"/>
		</g>
	</g>
	<text x="345" y="282" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#627476">randomly connected · learns by reinforcement</text>

	<!-- update arrow to clutch -->
	<path d="M460 202 C482 202 482 202 500 202" fill="none" stroke="#9f9700" stroke-width="2.4" marker-end="url(#arrow-gold)"/>

	<!-- clutch / potentiometer -->
	<circle cx="548" cy="202" r="40" fill="#fdfbf4" stroke="#9f9700" stroke-width="3"/>
	<g stroke="#9f9700" stroke-width="2" stroke-linecap="round">
		<path d="M548 202 L548 172"/>
		<path d="M548 202 L575 190"/>
		<path d="M548 202 L575 214"/>
		<path d="M548 202 L548 232"/>
		<path d="M548 202 L521 214"/>
		<path d="M548 202 L521 190"/>
	</g>
	<circle cx="548" cy="202" r="5" fill="#004b6f"/>
	<text x="548" y="260" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#004b6f">clutch /</text>
	<text x="548" y="274" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#004b6f">potentiometer</text>

	<!-- feedback loop -->
	<path d="M548 162 C548 90 280 78 200 110" fill="none" stroke="#5c9baf" stroke-width="2" stroke-dasharray="5 5" marker-end="url(#arrow-sky)"/>
	<text x="380" y="76" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#627476">weights change</text>

	<text x="610" y="380" text-anchor="end" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#92a19a">schematic, not to scale</text>
</svg>
