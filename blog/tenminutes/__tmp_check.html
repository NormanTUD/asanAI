<script>
setTimeout(function(){
 function L(x){var t=(typeof x==="string"?x:JSON.stringify(x));console.log("FULL "+t);document.title=(document.title||"")+" | "+t;}
 L("steps="+LearnSys.days().map(function(d){return d.steps;}).join(","));
 L("overflow0="+(document.documentElement.scrollWidth-document.documentElement.clientWidth));
 LearnSys.go(0,2); setTimeout(function(){var el=document.querySelector(".ls-loop-scene"); for(var k=0;k<7;k++){var b=el.querySelector(".ls-loop-bar"); if(b)b.click();} L("loopbar="+el.querySelector(".ls-loop-bars").textContent+" overflow="+(document.documentElement.scrollWidth-document.documentElement.clientWidth));},300);
 setTimeout(function(){LearnSys.go(0,29); L("s29 overflow="+(document.documentElement.scrollWidth-document.documentElement.clientWidth));},900);
 setTimeout(function(){LearnSys.go(0,30); L("s30 overflow="+(document.documentElement.scrollWidth-document.documentElement.clientWidth)+" errs="+JSON.stringify(window.__errs));},1500);
},1000);
