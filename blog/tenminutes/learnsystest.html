<!DOCTYPE html>
<html lang="de" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>LearnSys Prototype — Ten Minutes</title>
<link rel="stylesheet" href="assets/site.css">
<style>
:root{
  --ls-paper:#ffffff;
  --ls-paper-2:#f7f9f8;
  --ls-line:#dbe3e0;
  --ls-line-strong:#b9c8c3;
  --ls-ink:#000000;
  --ls-soft:#2c464d;
  --ls-muted:#627476;
  --ls-petrol:#004b6f;
  --ls-blue:#1275ac;
  --ls-green:#63a44b;
  --ls-lime:#869b55;
  --ls-gold:#9f9700;
  --ls-lilac:#9185be;
  --ls-sky:#5c9baf;
  --ls-teal:#009299;
  --ls-shadow:0 18px 50px rgba(0,0,0,.08);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--ls-paper);overflow:hidden}
body{font-family:"Open Sans",system-ui,-apple-system,"Segoe UI",sans-serif;font-weight:300;color:var(--ls-ink)}
h1,h2,h3,h4,.ls-title,.ls-brand b,.ls-stage-head b,.ls-day-num,.ls-kicker{font-family:"Barlow",system-ui,sans-serif;font-weight:700;letter-spacing:-.01em}
button,input,select{font:inherit}
button{color:inherit}
.ls-app{position:fixed;inset:0;display:grid;grid-template-rows:64px minmax(0,1fr) auto;background:var(--ls-paper);z-index:1}
.ls-top{display:flex;align-items:center;justify-content:space-between;gap:18px;padding:0 22px;border-bottom:1px solid var(--ls-line);background:rgba(255,255,255,.96);backdrop-filter:blur(8px);z-index:10}
.ls-brand{display:flex;align-items:center;gap:11px;min-width:0}
.ls-brand b{display:block;font-size:15px;line-height:1.1}
.ls-brand span{display:block;font-size:10px;color:var(--ls-muted);letter-spacing:.02em}
.ls-controls{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:flex-end}
.ls-field{display:flex;align-items:center;gap:6px;font-size:10px;color:var(--ls-muted);text-transform:uppercase;letter-spacing:.08em}
.ls-field--inline{text-transform:none;letter-spacing:0;font-size:10px}
.ls-select{border:1px solid var(--ls-line-strong);background:#fff;color:var(--ls-ink);padding:5px 7px;font-size:11px;border-radius:0}
.ls-seg{display:flex;border:1px solid var(--ls-line-strong);background:#fff}
.ls-seg button{border:0;border-right:1px solid var(--ls-line);background:transparent;padding:5px 9px;font-size:10px;cursor:pointer;color:var(--ls-soft)}
.ls-seg button:last-child{border-right:0}
.ls-seg button:hover{color:var(--ls-petrol)}
.ls-seg button.is-on{background:var(--ls-petrol);color:#fff}
.ls-btn{border:1px solid var(--ls-line-strong);background:#fff;color:var(--ls-ink);padding:6px 10px;font-size:11px;cursor:pointer;border-radius:0}
.ls-btn:hover{border-color:var(--ls-petrol);color:var(--ls-petrol)}
.ls-btn--primary{background:var(--ls-petrol);border-color:var(--ls-petrol);color:#fff}
.ls-btn--primary:hover{background:#003a56;color:#fff}
.ls-btn--ghost{background:transparent}
.ls-btn--tiny{padding:4px 8px;font-size:10px}
.ls-main{display:grid;grid-template-columns:minmax(330px,37%) minmax(0,1fr);min-height:0}
.ls-text{min-width:0;min-height:0;border-right:1px solid var(--ls-line);background:var(--ls-paper);overflow:hidden}
.ls-text-scroll{height:100%;overflow:auto;padding:clamp(24px,4.2vw,58px) clamp(22px,3.6vw,52px);max-width:680px}
.ls-kicker{font-size:10px;text-transform:uppercase;letter-spacing:.13em;color:var(--ls-petrol);margin-bottom:10px}
.ls-title{font-size:clamp(26px,2.9vw,42px);line-height:1.05;margin:0 0 16px;max-width:18ch}
.ls-body{font-size:clamp(15px,1.15vw,18px);line-height:1.65;color:var(--ls-soft);max-width:64ch}
.ls-body p{margin:0 0 1.05em}
.ls-body p:last-child{margin-bottom:0}
.ls-body b,.ls-context b,.ls-deep b{color:var(--ls-ink);font-weight:600}
.ls-context,.ls-deep{border-left:3px solid var(--ls-green);background:#f6faf5;padding:12px 14px;margin:16px 0;font-size:13px;line-height:1.55;color:var(--ls-soft)}
.ls-deep{border-left-color:var(--ls-lilac);background:#faf8fd}
.ls-context b,.ls-deep b{display:block;font-size:9px;text-transform:uppercase;letter-spacing:.1em;margin-bottom:4px;color:var(--ls-muted)}
.ls-context p,.ls-deep p{margin:0}
.ls-watch{border-top:1px solid var(--ls-line);margin-top:20px;padding-top:12px;font-size:13px;line-height:1.55;color:var(--ls-soft)}
.ls-watch b{display:block;font-size:9px;text-transform:uppercase;letter-spacing:.12em;color:var(--ls-green);margin-bottom:3px}
.ls-actions{display:flex;gap:8px;align-items:center;margin-top:20px;flex-wrap:wrap}
.ls-footnote{margin-top:18px;font-size:10px;color:var(--ls-muted);letter-spacing:.02em}
.ls-term{display:inline;border:0;border-bottom:1px dotted var(--ls-blue);background:none;padding:0;margin:0;color:var(--ls-petrol);font:inherit;font-weight:600;cursor:help;text-align:left}
.ls-term:hover,.ls-term:focus-visible{color:var(--ls-blue);border-bottom-color:var(--ls-blue);outline:none}
.ls-stage{position:relative;min-width:0;min-height:0;display:flex;flex-direction:column;background:var(--ls-paper-2);overflow:hidden}
.ls-stage:before{content:"";position:absolute;inset:0;background-image:linear-gradient(var(--ls-line) 1px,transparent 1px),linear-gradient(90deg,var(--ls-line) 1px,transparent 1px);background-size:48px 48px;opacity:.28;pointer-events:none}
.ls-stage-head{position:relative;z-index:2;display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:14px 22px 8px;border-bottom:1px solid var(--ls-line);background:rgba(247,249,248,.86)}
.ls-stage-head span{font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--ls-muted)}
.ls-stage-head b{font-size:14px}
.ls-demo{position:relative;z-index:1;flex:1;min-height:0;padding:12px 16px 8px}
.ls-stage-foot{position:relative;z-index:2;display:flex;justify-content:space-between;gap:14px;padding:8px 22px 12px;border-top:1px solid var(--ls-line);font-size:10px;color:var(--ls-muted);background:rgba(247,249,248,.86)}
.ls-credit{text-align:right;white-space:nowrap}
.ls-bottom{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(240px,1fr);gap:18px;align-items:center;padding:6px 22px max(6px, env(safe-area-inset-bottom));min-height:76px;overflow:visible;border-top:1px solid var(--ls-line);background:#fff;z-index:10}
.ls-day-row{display:flex;align-items:center;gap:4px;min-width:0;min-height:0}
.ls-day-nav{flex:0 0 auto;min-width:50px;height:38px;display:inline-flex;align-items:center;justify-content:center;gap:4px;border:1px solid var(--ls-line);background:#fff;color:var(--ls-petrol);font-size:13px;line-height:1;cursor:pointer;padding:0 7px}
.ls-day-nav-word{font-size:9px;text-transform:uppercase;letter-spacing:.07em}
.ls-day-nav:disabled{opacity:.35;cursor:not-allowed}
.ls-days{display:flex;flex:1 1 0;gap:6px;overflow-x:auto;overflow-y:hidden;padding:6px 2px;min-width:0;scroll-snap-type:x proximity;scroll-behavior:smooth;overscroll-behavior-x:contain;scrollbar-width:thin;cursor:grab;touch-action:pan-x;-webkit-overflow-scrolling:touch}
.ls-days.is-scrollable{mask-image:linear-gradient(90deg,transparent 0,#000 10px,#000 calc(100% - 10px),transparent 100%)}
.ls-days.is-dragging{cursor:grabbing;scroll-behavior:auto;scroll-snap-type:none;user-select:none;mask-image:none}
.ls-days::-webkit-scrollbar{height:5px}
.ls-days::-webkit-scrollbar-track{background:transparent}
.ls-days::-webkit-scrollbar-thumb{background:var(--ls-line-strong);border-radius:0}
.ls-day{position:relative;display:flex;flex-direction:column;gap:1px;min-width:76px;min-height:42px;flex:1 1 76px;scroll-snap-align:center;border:1px solid var(--ls-line);background:#fff;padding:6px 8px;text-align:left;cursor:pointer;--ls-day-accent:var(--ls-line-strong)}
.ls-day:before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:var(--ls-day-accent)}
.ls-day[data-track="idea"]{--ls-day-accent:var(--ls-green)}
.ls-day[data-track="failure"]{--ls-day-accent:var(--ls-lilac)}
.ls-day[data-track="transformer"]{--ls-day-accent:var(--ls-petrol)}
.ls-day[data-track="senses"]{--ls-day-accent:var(--ls-sky)}
.ls-day[data-track="assistant"]{--ls-day-accent:var(--ls-teal)}
.ls-day[data-track="questions"]{--ls-day-accent:var(--ls-gold)}
.ls-day.is-track-start{margin-left:0}
.ls-day.is-track-start:after{content:"";position:absolute;left:-3px;top:6px;bottom:6px;width:1px;background:var(--ls-line-strong)}
.ls-day.is-dim{opacity:.44}
.ls-day.is-dim:hover{opacity:.78}
.ls-day:hover{border-color:var(--ls-line-strong)}
.ls-day.is-on{border-color:var(--ls-petrol);box-shadow:0 0 0 1px var(--ls-petrol) inset}
.ls-day-num{font-size:9px;text-transform:uppercase;letter-spacing:.1em;color:var(--ls-petrol);white-space:nowrap}
.ls-day-name{font-size:10px;line-height:1.25;color:var(--ls-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ls-progress{display:flex;flex-direction:column;gap:6px;min-width:0}
.ls-progress-bar{height:3px;background:var(--ls-line);position:relative;overflow:hidden}
.ls-progress-bar span{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--ls-green),var(--ls-blue));transition:width .35s ease}
.ls-steps{display:flex;gap:5px}
.ls-dot{width:22px;height:22px;border:1px solid var(--ls-line);background:#fff;font-size:9px;color:var(--ls-muted);cursor:pointer;padding:0}
.ls-dot.is-on{background:var(--ls-green);border-color:var(--ls-green);color:#fff}
.ls-backdrop{position:fixed;inset:0;background:rgba(0,20,30,.18);z-index:40;backdrop-filter:blur(1px)}
.ls-drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,94vw);background:#fff;border-left:1px solid var(--ls-line-strong);box-shadow:var(--ls-shadow);z-index:50;display:flex;flex-direction:column;transform:translateX(100%);transition:transform .24s ease}
.ls-drawer.is-open{transform:none}
.ls-drawer-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;padding:18px 20px 12px;border-bottom:1px solid var(--ls-line)}
.ls-drawer-head h2{font-size:18px;margin:0}
.ls-lenses{display:flex;gap:5px;flex-wrap:wrap;padding:10px 20px;border-bottom:1px solid var(--ls-line)}
.ls-drawer-body{flex:1;overflow:auto;padding:14px 20px 24px;display:grid;gap:8px;align-content:start}
.ls-drawer-foot{padding:10px 20px;border-top:1px solid var(--ls-line);font-size:10px;color:var(--ls-muted)}
.ls-box{border:1px solid var(--ls-line);background:#fff}
.ls-box summary{cursor:pointer;padding:9px 11px;font-size:12px;font-weight:600;color:var(--ls-ink);list-style:none}
.ls-box summary::-webkit-details-marker{display:none}
.ls-box summary:before{content:"+ ";color:var(--ls-petrol);font-weight:700}
.ls-box[open] summary:before{content:"− "}
.ls-box p{margin:0;padding:0 11px 12px;font-size:12px;line-height:1.6;color:var(--ls-soft)}
.ls-box-lens{display:inline-block;border:1px solid var(--ls-line);background:var(--ls-paper-2);color:var(--ls-muted);font-size:8px;text-transform:uppercase;letter-spacing:.09em;padding:1px 4px;margin-right:6px}
.ls-inline-boxes{display:grid;gap:8px;margin-top:16px}
.ls-tip{position:fixed;z-index:70;background:#fff;border:1px solid var(--ls-line-strong);box-shadow:var(--ls-shadow);padding:10px 12px;font-size:11px;line-height:1.5;color:var(--ls-soft);pointer-events:auto;cursor:pointer}
.ls-tip-kicker{font-size:9px;text-transform:uppercase;letter-spacing:.1em;color:var(--ls-petrol);margin-bottom:3px}
.ls-tip p{margin:0 0 4px}
.ls-tip-more{font-size:9px;color:var(--ls-muted);text-transform:uppercase;letter-spacing:.08em}
.ls-panel{position:fixed;right:18px;bottom:18px;width:min(390px,92vw);max-height:min(560px,84vh);overflow:auto;background:#fff;border:1px solid var(--ls-line-strong);box-shadow:var(--ls-shadow);z-index:75;padding:20px;transform:translateY(16px);opacity:0;transition:.2s ease}
.ls-panel.is-open{transform:none;opacity:1}
.ls-panel-close{position:absolute;top:8px;right:10px;border:0;background:none;font-size:20px;line-height:1;cursor:pointer;color:var(--ls-muted)}
.ls-panel-kicker{font-size:9px;text-transform:uppercase;letter-spacing:.1em;color:var(--ls-petrol);margin-bottom:4px}
.ls-panel h2{font-size:22px;margin:0 0 10px}
.ls-panel-visual{border:1px solid var(--ls-line);background:var(--ls-paper-2);display:grid;place-items:center;padding:12px;margin-bottom:12px}
.ls-panel-visual svg{width:100%;max-width:220px;height:auto}
.ls-panel p{font-size:12px;line-height:1.65;color:var(--ls-soft);margin:0 0 12px}
.ls-panel-link{font-size:11px;color:var(--ls-petrol);font-weight:600;text-decoration:none}
.ls-panel-link:hover{color:var(--ls-blue)}
.ls-chips{display:flex;gap:5px;flex-wrap:wrap}
.ls-chips--sub{opacity:.92}
.ls-chip{border:1px solid var(--ls-line-strong);background:#fff;color:var(--ls-soft);font-size:9px;padding:4px 7px;cursor:pointer;border-radius:0;white-space:nowrap}
.ls-chip:hover{border-color:var(--ls-petrol);color:var(--ls-petrol)}
.ls-chip.is-on{background:var(--ls-petrol);border-color:var(--ls-petrol);color:#fff}
.ls-canvas-wrap{position:relative;width:100%;height:100%;min-height:0}
.ls-canvas-wrap .ls-canvas{position:absolute;inset:0;width:100%;height:100%}
.ls-iframe{display:block;width:100%;height:100%;border:0;background:transparent}
.ls-canvas{display:block;width:100%;height:100%;min-height:0}
.ls-att,.ls-embed,.ls-conv,.ls-tr,.ls-hyper{display:grid;grid-template-rows:minmax(0,1fr) auto;height:100%;min-height:0}
.ls-att-ui,.ls-embed-ui,.ls-conv-ui,.ls-tr-ui,.ls-hyper-ui{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:7px 10px 2px;min-height:0}
.ls-range{display:flex;align-items:center;gap:6px;font-size:9px;text-transform:uppercase;letter-spacing:.07em;color:var(--ls-muted);white-space:nowrap}
.ls-range input{width:120px;accent-color:var(--ls-green)}
.ls-range output{font-size:10px;color:var(--ls-ink);min-width:34px;text-align:right}
.ls-range--hyper{display:none}
.ls-tr-range{width:150px;accent-color:var(--ls-green)}
.ls-sampling{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr) auto auto;gap:10px;padding:4px 2px}
.ls-samp-head{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.ls-samp-head .ls-kicker{margin:0}
.ls-samp-prompt{font-family:"Barlow",sans-serif;font-weight:700;font-size:16px;color:var(--ls-ink)}
.ls-samp-bars{display:grid;gap:4px;align-content:start;overflow:auto;padding-right:4px}
.ls-bar-row{display:grid;grid-template-columns:90px minmax(0,1fr) 52px;gap:8px;align-items:center;font-size:10px;color:var(--ls-soft)}
.ls-bar-row.is-cut{opacity:.35}
.ls-bar-row.is-sampled{color:var(--ls-green);font-weight:600}
.ls-bar-track{display:block;height:16px;background:var(--ls-line);position:relative;overflow:hidden}
.ls-bar-fill{display:block;height:100%;background:linear-gradient(90deg,var(--ls-green),var(--ls-sky));transition:width .25s ease}
.ls-bar-row.is-cut .ls-bar-fill{background:var(--ls-line-strong)}
.ls-bar-row.is-sampled .ls-bar-fill{background:var(--ls-gold)}
.ls-bar-val{text-align:right;font-size:9px;color:var(--ls-muted)}
.ls-samp-controls{display:flex;align-items:center;gap:8px;flex-wrap:wrap;border-top:1px solid var(--ls-line);padding-top:8px}
.ls-samp-readout{display:flex;gap:14px;flex-wrap:wrap;font-size:9px;color:var(--ls-muted)}
.ls-samp-readout b{color:var(--ls-ink);font-weight:600}
.ls-empty{padding:20px;font-size:12px;color:var(--ls-muted)}
@media (max-width:980px){
  .ls-app{grid-template-rows:auto minmax(0,1fr) auto}
  .ls-top{padding:8px 12px;align-items:flex-start}
  .ls-brand span{display:none}
  .ls-controls{gap:6px}
  .ls-main{grid-template-columns:1fr;grid-template-rows:minmax(0,44%) minmax(0,56%)}
  .ls-text{border-right:0;border-bottom:1px solid var(--ls-line)}
  .ls-text-scroll{padding:18px 18px 14px;max-width:none}
  .ls-title{font-size:calc(var(--ls-fs-title,28px) * 0.86);max-width:22ch}
  .ls-body{font-size:calc(var(--ls-fs-body,17px) * 0.88);line-height:1.55}
  .ls-bottom{grid-template-columns:1fr;gap:2px;padding:4px 12px max(6px, env(safe-area-inset-bottom));min-height:0}
  .ls-days{padding:4px 2px}
  .ls-day-nav{min-width:30px;padding:0 6px}
  .ls-day-nav-word{display:none}
  .ls-day{flex:0 0 auto;min-width:96px;min-height:40px}
  .ls-stage-head{padding:8px 12px 6px}
  .ls-stage-foot{padding:5px 12px 7px}
  .ls-demo{padding:6px 8px 2px}
  .ls-drawer{width:100vw}
  .ls-panel{right:8px;bottom:8px;width:calc(100vw - 16px)}
}
@media (prefers-reduced-motion:reduce){
  *,*:before,*:after{animation-duration:.001ms!important;transition-duration:.001ms!important}
}
/* ── smooth, transparent flow ─────────────────────────────── */
.ls-app{background:transparent}
.ls-app:before{
  content:"";position:fixed;inset:-20%;z-index:0;pointer-events:none;
  background:
    radial-gradient(38% 42% at 22% 32%, rgba(99,164,75,.13), transparent 70%),
    radial-gradient(34% 38% at 76% 60%, rgba(18,117,172,.12), transparent 72%),
    radial-gradient(30% 34% at 58% 18%, rgba(145,133,190,.10), transparent 74%),
    radial-gradient(26% 30% at 40% 82%, rgba(0,146,153,.08), transparent 72%);
  filter:blur(28px);
  animation:ls-flow 26s ease-in-out infinite alternate;
}
@keyframes ls-flow{
  0%{transform:translate3d(-1.5%,-1%,0) scale(1)}
  50%{transform:translate3d(1.8%,1.4%,0) scale(1.04)}
  100%{transform:translate3d(-.6%,2%,0) scale(1.01)}
}
.ls-top,.ls-bottom{background:rgba(255,255,255,.68);backdrop-filter:blur(16px) saturate(1.2);border-color:rgba(0,75,111,.06)}
.ls-main{position:relative;z-index:1}
.ls-text{background:transparent;border-right:0;-webkit-mask-image:linear-gradient(90deg,#000 0%,#000 86%,transparent 100%);mask-image:linear-gradient(90deg,#000 0%,#000 86%,transparent 100%)}
.ls-stage{background:transparent}
.ls-stage:before{display:none}
.ls-stage:after{content:"";position:absolute;inset:6% 4% 8% 4%;z-index:0;pointer-events:none;background:radial-gradient(circle at 52% 46%,rgba(99,164,75,.07),rgba(18,117,172,.045) 42%,transparent 72%);filter:blur(24px)}
.ls-demo{z-index:1}
.ls-stage-head,.ls-stage-foot{background:transparent;border-color:rgba(0,75,111,.06)}
.ls-demo{background:transparent}
.ls-canvas{background:transparent}
.ls-text-scroll,.ls-demo{transition:opacity .32s ease,filter .32s ease,transform .32s ease}
.ls-text-scroll.is-out,.ls-demo.is-out{opacity:0;filter:blur(8px);transform:translateY(7px)}
.ls-title{letter-spacing:-.025em}
.ls-body{color:#2c464d}
.ls-watch{border-top:1px solid rgba(0,75,111,.08)}
.ls-btn,.ls-seg,.ls-select,.ls-day{background:rgba(255,255,255,.62);border-color:rgba(0,75,111,.10);box-shadow:0 1px 2px rgba(0,20,30,.035)}
.ls-btn:hover,.ls-day:hover{border-color:rgba(0,75,111,.24);box-shadow:0 2px 8px rgba(0,20,30,.06)}
.ls-btn--primary{background:var(--ls-petrol);border-color:transparent;box-shadow:0 2px 10px rgba(0,75,111,.16)}
.ls-seg button.is-on{background:var(--ls-petrol);box-shadow:0 1px 6px rgba(0,75,111,.18)}
.ls-day.is-on{background:var(--ls-green);border-color:var(--ls-green);color:#fff;box-shadow:0 2px 10px rgba(99,164,75,.18)}
.ls-day.is-on .ls-day-num,.ls-day.is-on .ls-day-name{color:#fff}
.ls-dot{border-color:rgba(0,75,111,.10);background:rgba(255,255,255,.62)}
.ls-progress-bar{background:rgba(0,75,111,.08)}
.ls-progress-bar span{background:linear-gradient(90deg,var(--ls-green),var(--ls-blue));box-shadow:0 0 10px rgba(99,164,75,.25)}
.ls-chip{border-color:rgba(0,75,111,.10);background:rgba(255,255,255,.62)}
.ls-chip.is-on{background:var(--ls-petrol);border-color:transparent;box-shadow:0 1px 6px rgba(0,75,111,.18)}
.ls-bar-track{background:rgba(0,75,111,.07)}
.ls-bar-fill{background:linear-gradient(90deg,rgba(99,164,75,.95),rgba(92,155,175,.95));box-shadow:0 0 8px rgba(99,164,75,.18)}
.ls-term{border-bottom-color:rgba(18,117,172,.45)}
.ls-depth-tree{margin:14px 0 0;border-top:1px solid rgba(0,75,111,.10)}
.ls-deepbox{border:0;background:transparent;margin:0;padding:0}
.ls-deepbox>summary{cursor:pointer;list-style:none;padding:5px 0;font-family:"Barlow",sans-serif;font-weight:700;font-size:11px;color:var(--ls-soft);border-bottom:1px solid rgba(0,75,111,.07)}
.ls-deepbox--root>summary{padding:8px 0;font-size:12px;color:var(--ls-petrol);border-bottom:0}
.ls-deepbox>summary::-webkit-details-marker{display:none}
.ls-deepbox>summary:before{content:"+ ";color:var(--ls-green);font-weight:700}
.ls-deepbox[open]>summary:before{content:"− "}
.ls-deepbox>p{font-size:var(--ls-fs-body,17px);line-height:1.65;color:var(--ls-soft);margin:0;padding:6px 0 8px;max-width:62ch}
.ls-deepbox .ls-deepbox{margin-left:0;padding-left:0;border-left:0}
.ls-deepbox .ls-deepbox>summary{font-size:11px;color:var(--ls-soft)}
.ls-depth-count{font-family:"Open Sans",sans-serif;font-weight:400;font-size:8px;color:var(--ls-muted);margin-left:6px;text-transform:uppercase;letter-spacing:.08em}
.ls-depth-hint{font-size:10px;color:var(--ls-muted);letter-spacing:.02em;margin-top:14px}
.ls-depth-hint button{border:0;background:none;color:var(--ls-petrol);font:inherit;font-weight:600;cursor:pointer;padding:0;text-decoration:underline;text-underline-offset:2px}
.ls-text-scroll{transition:opacity .08s ease,filter .08s ease}
.ls-text-scroll.is-out{opacity:0;filter:blur(3px);transform:none}
.ls-demo{view-transition-name:ls-demo}
::view-transition-old(root),::view-transition-new(root){animation:none}
::view-transition-old(ls-demo){animation:ls-demo-out .42s cubic-bezier(.2,.8,.2,1) both}
::view-transition-new(ls-demo){animation:ls-demo-in .42s cubic-bezier(.2,.8,.2,1) both}
@keyframes ls-demo-out{to{opacity:0;transform:scale(1.03);filter:blur(3px)}}
@keyframes ls-demo-in{from{opacity:0;transform:scale(.97);filter:blur(3px)}}
.ls-cues{margin-top:26px}
.ls-cue{padding:6px 0 6px 16px;border-left:1px solid rgba(0,75,111,.10);margin:18px 0;transition:border-color .3s ease,opacity .3s ease}
.ls-cue.is-active{border-left-color:var(--ls-green)}
.ls-cue--reset{height:1px;margin:0;padding:0;border:0}
.ls-cue-kicker{font-size:9px;text-transform:uppercase;letter-spacing:.1em;color:var(--ls-green);margin-bottom:4px}
.ls-cue h3{font-size:18px;margin:0 0 6px}
.ls-cue p{font-size:13px;line-height:1.65;color:var(--ls-soft);margin:0;max-width:62ch}
.ls-morph-overlay{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:5}
.ls-body{font-size:var(--ls-fs-body,17px)}
.ls-title{font-size:var(--ls-fs-title,28px)}
.ls-watch{font-size:calc(var(--ls-fs-body,17px) * 0.82)}
.ls-context p,.ls-cue p,.ls-term-note{font-size:calc(var(--ls-fs-body,17px) * 0.8)}
.ls-footnote{font-size:var(--ls-fs-small,12px)}
.ls-font{gap:4px}
.ls-font output{font-size:10px;min-width:34px;text-align:center;color:var(--ls-ink)}
.ls-font .ls-btn{padding:3px 6px}
.ls-focus-btn{margin-left:auto}
.ls-app.is-demo-focus .ls-text{display:none}
.ls-app.is-demo-focus .ls-main{grid-template-columns:1fr}
.ls-app.is-demo-focus .ls-stage{border-left:0}
.ls-canvas{touch-action:none}
.ls-term-wrap{display:inline}
.ls-term-note{display:block;margin:8px 0 12px;padding:10px 13px;border-left:2px solid var(--ls-green);background:rgba(255,255,255,.55);font-size:12px;line-height:1.6;color:var(--ls-soft)}
.ls-term-note[hidden]{display:none}
.ls-term-def{display:block;margin-bottom:8px}
.ls-term-visual{display:block;margin:8px 0}
.ls-term-visual svg{width:100%;max-width:180px;height:auto}
.ls-term-link{font-size:10px;font-weight:600;color:var(--ls-petrol);text-decoration:none}
.ls-term-wrap.is-open .ls-term{color:var(--ls-blue);border-bottom-style:solid}
@media (prefers-reduced-motion:reduce){
  .ls-app:before{animation:none}
  ::view-transition-old(ls-demo),::view-transition-new(ls-demo){animation:none}
}
