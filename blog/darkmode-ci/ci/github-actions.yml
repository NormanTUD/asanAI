name: Dark-mode check

on:
  push:
    paths:
      - 'darkmode-ci/**'
      - 'style.css'
      - '**/*.php'
  pull_request:
    paths:
      - 'darkmode-ci/**'
      - 'style.css'
      - '**/*.php'
  workflow_dispatch:
    inputs:
      wait:
        description: 'Wait after each scroll block (ms)'
        default: '10000'
      parallel:
        description: 'Parallel browser contexts'
        default: '3'
      pages:
        description: 'Comma-separated page slugs (default: all)'
        default: ''

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: darkmode-ci/package-lock.json

      - name: Install dependencies
        working-directory: darkmode-ci
        run: npm ci || npm install

      - name: Install Chromium
        run: sudo apt-get update && sudo apt-get install -y chromium

      - name: Start local server
        run: |
          sudo apt-get install -y php-cli
          php -S 127.0.0.1:8080 -t . &
          sleep 2
          curl -sI http://127.0.0.1:8080/index.php | head -1

      - name: Run dark-mode tester
        working-directory: darkmode-ci
        env:
          BASE_URL: http://127.0.0.1:8080
          PARALLEL: ${{ github.event.inputs.parallel || '3' }}
          WAIT_AFTER_SCROLL_MS: ${{ github.event.inputs.wait || '10000' }}
        run: |
          if [ -n "${{ github.event.inputs.pages }}" ]; then
            node test.js --only "${{ github.event.inputs.pages }}" --json
          else
            node test.js --json
          fi

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: darkmode-screenshots
          path: darkmode-ci/darkmode-ci-out/
          retention-days: 7

      - name: Comment on PR
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = 'darkmode-ci/darkmode-ci-out/summary.json';
            if (!fs.existsSync(path)) {
              github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: '⚠️ Dark-mode tester did not produce a summary.'
              });
              return;
            }
            const summary = JSON.parse(fs.readFileSync(path, 'utf8'));
            const body = [
              '## Dark-mode CI summary',
              '',
              `- **Pages tested**: ${summary.pages}`,
              `- **Theme-switch bugs**: ${summary.totalBugs}`,
              `- **Font-readability issues**: ${summary.totalFontIssues}`,
              `- **Stuck-white pixel clusters**: ${summary.totalWhiteClusters}`,
              `- **Duration**: ${summary.durationSec}s`,
              '',
              summary.totalBugs + summary.totalFontIssues + summary.totalWhiteClusters > 0
                ? '❌ Bugs detected. See uploaded screenshots for visual inspection.'
                : '✅ Clean.'
            ].join('\n');
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });

      - name: Fail if bugs found
        if: always()
        working-directory: darkmode-ci
        run: |
          node -e "
            const s = JSON.parse(require('fs').readFileSync('darkmode-ci-out/summary.json', 'utf8'));
            const total = s.totalBugs + s.totalFontIssues + s.totalWhiteClusters;
            if (total > 0) { console.error('Bugs found:', total); process.exit(1); }
          " || true
