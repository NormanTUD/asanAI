<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Sprache als Fenster — Garben, Schnitte, Welt</title>
<script>
MathJax = { tex: { inlineMath: [['$','$']], displayMath: [['$$','$$']] },
            svg: { fontCache: 'global' } };
</script>
<script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,600;9..144,900&family=Inter:wght@300;400;600&family=JetBrains+Mono:wght@400;600&display=swap');

:root{
  --bg:#07090d; --bg2:#0d1118; --ink:#eef2f8; --dim:#8b96ad;
  --accent:#7dd3fc; --accent2:#c084fc; --warm:#fbbf24; --coral:#fb7185;
  --emerald:#34d399; --line:rgba(125,211,252,.18);
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--ink);
  font-family:Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}

#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
.slide{position:absolute;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;padding:4vh 6vw;
  opacity:0;pointer-events:none;transform:translateY(24px) scale(.985);
  transition:opacity .7s cubic-bezier(.2,.9,.2,1),transform .7s cubic-bezier(.2,.9,.2,1)}
.slide.on{opacity:1;pointer-events:auto;transform:none}

h1{font-family:Fraunces,serif;font-weight:900;font-size:clamp(2.4rem,6vw,5.2rem);
  line-height:.98;letter-spacing:-.03em;margin-bottom:.4em;
  background:linear-gradient(135deg,#fff 0%,var(--accent) 55%,var(--accent2) 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent}
h2{font-family:Fraunces,serif;font-weight:600;font-size:clamp(1.5rem,3.2vw,2.6rem);
  letter-spacing:-.02em;margin-bottom:.5em;color:var(--ink)}
h3{font-family:Fraunces,serif;font-weight:600;font-size:clamp(1.05rem,1.9vw,1.5rem);
  color:var(--accent);margin-bottom:.4em}
p{font-size:clamp(.95rem,1.35vw,1.2rem);line-height:1.65;color:var(--dim);
  max-width:72ch;margin-bottom:.9em}
p strong{color:var(--ink);font-weight:600}
em{color:var(--warm);font-style:italic}
.mono{font-family:'JetBrains Mono',monospace}
.kicker{font-family:'JetBrains Mono',monospace;font-size:.72rem;letter-spacing:.22em;
  text-transform:uppercase;color:var(--accent);margin-bottom:1.4em;opacity:.85}
.big{font-size:clamp(1.3rem,2.6vw,2rem);line-height:1.45;color:var(--ink);
  max-width:60ch;font-weight:300}
.quote{border-left:3px solid var(--accent);padding-left:1.4em;margin:1.4em 0;
  font-family:Fraunces,serif;font-size:clamp(1.1rem,2vw,1.6rem);
  line-height:1.4;color:var(--ink);font-weight:300;max-width:52ch}

canvas{display:block;border-radius:14px;max-width:100%;
  box-shadow:0 30px 80px -30px rgba(0,0,0,.9),0 0 0 1px var(--line) inset}
.wrap{display:flex;gap:3vw;align-items:center;justify-content:center;
  flex-wrap:wrap;width:100%;max-width:1500px}
.col{flex:1 1 380px;min-width:300px;max-width:620px}
.full{width:100%;max-width:1400px}

#hud{position:fixed;bottom:0;left:0;right:0;height:52px;
  display:flex;align-items:center;justify-content:space-between;
  padding:0 2vw;background:linear-gradient(to top,rgba(7,9,13,.96),transparent);
  z-index:100;font-family:'JetBrains Mono',monospace;font-size:.7rem;
  letter-spacing:.14em;color:var(--dim);text-transform:uppercase}
#bar{position:fixed;top:0;left:0;height:2px;z-index:101;
  background:linear-gradient(90deg,var(--accent),var(--accent2),var(--warm));
  transition:width .55s cubic-bezier(.2,.9,.2,1);box-shadow:0 0 14px var(--accent)}
#chap{color:var(--accent)}
.keyhint{display:flex;gap:.5em;align-items:center}
kbd{background:rgba(125,211,252,.1);border:1px solid var(--line);
  border-radius:4px;padding:.15em .45em;font-size:.68rem;color:var(--accent)}

.badge{display:inline-block;padding:.22em .7em;border-radius:99px;
  font-family:'JetBrains Mono',monospace;font-size:.64rem;letter-spacing:.14em;
  text-transform:uppercase;margin-bottom:1em}
.b-math{background:rgba(125,211,252,.14);color:var(--accent)}
.b-lang{background:rgba(192,132,252,.14);color:var(--accent2)}
.b-warn{background:rgba(251,113,133,.14);color:var(--coral)}
.b-ok{background:rgba(52,211,153,.14);color:var(--emerald)}

.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));
  gap:1.4rem;width:100%;max-width:1200px;margin-top:1.4em}
.card{background:linear-gradient(160deg,rgba(255,255,255,.035),rgba(255,255,255,.012));
  border:1px solid var(--line);border-radius:14px;padding:1.3rem 1.4rem}
.card h4{font-family:Fraunces,serif;font-size:1.1rem;color:var(--accent);
  margin-bottom:.45em;font-weight:600}
.card p{font-size:.88rem;margin:0;line-height:1.55}

.ctl{display:flex;gap:1.6rem;align-items:center;justify-content:center;
  flex-wrap:wrap;margin-top:1.2em;padding:.9rem 1.4rem;
  background:rgba(255,255,255,.025);border:1px solid var(--line);border-radius:12px}
.ctl label{font-family:'JetBrains Mono',monospace;font-size:.72rem;
  color:var(--dim);display:flex;flex-direction:column;gap:.4em;min-width:170px}
.ctl label b{color:var(--accent);font-weight:600}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:3px;
  background:rgba(125,211,252,.22);border-radius:2px;outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:15px;height:15px;
  border-radius:50%;background:var(--accent);cursor:pointer;
  box-shadow:0 0 12px var(--accent)}
button.pill{background:rgba(125,211,252,.1);border:1px solid var(--line);
  color:var(--accent);padding:.45em 1.1em;border-radius:99px;cursor:pointer;
  font-family:'JetBrains Mono',monospace;font-size:.72rem;letter-spacing:.1em;
  text-transform:uppercase;transition:all .22s}
button.pill:hover{background:rgba(125,211,252,.22);transform:translateY(-1px)}
button.pill.on{background:var(--accent);color:#07090d}

.readout{font-family:'JetBrains Mono',monospace;font-size:.78rem;
  color:var(--emerald);background:rgba(52,211,153,.07);
  border-left:2px solid var(--emerald);padding:.7em 1em;border-radius:0 8px 8px 0;
  margin-top:1em;line-height:1.6;white-space:pre-wrap;max-width:70ch}

.legend{display:flex;gap:1.5rem;flex-wrap:wrap;justify-content:center;
  margin-top:.9em;font-size:.76rem;color:var(--dim);
  font-family:'JetBrains Mono',monospace}
.legend i{width:10px;height:10px;border-radius:50%;display:inline-block;
  margin-right:.4em;vertical-align:middle}

.fade-up{opacity:0;transform:translateY(16px);
  transition:all .6s cubic-bezier(.2,.9,.2,1)}
.on .fade-up{opacity:1;transform:none}
.on .fade-up:nth-child(1){transition-delay:.1s}
.on .fade-up:nth-child(2){transition-delay:.2s}
.on .fade-up:nth-child(3){transition-delay:.3s}
.on .fade-up:nth-child(4){transition-delay:.4s}
.on .fade-up:nth-child(5){transition-delay:.5s}
.on .fade-up:nth-child(6){transition-delay:.6s}

mjx-container{color:var(--ink)!important}
</style>
</head>
<body>
<div id="bar"></div>
<div id="stage"></div>
<div id="hud">
  <span id="chap">—</span>
  <span class="keyhint"><kbd>←</kbd><kbd>→</kbd> navigieren · <kbd>Leertaste</kbd> weiter</span>
  <span id="num">1 / 1</span>
</div>

<script>
/* ═══════════════════════════════════════════════════════════
   SLIDE DEFINITIONS
   ═══════════════════════════════════════════════════════════ */
const S = [];
const add = (chapter, html, init) => S.push({chapter, html, init});

/* ── 0 · TITEL ───────────────────────────────────────────── */
add('Ouvertüre', `
<canvas id="c_title" width="1600" height="760" style="position:absolute;inset:0;width:100%;height:100%;border-radius:0;box-shadow:none;opacity:.5"></canvas>
<div style="position:relative;z-index:2;text-align:center">
  <div class="kicker fade-up">Garbentheorie · Semantik · Welt</div>
  <h1 class="fade-up">Sprache als<br>Fenster</h1>
  <p class="big fade-up" style="margin:0 auto">
    Jede Sprache ist ein <em>Schnitt</em> über demselben Situs.<br>
    Nicht konkurrierende Beschreibungen derselben Welt —<br>
    sondern verschiedene Perspektiven auf dieselben Keime.
  </p>
</div>`, () => {
  const cv = document.getElementById('c_title'), x = cv.getContext('2d');
  const W = cv.width, H = cv.height;
  const pts = [];
  for (let i = 0; i < 260; i++) pts.push({
    x: Math.random()*W, y: Math.random()*H,
    vx: (Math.random()-.5)*.22, vy: (Math.random()-.5)*.22,
    r: Math.random()*1.9+.5, h: Math.random()*70+180
  });
  let t = 0;
  (function loop(){
    if (!cv.isConnected) return;
    t += .004;
    x.clearRect(0,0,W,H);
    // filaments
    for (let i=0;i<pts.length;i++) for (let j=i+1;j<pts.length;j++){
      const a=pts[i],b=pts[j], d=Math.hypot(a.x-b.x,a.y-b.y);
      if (d<128){ x.strokeStyle=`hsla(205,80%,65%,${(1-d/128)*.13})`;
        x.lineWidth=.6; x.beginPath(); x.moveTo(a.x,a.y); x.lineTo(b.x,b.y); x.stroke(); }
    }
    pts.forEach(p=>{
      p.x+=p.vx; p.y+=p.vy;
      if(p.x<0||p.x>W)p.vx*=-1; if(p.y<0||p.y>H)p.vy*=-1;
      const g=x.createRadialGradient(p.x,p.y,0,p.x,p.y,p.r*5);
      g.addColorStop(0,`hsla(${p.h},85%,72%,.9)`);
      g.addColorStop(1,`hsla(${p.h},85%,72%,0)`);
      x.fillStyle=g; x.beginPath(); x.arc(p.x,p.y,p.r*5,0,7); x.fill();
    });
    requestAnimationFrame(loop);
  })();
});

/* ── 1 · DIE FRAGE ───────────────────────────────────────── */
add('Ouvertüre', `
<div style="max-width:1000px">
  <div class="kicker fade-up">Die Frage</div>
  <h2 class="fade-up">Warum sieht man nicht, was man nicht sagen kann?</h2>
  <p class="fade-up"><strong>Russisch</strong> hat zwei Grundwörter für Blau:
  <span class="mono" style="color:var(--accent)">голубой</span> (hell) und
  <span class="mono" style="color:var(--accent2)">синий</span> (dunkel).
  Russischsprachige unterscheiden diese Töne messbar schneller — ein Effekt von
  Millisekunden, lateralisiert, der unter verbaler Interferenz verschwindet.</p>
  <p class="fade-up"><strong>Deutsch</strong> hat <em>Geist</em>, <em>Gemüt</em>,
  <em>Verstand</em>, wo Englisch <em>mind</em> hat. Nicht unübersetzbar —
  aber nicht <em>eins zu eins</em> übersetzbar.</p>
  <div class="quote fade-up">
    Das sind keine verschiedenen Welten.<br>
    Das sind verschiedene <em>Schnitte</em> über derselben.
  </div>
  <p class="fade-up" style="color:var(--coral);font-size:.9rem">
    ⚠ Die starke Sapir-Whorf-These trägt nicht. Die schwache Version —
    Sprache beeinflusst Aufmerksamkeitsallokation und Default-Partitionierung —
    ist gut belegt. Darauf bauen wir.</p>
</div>`);

/* ── 2 · DER BASISRAUM ───────────────────────────────────── */
add('I · Der Situs', `
<div class="wrap">
  <div class="col">
    <div class="badge b-math fade-up">Basisraum</div>
    <h2 class="fade-up">Die Welt als Zustandsraum</h2>
    <p class="fade-up">Der Basisraum $B$ ist nicht die Raumzeit. Er ist der
    <strong>Zustandsraum aller Sachverhalte und Situationen</strong>.
    Die Raumzeit $(x,y,z,t)$ ist einer seiner Unterräume — eine
    <em>mögliche Faserung</em> unter vielen.</p>
    <p class="fade-up">Jeder Punkt ist ein <strong>Keim</strong>: ein Ort, an dem
    Messung stattfinden kann. Nicht nur Temperatur und Druck — auch leiblich
    wahrgenommene Atmosphäre, Regelmäßigkeit, <em>Gemütlichkeit</em>.</p>
    <div class="readout fade-up">Topologie ohne Metrik:
  "gemütlich" ist näher an "warm" als an "kalt"
  — ohne dass ein exakter Abstand angebbar wäre.
  Das reicht. Eine Topologie braucht keine Zahl.</div>
  </div>
  <div class="col">
    <canvas id="c_base" width="700" height="620"></canvas>
    <div class="ctl">
      <label>Dichte der Keime <b id="l_dens">120</b>
        <input type="range" id="r_dens" min="30" max="400" value="120"></label>
      <button class="pill" id="b_rot">Rotation</button>
    </div>
  </div>
</div>`, () => {
  const cv=document.getElementById('c_base'), x=cv.getContext('2d');
  const W=cv.width,H=cv.height;
  let N=120, rot=true, t=0;
  let pts=[];
  const gen=()=>{ pts=[];
    for(let i=0;i<N;i++){
      const u=Math.random(), v=Math.random(), w=Math.random();
      const r=Math.cbrt(u)*0.92;
      const th=v*Math.PI*2, ph=Math.acos(2*w-1);
      pts.push({
        x:r*Math.sin(ph)*Math.cos(th),
        y:r*Math.sin(ph)*Math.sin(th),
        z:r*Math.cos(ph),
        h:180+Math.random()*90,
        s:Math.random()*1.6+.7
      });
    }
  };
  gen();
  document.getElementById('r_dens').oninput=e=>{
    N=+e.target.value; document.getElementById('l_dens').textContent=N; gen();
  };
  document.getElementById('b_rot').onclick=e=>{
    rot=!rot; e.target.classList.toggle('on',rot);
  };
  document.getElementById('b_rot').classList.add('on');

  (function loop(){
    if(!cv.isConnected) return;
    if(rot) t+=.0042;
    x.clearRect(0,0,W,H);
    const cx=W/2, cy=H/2, sc=Math.min(W,H)*0.40;

    // soft nebula backdrop
    const bg=x.createRadialGradient(cx,cy,0,cx,cy,sc*1.7);
    bg.addColorStop(0,'rgba(125,211,252,.06)');
    bg.addColorStop(.55,'rgba(192,132,252,.035)');
    bg.addColorStop(1,'rgba(0,0,0,0)');
    x.fillStyle=bg; x.beginPath(); x.arc(cx,cy,sc*1.7,0,7); x.fill();

    // projected points
    const proj=pts.map(p=>{
      const ca=Math.cos(t), sa=Math.sin(t);
      const X= p.x*ca - p.z*sa;
      const Z= p.x*sa + p.z*ca;
      const cb=Math.cos(.46), sb=Math.sin(.46);
      const Y= p.y*cb - Z*sb;
      const Z2= p.y*sb + Z*cb;
      const persp = 1/(1.9 - Z2*0.55);
      return {sx:cx+X*sc*persp, sy:cy+Y*sc*persp, d:Z2, p, persp};
    }).sort((a,b)=>a.d-b.d);

    // filaments between near neighbours
    for(let i=0;i<proj.length;i++){
      for(let j=i+1;j<Math.min(i+7,proj.length);j++){
        const a=proj[i], b=proj[j];
        const dd=Math.hypot(a.sx-b.sx, a.sy-b.sy);
        if(dd<70){
          x.strokeStyle=`hsla(${a.p.h},80%,70%,${(1-dd/70)*.10})`;
          x.lineWidth=.6;
          x.beginPath(); x.moveTo(a.sx,a.sy); x.lineTo(b.sx,b.sy); x.stroke();
        }
      }
    }

    // keims
    proj.forEach(q=>{
      const al=.28+ (q.d+1)/2*.62;
      const rr=q.p.s*q.persp*2.1;
      const g=x.createRadialGradient(q.sx,q.sy,0,q.sx,q.sy,rr*4.5);
      g.addColorStop(0,`hsla(${q.p.h},88%,76%,${al})`);
      g.addColorStop(1,`hsla(${q.p.h},88%,76%,0)`);
      x.fillStyle=g; x.beginPath(); x.arc(q.sx,q.sy,rr*4.5,0,7); x.fill();
      x.fillStyle=`hsla(${q.p.h},95%,88%,${al})`;
      x.beginPath(); x.arc(q.sx,q.sy,rr*.55,0,7); x.fill();
    });

    // outer shell
    x.strokeStyle='rgba(125,211,252,.16)'; x.lineWidth=1;
    x.beginPath(); x.arc(cx,cy,sc*0.94,0,7); x.stroke();

    x.font='11px "JetBrains Mono", monospace';
    x.fillStyle='rgba(139,150,173,.75)';
    x.fillText('B  ·  Zustandsraum aller Sachverhalte', 18, H-18);

    requestAnimationFrame(loop);
  })();
});

/* ── 3 · KEIM & HALM ─────────────────────────────────────── */
add('I · Der Situs', `
<div class="wrap">
  <div class="col">
    <div class="badge b-math fade-up">Keim · Halm · Schnitt</div>
    <h2 class="fade-up">Ein Punkt, viele Messungen</h2>
    <p class="fade-up">Über jedem <strong>Keim</strong> liegt ein <strong>Halm</strong>:
    die Gesamtheit aller Messungen, die dort stattfinden können.
    Temperatur, Druck, Energie — aber auch <em>Atmosphäre</em>,
    <em>Regelmäßigkeit</em>, <em>Gemütlichkeit</em>.</p>
    <p class="fade-up">Ein <strong>Schnitt</strong> wählt aus jedem Halm einen Wert.
    Verschiedene Sprachen wählen verschiedene Schnitte — oder sehen
    manche Halme gar nicht.</p>
    <div class="readout fade-up" id="rd_halm">Halm bei Keim #—
  warte auf Auswahl …</div>
  </div>
  <div class="col">
    <canvas id="c_halm" width="700" height="620"></canvas>
    <div class="ctl">
      <label>Keim wählen <b id="l_germ">3</b>
        <input type="range" id="r_germ" min="0" max="5" value="3"></label>
      <button class="pill on" id="b_sect">Schnitt zeigen</button>
    </div>
  </div>
</div>`, () => {
  const cv=document.getElementById('c_halm'), x=cv.getContext('2d');
  const W=cv.width,H=cv.height;
  const germs=[.12,.26,.40,.54,.68,.84];
  const meas=[
    {n:'Temperatur', h:10,  v:[.52,.61,.49,.70,.44,.58]},
    {n:'Druck',      h:200, v:[.41,.38,.55,.62,.51,.47]},
    {n:'Energie',    h:270, v:[.66,.58,.72,.49,.63,.55]},
    {n:'Atmosphäre', h:330, v:[.33,.71,.44,.80,.39,.68]},
    {n:'Regelmäßigkeit',h:150,v:[.58,.44,.66,.53,.72,.41]},
    {n:'Gemütlichkeit',h:40, v:[.28,.52,.37,.84,.31,.60]}
  ];
  let sel=3, showSec=true, t=0;
  const upd=()=>{
    const r=document.getElementById('rd_halm');
    r.textContent='Halm bei Keim #'+sel+'\n'+
      meas.map(m=>'  '+m.n.padEnd(16,' ')+' = '+m.v[sel].toFixed(3)).join('\n');
  };
  document.getElementById('r_germ').oninput=e=>{
    sel=+e.target.value; document.getElementById('l_germ').textContent=sel; upd();
  };
  document.getElementById('b_sect').onclick=e=>{
    showSec=!showSec; e.target.classList.toggle('on',showSec);
  };
  upd();

  (function loop(){
    if(!cv.isConnected) return;
    t+=.016;
    x.clearRect(0,0,W,H);
    const baseY=H-90, left=70, right=W-50;

    // base line (Basisraum)
    x.strokeStyle='rgba(125,211,252,.45)'; x.lineWidth=2;
    x.beginPath(); x.moveTo(left,baseY); x.lineTo(right,baseY); x.stroke();
    x.font='12px "JetBrains Mono", monospace';
    x.fillStyle='rgba(125,211,252,.8)';
    x.fillText('Basisraum  B', left, baseY+30);

    germs.forEach((g,gi)=>{
      const gx=left+(right-left)*g;
      const isSel = gi===sel;

      // stalk column
      const topY = baseY - 420;
      const grd=x.createLinearGradient(0,baseY,0,topY);
      grd.addColorStop(0, isSel?'rgba(125,211,252,.22)':'rgba(125,211,252,.05)');
      grd.addColorStop(1,'rgba(125,211,252,0)');
      x.fillStyle=grd;
      x.fillRect(gx-20, topY, 40, baseY-topY);

      // measurements on stalk
      meas.forEach((m,mi)=>{
        const y = baseY - 60 - mi*62 - Math.sin(t+mi*.6+gi)*2;
        const val=m.v[gi];
        const al = isSel?.95:.22;
        const rr = isSel? 7 : 4;
        const g2=x.createRadialGradient(gx,y,0,gx,y,rr*4);
        g2.addColorStop(0,`hsla(${m.h},85%,70%,${al})`);
        g2.addColorStop(1,`hsla(${m.h},85%,70%,0)`);
        x.fillStyle=g2; x.beginPath(); x.arc(gx,y,rr*4,0,7); x.fill();
        x.fillStyle=`hsla(${m.h},92%,80%,${al})`;
        x.beginPath(); x.arc(gx,y,rr,0,7); x.fill();

        if(isSel){
          x.font='11px "JetBrains Mono", monospace';
          x.fillStyle=`hsla(${m.h},85%,78%,.95)`;
          x.textAlign='left';
          x.fillText(m.n+'  '+val.toFixed(2), gx+18, y+4);
          x.textAlign='start';
        }
      });

      // germ dot on base
      x.fillStyle = isSel? '#fbbf24' : 'rgba(125,211,252,.55)';
      x.beginPath(); x.arc(gx,baseY, isSel?7:4.5, 0,7); x.fill();
      if(isSel){

  const cv=document.getElementById('c_kin'), x=cv.getContext('2d');

  b1.onclick=()=>{mode=1;b1.classList.add('on');b0.classList.remove('on');};

  // kin nodes: g = generation (+1 parents, 0 ego), lineal/collateral, sex
  const K=[
    {id:'FF', n:'FF', g:2, c:-1.6, s:'m'},
    {id:'FM', n:'FM', g:2, c:-0.8, s:'f'},
    {id:'MF', n:'MF', g:2, c:0.8,  s:'m'},
    {id:'MM', n:'MM', g:2, c:1.6,  s:'f'},
    {id:'FB', n:'FB', g:1, c:-1.7, s:'m'},
    {id:'FZ', n:'FZ', g:1, c:-1.1, s:'f'},
    {id:'F',  n:'F',  g:1, c:-0.45,s:'m'},
    {id:'M',  n:'M',  g:1, c:0.45, s:'f'},
    {id:'MB', n:'MB', g:1, c:1.1,  s:'m'},
    {id:'MZ', n:'MZ', g:1, c:1.7,  s:'f'},
    {id:'B',  n:'B',  g:0, c:-0.75,s:'m'},
    {id:'EGO',n:'EGO',g:0, c:0,    s:'·'},
    {id:'Z',  n:'Z',  g:0, c:0.75, s:'f'}
  ];
  const near=[['FB','FZ'],['FZ','F'],['F','M'],['M','MB'],['MB','MZ'],
              ['FF','FM'],['FM','MF'],['MF','MM'],
              ['F','FB'],['M','MZ'],['B','EGO'],['EGO','Z'],
              ['FF','FB'],['FM','FZ'],['MF','MB'],['MM','MZ'],
              ['F','EGO'],['M','EGO']];

  const pos=p=>({ px: W/2 + p.c*W*0.155, py: H-110 - p.g*160 });

  (function loop(){
    if(!cv.isConnected) return;
    t+=.015;

      x.font='10px "JetBrains Mono", monospace';
      x.fillStyle='rgba(139,150,173,.5)';
      x.fillText('g = +'+g, 42, y-8);
    }

    if(mode===1){
      near.forEach(([a,b])=>{
        const A=pos(K.find(k=>k.id===a)), B=pos(K.find(k=>k.id===b));
        x.strokeStyle='rgba(52,211,153,.35)';
        x.lineWidth=1.8;
        x.setLineDash([5,4]); x.lineDashOffset=-t*12;
        x.beginPath(); x.moveTo(A.px,A.py); x.lineTo(B.px,B.py); x.stroke();
        x.setLineDash([]);
      });
    }

    K.forEach((k,i)=>{
      const {px,py}=pos(k);
      const yy=py+Math.sin(t*1.2+i*.5)*2;
      const hue = k.s==='m' ? 200 : k.s==='f' ? 330 : 48;
      const g=x.createRadialGradient(px,yy,0,px,yy,30);
      g.addColorStop(0,`hsla(${hue},85%,68%,.6)`);
      g.addColorStop(1,`hsla(${hue},85%,68%,0)`);
      x.fillStyle=g; x.beginPath(); x.arc(px,yy,30,0,7); x.fill();
      x.fillStyle = k.id==='EGO' ? '#fbbf24' : `hsla(${hue},92%,80%,1)`;
      x.beginPath(); x.arc(px,yy, k.id==='EGO'?8:6.5, 0,7); x.fill();
      if(k.id==='EGO'){
        x.strokeStyle='rgba(251,191,36,.45)'; x.lineWidth=1.4;
        x.beginPath(); x.arc(px,yy,16+Math.sin(t*2)*2,0,7); x.stroke();
      }
      x.font='12px "JetBrains Mono", monospace';
      x.fillStyle='rgba(238,242,248,.92)';
      x.textAlign='center';
      x.fillText(k.n, px, yy-16);
      x.textAlign='start';
    });

    x.font='11px "JetBrains Mono", monospace';
    x.fillStyle='rgba(139,150,173,.65)';
    x.fillText('B  ·  biologisch-soziale Relationen, sprachunabhängig', 36, 34);
    x.fillStyle='rgba(125,211,252,.6)';
    x.fillText('F=Vater  M=Mutter  B=Bruder  Z=Schwester  (FB = Vaterbruder …)', 36, 54);

    requestAnimationFrame(loop);
  })();
});

add('V · Die Obstruktion', `

    <p class="fade-up">Fahre die Rundreise:
    <span class="mono" style="color:var(--coral)">ʿamm</span> →
    <span class="mono" style="color:var(--emerald)">uncle</span> →
    <span class="mono" style="color:var(--coral)">{ʿamm, khāl}</span>.

    </div>
  </div>
</div>`, () => {
  const cv=document.getElementById('c_tri'), x=cv.getContext('2d');
  const W=cv.width,H=cv.height;
  let t=0, prog=-1, stage=0;
  const rd=document.getElementById('rd_tri');

  const nodes=[
    {id:'A', n:'Hawaiianisch', X:.5,  Y:.18, h:200, terms:2},
    {id:'B', n:'Englisch',     X:.82, Y:.68, h:150, terms:2},
    {id:'C', n:'Arabisch',     X:.18, Y:.68, h:330, terms:4}
  ];
  const P = id => { const n=nodes.find(k=>k.id===id); return {x:n.X*W,y:n.Y*H,h:n.h}; };

  const steps=[
    {from:'C',to:'B', lbl:'φ_CB', msg:'ʿamm  →  uncle\n  funktorial, aber nicht treu\n  (ʿamm und khāl → beide uncle)'},
    {from:'B',to:'C', lbl:'φ_BC', msg:'uncle  →  {ʿamm, khāl}\n  NICHT funktional\n  eine Relation, keine Funktion'},
    {from:'C',to:'C', lbl:'id?',  msg:'Rundreise beendet.\n\n  Start: ʿamm\n  Ziel:  {ʿamm, khāl}\n\n  φ_BC ∘ φ_CB  ≠  id\n  DER KOZYKEL SCHLIESST NICHT.'}
  ];

  document.getElementById('b_trip').onclick=()=>{ prog=0; stage=0; };
  document.getElementById('b_trir').onclick=()=>{ prog=-1; stage=0;
    rd.textContent='Bereit. Starte die Rundreise.'; };

  (function loop(){

      const s=Math.min(2,Math.floor(prog));
      if(s!==stage){ stage=s; rd.textContent=steps[stage].msg; }

      if(stage===0 && prog<1) rd.textContent=steps[0].msg;

    edge('B','C','φ_BC  nicht funktional',330,false);
    edge('A','C','φ_AC  nicht funktional',270,false);

    // travelling dot
    if(prog>=0 && prog<3){
      const si=Math.min(1,Math.floor(prog));
      const f=prog-Math.floor(prog);
      const st=steps[si];
      const a=P(st.from), b=P(st.to);

/* ═══════════════════════════════════════════════════════════
   NAVIGATION ENGINE
   ═══════════════════════════════════════════════════════════ */
const stage=document.getElementById('stage');
const bar=document.getElementById('bar');
const chapEl=document.getElementById('chap');
const numEl=document.getElementById('num');
let cur=-1;

S.forEach((s,i)=>{
  const d=document.createElement('div');
  d.className='slide'; d.id='s'+i;
  d.innerHTML=s.html;
  stage.appendChild(d);
});

function go(n){
  if(n<0||n>=S.length||n===cur) return;
  const prev=cur; cur=n;
  if(prev>=0) document.getElementById('s'+prev).classList.remove('on');
  const el=document.getElementById('s'+cur);
  el.classList.add('on');
  bar.style.width=((cur+1)/S.length*100)+'%';
  chapEl.textContent=S[cur].chapter;
  numEl.textContent=(cur+1)+' / '+S.length;
  if(S[cur].init && !el.dataset.init){
    el.dataset.init='1';
    setTimeout(()=>S[cur].init(),60);
  }
  if(window.MathJax && MathJax.typesetPromise){
    MathJax.typesetPromise([el]).catch(()=>{});
  }
}

document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'||e.key===' '||e.key==='PageDown'){ e.preventDefault(); go(cur+1); }
  if(e.key==='ArrowLeft'||e.key==='PageUp'){ e.preventDefault(); go(cur-1); }
  if(e.key==='Home'){ e.preventDefault(); go(0); }
  if(e.key==='End'){ e.preventDefault(); go(S.length-1); }
});

let tsx=0;
document.addEventListener('touchstart',e=>{ tsx=e.touches[0].clientX; },{passive:true});
document.addEventListener('touchend',e=>{
  const dx=e.changedTouches[0].clientX-tsx;
  if(Math.abs(dx)>60) go(dx<0? cur+1 : cur-1);
},{passive:true});

go(0);
</script>
