<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Topologie-Landschaft</title>
<style>
  html,body{margin:0;height:100%;background:#05060d;overflow:hidden;font-family:system-ui,sans-serif}
  canvas{display:block;position:absolute;inset:0;cursor:grab}
  #ui{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);display:flex;gap:10px;align-items:center;
      background:rgba(10,12,30,.55);padding:10px 16px;border-radius:14px;backdrop-filter:blur(6px);
      border:1px solid rgba(120,140,255,.25)}
  button{background:#141a3a;color:#cfd8ff;border:1px solid #3a4a9a;border-radius:8px;padding:6px 12px;cursor:pointer}
  button.on{background:#3a4ad0}
  input[type=range]{width:300px;accent-color:#7f9bff}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
  <button id="play" class="on">▶</button>
  <input id="t" type="range" min="0" max="1" step="0.001" value="0">
  <button id="pts" class="on">●</button>
  <button id="net">⬡</button>
  <button id="rot" class="on">⟳</button>
</div>

<script>
// ---------- Setup ----------
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let W, H, DPR;
function resize(){
  DPR = Math.min(2, devicePixelRatio || 1);
  W = innerWidth; H = innerHeight;
  cv.width = W*DPR; cv.height = H*DPR;
  ctx.setTransform(DPR,0,0,DPR,0,0);
}
addEventListener('resize', resize); resize();

const slider = document.getElementById('t');
const ui = { play:true, pts:true, net:false, rot:true, dir:1 };
let morph = 0, ax = 0.6, ay = 0.4, T = 0;
const L = norm([0.4, 0.75, 0.55]);

// ---------- Topologie: doppelte Planardomäne ----------
// Fläche = zwei Blätter (oben/unten) über einer Ebenenregion D,
// verbunden durch eine Wand am Rand von D.
// Genus = Anzahl der Löcher in D. Start: 1 Loch (Torus).
// Ende: 2 Löcher (Zweitorus). Der Übergang teilt ein Loch in zwei.
function smin(a,b,k){
  const h = Math.max(k - Math.abs(a-b), 0)/k;
  return Math.min(a,b) - h*h*k*0.25;
}
function holeField(x,y,t){
  const sep = 0.46*t, R = 0.4 - 0.18*t;
  const d1 = Math.hypot(x-sep, y) - R;
  const d2 = Math.hypot(x+sep, y) - R;
  return smin(d1, d2, 0.12);
}
function inside(x,y,t){
  if (x*x + y*y >= 1) return false;
  return holeField(x,y,t) > 0;
}
// Dicke der Fläche
function zt(x,y){ return 0.2*(1 - 0.35*(x*x + y*y)); }

// Verzerrung: Homöomorphismus, der die Form unkenntlich macht
function warp(x,y,z){
  return [
    x + 0.14*Math.sin(2.3*y + 4*z),
    y + 0.14*Math.cos(2.1*x - 0.5),
    z + 0.16*Math.sin(3*x - 2*y) + 0.1*x*y
  ];
}
function rot(x,y,z){
  const [X,Y,Z] = warp(x,y,z);
  const c = Math.cos(ay), s = Math.sin(ay);
  const X1 = c*X + s*Z, Z1 = -s*X + c*Z;
  const c2 = Math.cos(ax), s2 = Math.sin(ax);
  return [X1, c2*Y - s2*Z1, s2*Y + c2*Z1];
}
function proj(p){
  const d = p[2] + 4.2;
  const k = Math.min(W,H)*0.42*4.2/d;
  return [W/2 + p[0]*k, H/2 - p[1]*k];
}
function norm(v){ const l = Math.hypot(...v); return v.map(x=>x/l); }
function cross(a,b){ return [a[1]*b[2]-a[2]*b[1], a[2]*b[0]-a[0]*b[2], a[0]*b[1]-a[1]*b[0]]; }
function sub(a,b){ return [a[0]-b[0], a[1]-b[1], a[2]-b[2]]; }
function shadeOf(p0,p1,p2){
  const n = norm(cross(sub(p1,p0), sub(p2,p0)));
  return Math.abs(n[0]*L[0] + n[1]*L[1] + n[2]*L[2]);
}

// ---------- Gitter / Simplizialkomplex ----------
const N = 46, G = 2.2, S = G/N, X0 = -G/2;
function buildMesh(t){
  const ins = [];
  for (let i=0;i<N;i++){
    ins.push([]);
    for (let j=0;j<N;j++) ins[i].push(inside(X0+(i+.5)*S, X0+(j+.5)*S, t));
  }
  const get = (i,j) => i>=0 && j>=0 && i<N && j<N && ins[i][j];
  const quads = [], walls = [];
  for (let i=0;i<N;i++) for (let j=0;j<N;j++){
    if (!ins[i][j]) continue;
    const x0 = X0+i*S, x1 = x0+S, y0 = X0+j*S, y1 = y0+S;
    quads.push([[x0,y0],[x1,y0],[x1,y1],[x0,y1]]);
    if (!get(i-1,j)) walls.push([[x0,y0],[x0,y1]]);
    if (!get(i+1,j)) walls.push([[x1,y0],[x1,y1]]);
    if (!get(i,j-1)) walls.push([[x0,y0],[x1,y0]]);
    if (!get(i,j+1)) walls.push([[x0,y1],[x1,y1]]);
  }
  return {quads, walls};
}

// ---------- Punkte, die auf der Fläche fließen ----------
const parts = [];
const NP = 1600;
function respawn(p){
  do { p.x = Math.random()*2-1; p.y = Math.random()*2-1; }
  while (!inside(p.x, p.y, morph));
  p.s = Math.random() < 0.5 ? 1 : -1;
}
for (let i=0;i<NP;i++){ const p={}; respawn(p); parts.push(p); }

// Fluss: Attraktor = Ring um die Löcher, plus Wirbel-Modulation
function flow(x,y){
  const r = Math.hypot(x,y) + 1e-6;
  const vt = 0.35 + 0.12*Math.sin(4*Math.atan2(y,x) + morph*6 + T*0.01);
  const vr = -(r - 0.72)*1.2;
  return [ (x/r)*vr + (-y/r)*vt, (y/r)*vr + (x/r)*vt ];
}

// ---------- Interaktion ----------
let drag = false, lx = 0, ly = 0;
cv.addEventListener('pointerdown', e => { drag = true; lx = e.clientX; ly = e.clientY; cv.style.cursor='grabbing'; });
addEventListener('pointerup', () => { drag = false; cv.style.cursor='grab'; });
addEventListener('pointermove', e => {
  if (!drag) return;
  ay += (e.clientX - lx)*0.005;
  ax += (e.clientY - ly)*0.005;
  lx = e.clientX; ly = e.clientY;
});

const playBtn = document.getElementById('play');
const ptsBtn = document.getElementById('pts');
const netBtn = document.getElementById('net');
const rotBtn = document.getElementById('rot');
playBtn.onclick = () => { ui.play = !ui.play; playBtn.classList.toggle('on', ui.play); playBtn.textContent = ui.play ? '▶' : '❚❚'; };
ptsBtn.onclick = () => { ui.pts = !ui.pts; ptsBtn.classList.toggle('on', ui.pts); };
netBtn.onclick = () => { ui.net = !ui.net; netBtn.classList.toggle('on', ui.net); };
rotBtn.onclick = () => { ui.rot = !ui.rot; rotBtn.classList.toggle('on', ui.rot); };
slider.oninput = () => {
  morph = +slider.value;
  ui.play = false; playBtn.classList.remove('on'); playBtn.textContent = '▶';
};

// ---------- Rendering ----------
function render(mesh){
  const polys = [];

  // Blätter (oben und unten)
  for (const q of mesh.quads){
    const cx = (q[0][0]+q[2][0])/2, cy = (q[0][1]+q[2][1])/2;
    const ang = Math.atan2(cy, cx);
    for (const sheet of [1,-1]){
      const P = q.map(([x,y]) => rot(x, y, sheet*zt(x,y)));
      const pts = P.map(proj);
      const depth = (P[0][2]+P[1][2]+P[2][2]+P[3][2])/4;
      const sh = shadeOf(P[0], P[1], P[3]);
      const hue = sheet > 0
        ? 200 + 45*Math.sin(2*ang + morph*5)
        : 290 + 40*Math.cos(3*ang - morph*4);
      polys.push({pts, depth, col:`hsl(${hue} 70% ${14+52*sh}%)`});
    }
  }
  // Wände
  for (const w of mesh.walls){
    const [a,b] = w;
    const P = [
      rot(a[0],a[1], zt(a[0],a[1])),
      rot(b[0],b[1], zt(b[0],b[1])),
      rot(b[0],b[1],-zt(b[0],b[1])),
      rot(a[0],a[1],-zt(a[0],a[1]))
    ];
    const pts = P.map(proj);
    const depth = (P[0][2]+P[1][2]+P[2][2]+P[3][2])/4;
    const sh = shadeOf(P[0], P[1], P[3]);
    const ang = Math.atan2(a[1], a[0]);
    const hue = 28 + 12*Math.sin(5*ang);
    polys.push({pts, depth, col:`hsl(${hue} 85% ${18+50*sh}%)`});
  }

  polys.sort((a,b) => b.depth - a.depth);

  ctx.fillStyle = '#05060d';
  ctx.fillRect(0,0,W,H);

  ctx.lineJoin = 'round';
  for (const p of polys){
    ctx.beginPath();
    ctx.moveTo(p.pts[0][0], p.pts[0][1]);
    for (let k=1;k<p.pts.length;k++) ctx.lineTo(p.pts[k][0], p.pts[k][1]);
    ctx.closePath();
    ctx.fillStyle = p.col;
    ctx.fill();
    if (ui.net){
      ctx.strokeStyle = 'rgba(190,210,255,0.28)';
      ctx.lineWidth = 0.6;
      ctx.stroke();
    }
  }

  // Punkte
  if (ui.pts){
    for (const p of parts){
      const z = p.s * zt(p.x, p.y);
      const [sx, sy] = proj(rot(p.x, p.y, z));
      ctx.fillStyle = p.s > 0 ? '#7ff7ff' : '#ff7ff0';
      ctx.fillRect(sx-1, sy-1, 2.2, 2.2);
    }
  }
}

function updateParticles(){
  const dt = 0.03;
  for (const p of parts){
    const [vx, vy] = flow(p.x, p.y);
    p.x += vx*dt; p.y += vy*dt;
    if (!inside(p.x, p.y, morph)) respawn(p);
  }
}

// ---------- Schleife ----------
let mesh = buildMesh(morph), meshT = morph;
function frame(){
  if (ui.play){
    morph += ui.dir * 0.0025;
    if (morph >= 1){ morph = 1; ui.dir = -1; }
    if (morph <= 0){ morph = 0; ui.dir = 1; }
    slider.value = morph;
  }
  if (ui.rot && !drag) ay += 0.002;
  T++;

  if (Math.abs(morph - meshT) > 0.002 || T % 1 === 0){
    mesh = buildMesh(morph); meshT = morph;
  }
  updateParticles();
  render(mesh);
  requestAnimationFrame(frame);
}
frame();
</script>
</body>
</html>
