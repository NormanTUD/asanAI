<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Layer als Raumkrümmung</title>
<style>
  :root{--bg:#0b0d12;--ink:#e8ecf4;--dim:#7b8496;--plane:#ffd166}
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:var(--bg);color:var(--ink);
    font-family:"Inter","Segoe UI",system-ui,sans-serif;overflow:hidden}
  canvas{display:block;width:100%;height:100%;position:fixed;inset:0}
  .panel{position:fixed;left:44px;top:42px;max-width:420px;pointer-events:none;z-index:2}
  .step{font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:var(--dim)}
  h1{font-size:29px;font-weight:600;margin:10px 0 12px;line-height:1.18}
  p{font-size:15.5px;line-height:1.62;color:#b9c2d4;max-width:380px}
  .formula{margin-top:20px;padding:13px 17px;border-left:2px solid var(--plane);
    background:rgba(255,209,102,.05);font-family:"Cambria Math",Georgia,serif;
    font-size:18px;color:#ffe9b0}
  .formula small{display:block;font-size:12.5px;color:#9a8f6d;margin-top:5px}
  #bar{position:fixed;left:44px;bottom:38px;display:flex;gap:7px;z-index:2}
  .dot{width:24px;height:3px;background:#2a3040;transition:background .5s}
  .dot.on{background:var(--plane)}
  #hint{position:fixed;right:44px;bottom:36px;font-size:12px;color:#4d5568;z-index:2}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="panel">
  <div class="step" id="sNum"></div><h1 id="sTitle"></h1>
  <p id="sBody"></p><div class="formula" id="sForm"></div>
</div>
<div id="bar"></div>
<div id="hint">← →  Schritt &nbsp;·&nbsp; Drag: rotieren &nbsp;·&nbsp; R: Reset</div>

<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let W,H,DPR;
function resize(){DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;
  cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);}
addEventListener('resize',resize);resize();

/* ---------- Daten: größerer Klassenabstand ---------- */
let rng=42;const rnd=()=>(rng=(rng*1103515245+12345)&0x7fffffff)/0x7fffffff;
const PTS=[];
for(let i=0;i<140;i++){const a=rnd()*6.2832,r=Math.sqrt(rnd())*0.40;
  PTS.push({x:Math.cos(a)*r,y:Math.sin(a)*r,c:0,r:r});}
for(let i=0;i<220;i++){const a=rnd()*6.2832,r=0.82+Math.sqrt(rnd())*0.26;
  PTS.push({x:Math.cos(a)*r,y:Math.sin(a)*r,c:1,r:r});}
PTS.forEach((p,i)=>{p.i=i;p.val=p.x*p.x+p.y*p.y;});
const VMAX=Math.max(...PTS.map(p=>p.val)),THR=0.38;

const LIFT=(x,y,t)=>{const r2=x*x+y*y;
  return {x:x*(1-0.12*t*r2),y:y*(1-0.12*t*r2),z:(r2*1.95-0.62)*t};};
const PLANE_Z=0.32;

/* ---------- Kamera ---------- */
let camA=0,camB=1.5708,dragA=0,dragB=0,persp=1;
const SC=()=>Math.min(W,H)*0.29;
function proj(p){
  const A=camA+dragA,B=camB+dragB;
  const x=p.x*Math.cos(A)-p.y*Math.sin(A);
  const y=p.x*Math.sin(A)+p.y*Math.cos(A);
  const y2=y*Math.sin(B)+p.z*Math.cos(B);
  const z2=-y*Math.cos(B)+p.z*Math.sin(B);
  const d=4.4,k=persp<0.02?1:d/(d+z2*0.85*persp);
  return {X:W/2+x*SC()*k+150,Y:H/2-y2*SC()*k,d:z2,k:k};
}

/* ---------- Szenen ---------- */
const S=[
{n:"Schritt 1 / 7",t:"Zwei Klassen, keine Gerade",
 b:"Innen eine Punktwolke, außen ein Ring. Kein einziger gerader Schnitt trennt Rot von Blau.",
 f:"X ⊂ ℝ²,&nbsp; y ∈ {0,1}<small>nicht linear separierbar</small>",
 L:0,A:0,B:1.5708,P:0,pl:0,ed:0,bnd:0,fail:0,lab:0,pr:0},
{n:"Schritt 2 / 7",t:"Jeder Versuch scheitert",
 b:"Eine lineare Trennung ist eine Gerade. Sie schneidet den Ring immer — die Topologie lässt es nicht zu.",
 f:"w₁x + w₂y + b = 0<small>eine Gerade, immer</small>",
 L:0,A:0,B:1.5708,P:0,pl:0,ed:0,bnd:0,fail:1,lab:0,pr:0},
{n:"Schritt 3 / 7",t:"Eine Dimension mehr Platz",
 b:"Wir kippen die Szene leicht. Noch ist alles flach bei z = 0 — aber jetzt ist Raum nach oben da.",
 f:"ℝ² ↪ ℝ³<small>Einbettung, noch ohne Krümmung</small>",
 L:0,A:0.5,B:1.30,P:1,pl:0,ed:0,bnd:0,fail:0,lab:0,pr:0},
{n:"Schritt 4 / 7",t:"Der Layer krümmt den Raum",
 b:"Das Gitter hebt sich zu einer Schale. Es zerreißt nicht, es biegt sich. Innere Punkte sinken, äußere steigen.",
 f:"φ(x,y) = (x, y, x² + y²)<small>ein Layer = eine Verbiegung</small>",
 L:1,A:0.5,B:0.62,P:1,pl:0,ed:0,bnd:0,fail:0,lab:0,pr:0},
{n:"Schritt 5 / 7",t:"Eine Ebene passt dazwischen",
 b:"Was in 2D unmöglich war, ist hier trivial: eine flache Ebene schiebt sich sauber zwischen die Klassen.",
 f:"wᵀφ(x) + b = 0<small>lineare Trennung in ℝ³</small>",
 L:1,A:0.5,B:0.34,P:1,pl:1,ed:0,bnd:0,fail:0,lab:0,pr:0},
{n:"Schritt 6 / 7",t:"Von der Kante gesehen",
 b:"Die Kamera fährt exakt in die Ebene hinein. Sie wird zur Linie — darunter die eine Klasse, darüber die andere. Weil der Output-Layer linear ist, ist „hinschauen“ und „rechnen“ dasselbe.",
 f:"wᵀφ(x) + b ⋛ 0<small>Vorzeichen = Klasse</small>",
 L:1,A:0,B:0,P:1,pl:1,ed:1,bnd:0,fail:0,lab:1,pr:0},
{n:"Schritt 7 / 7",t:"Alles wird eine Zahl",
 b:"Zurück in 2D wird die Grenze zum Kreis. Und jeder Punkt fällt auf eine einzige Zahl: seinen Abstand zur Ebene. Blau links, Rot rechts — eine Dimension genügt.",
 f:"s = wᵀφ(x) + b ∈ ℝ<small>2D → 1D, linear trennbar</small>",
 L:0,A:0,B:1.5708,P:0,pl:0,ed:0,bnd:1,fail:0,lab:0,pr:1}];

/* ---------- Ablauf ---------- */
let cur=0,prev=0,t0=performance.now(),DUR=1400;
let dA0=0,dB0=0;
const ease=u=>u<.5?16*u*u*u*u*u:1-Math.pow(-2*u+2,5)/2;
const lerp=(a,b,u)=>a+(b-a)*u;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

function bar(){const d=document.getElementById('bar');d.innerHTML='';
  S.forEach((_,i)=>{const e=document.createElement('div');
    e.className='dot'+(i<=cur?' on':'');d.appendChild(e);});}
function text(){const s=S[cur];sNum.textContent=s.n;sTitle.textContent=s.t;
  sBody.textContent=s.b;sForm.innerHTML=s.f;bar();}
function go(d){const n=clamp(cur+d,0,S.length-1);if(n===cur)return;
  dA0=dragA;dB0=dragB;prev=cur;cur=n;t0=performance.now();text();}

addEventListener('keydown',e=>{
  if(['ArrowRight','ArrowDown',' ','PageDown'].includes(e.key)){e.preventDefault();go(1);}
  if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){e.preventDefault();go(-1);}
  if(e.key==='r'||e.key==='R'){dA0=dragA;dB0=dragB;t0=performance.now();prev=cur;}});
let md=false,mx=0,my=0;
cv.addEventListener('mousedown',e=>{md=true;mx=e.clientX;my=e.clientY;});
addEventListener('mouseup',()=>md=false);
addEventListener('mousemove',e=>{if(!md)return;
  dragA+=(e.clientX-mx)*0.006;dragB+=(e.clientY-my)*0.005;
  dA0=dragA;dB0=dragB;mx=e.clientX;my=e.clientY;});

const N=14,EXT=1.24;
function gridLines(L){const o=[];
  for(let i=0;i<=N;i++){const v=-EXT+2*EXT*i/N,a=[],b=[];
    for(let j=0;j<=N*2;j++){const u=-EXT+2*EXT*j/(N*2);
      a.push(LIFT(u,v,L));b.push(LIFT(v,u,L));}o.push(a,b);}return o;}

/* ---------- Render ---------- */
function draw(now){
  const raw=clamp((now-t0)/DUR,0,1),u=ease(raw);
  const a=S[prev],b=S[cur];
  const L=lerp(a.L,b.L,u);
  persp=lerp(a.P,b.P,u);
  const drift=Math.sin(now*0.00021)*0.04*persp;
  camA=lerp(a.A,b.A,u)+drift;camB=lerp(a.B,b.B,u);
  if(!md){dragA=lerp(dA0,0,u);dragB=lerp(dB0,0,u);}
  const pl=lerp(a.pl,b.pl,u),ed=lerp(a.ed,b.ed,u),bd=lerp(a.bnd,b.bnd,u),
        fl=lerp(a.fail,b.fail,u),lb=lerp(a.lab,b.lab,u),pr=lerp(a.pr,b.pr,u);

  ctx.fillStyle='#0b0d12';ctx.fillRect(0,0,W,H);

  /* Zahlenstrahl */
  const AX_Y=H*0.80,AX_L=W/2-SC()*0.95+150,AX_R=W/2+SC()*0.95+150;
  if(pr>0.01){
    ctx.globalAlpha=pr;ctx.strokeStyle='#3c4considered';ctx.strokeStyle='#3c4560';
    ctx.lineWidth=1.6;ctx.beginPath();ctx.moveTo(AX_L,AX_Y);ctx.lineTo(AX_R,AX_Y);ctx.stroke();
    for(let i=0;i<=8;i++){const X=lerp(AX_L,AX_R,i/8);
      ctx.beginPath();ctx.moveTo(X,AX_Y-5);ctx.lineTo(X,AX_Y+5);ctx.stroke();}
    const TX=lerp(AX_L,AX_R,THR/VMAX);
    ctx.strokeStyle='#ffd166';ctx.lineWidth=2.2;ctx.beginPath();
    ctx.moveTo(TX,AX_Y-30);ctx.lineTo(TX,AX_Y+30);ctx.stroke();
    ctx.fillStyle='#ffd166';ctx.font='13px Georgia';ctx.textAlign='center';
    ctx.fillText('s = 0',TX,AX_Y+50);
    ctx.font='600 13px Inter,sans-serif';ctx.fillStyle='#5ad2ff';
    ctx.fillText('s < 0',lerp(AX_L,TX,0.45),AX_Y+50);
    ctx.fillStyle='#ff6b8a';ctx.fillText('s > 0',lerp(TX,AX_R,0.6),AX_Y+50);
    ctx.textAlign='left';ctx.globalAlpha=1;}

  if(bd>0.01){const p0=proj({x:0,y:0,z:0});
    ctx.globalAlpha=bd*0.12;ctx.fillStyle='#ff6b8a';ctx.beginPath();
    ctx.arc(p0.X,p0.Y,SC()*0.62,0,6.2832);ctx.fill();
    ctx.globalAlpha=bd;ctx.strokeStyle='#ffd166';ctx.lineWidth=2.4;
    ctx.beginPath();ctx.arc(p0.X,p0.Y,SC()*0.62,0,6.2832);ctx.stroke();ctx.globalAlpha=1;}

  ctx.lineWidth=1;const gAlpha=(0.17+0.26*L)*(1-pr*0.75);
  gridLines(L).forEach(sg=>{ctx.beginPath();
    sg.forEach((p,i)=>{const q=proj(p);i?ctx.lineTo(q.X,q.Y):ctx.moveTo(q.X,q.Y);});
    ctx.strokeStyle='rgba(84,102,140,'+gAlpha+')';ctx.stroke();});

  if(fl>0.01){ctx.globalAlpha=fl*0.7;ctx.lineWidth=1.6;ctx.strokeStyle='#8892a8';
    ctx.setLineDash([5,5]);
    for(let k=0;k<5;k++){const t=k*0.63+0.2;
      const p=proj({x:Math.cos(t)*-1.32,y:Math.sin(t)*-1.32,z:0});
      const q=proj({x:Math.cos(t)*1.32,y:Math.sin(t)*1.32,z:0});
      ctx.beginPath();ctx.moveTo(p.X,p.Y);ctx.lineTo(q.X,q.Y);ctx.stroke();}
    ctx.setLineDash([]);ctx.globalAlpha=1;}

  /* Punkte */
  const items=[];
  PTS.forEach(p=>{
    const q=LIFT(p.x,p.y,L),s=proj(q);
    let X=s.X,Y=s.Y;
    if(pr>0.001){
      const stag=clamp((pr*1.55)-(p.r/1.10)*0.5,0,1);
      const w=ease(stag);
      const tx=lerp(AX_L,AX_R,clamp(p.val/VMAX,0,1));
      const cx=lerp(X,tx,0.5)+(X-tx)*0.12, cy=lerp(Y,AX_Y,0.35)-70;
      const m=1-w;
      X=m*m*X+2*m*w*cx+w*w*tx;
      Y=m*m*Y+2*m*w*cy+w*w*AX_Y;
    }
    items.push({d:s.d,s:{X:X,Y:Y,k:s.k},c:p.c,type:'pt'});});

  if(pl>0.01){const E=0.95,g=[];
    for(let i=0;i<=8;i++)for(let j=0;j<=8;j++)
      g.push(proj({x:-E+2*E*i/8,y:-E+2*E*j/8,z:PLANE_Z}));
    items.push({d:PLANE_Z,type:'plane',g:g,a:pl});}
  items.sort((p,q)=>p.d-q.d);

  items.forEach(it=>{
    if(it.type==='plane'){const g=it.g,P=[g[0],g[8],g[80],g[72]];
      ctx.globalAlpha=it.a*(0.15+0.20*(1-ed));ctx.fillStyle='#ffd166';
      ctx.beginPath();ctx.moveTo(P[0].X,P[0].Y);
      for(let i=1;i<4;i++)ctx.lineTo(P[i].X,P[i].Y);ctx.closePath();ctx.fill();
      ctx.globalAlpha=it.a*(0.5+0.5*ed);ctx.strokeStyle='#ffd166';
      ctx.lineWidth=1.2+2.2*ed;ctx.stroke();ctx.globalAlpha=1;
    }else{const r=(2.8+0.7*it.s.k)*it.s.k;
      ctx.beginPath();ctx.arc(it.s.X,it.s.Y,r,0,6.2832);
      ctx.fillStyle=it.c?'#5ad2ff':'#ff6b8a';
      ctx.globalAlpha=0.55+0.45*it.s.k;ctx.fill();ctx.globalAlpha=1;}});

  if(lb>0.01){ctx.globalAlpha=lb;ctx.font='600 14px Inter,sans-serif';
    const c0=proj({x:0,y:0,z:PLANE_Z}),LX=W/2+SC()*1.08+150;
    ctx.fillStyle='#5ad2ff';ctx.fillText('Klasse B — äußerer Ring',LX,c0.Y-58);
    ctx.fillStyle='#ff6b8a';ctx.fillText('Klasse A — innerer Kern',LX,c0.Y+66);
    ctx.fillStyle='#ffd166';ctx.font='13px Georgia';
    ctx.fillText('Trennebene, von der Kante',LX,c0.Y+4);ctx.globalAlpha=1;}

  requestAnimationFrame(draw);}
text();requestAnimationFrame(draw);
</script>
</body>
</html>
