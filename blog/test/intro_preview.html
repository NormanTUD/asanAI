<!DOCTYPE html>
<html class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../style.css">
</head>
<body>
<div id="loader" role="status" aria-live="polite">
  <div class="spinner" aria-hidden="true"></div>
  <p id="loader-status">Loading sections...</p>
  <div id="loader-checklist" aria-hidden="true"></div>
</div>
<script src="../organic-network.js"></script>
<script src="../modules/intro.js"></script>
<script>
(function () {
  var names = ['Cosmos', 'Numbers', 'Geometry', 'Calculus', 'Logic', 'Signal', 'Language', 'Convergence'];
  var c = document.getElementById('loader-checklist');
  names.forEach(function (n) {
    var r = document.createElement('div');
    r.className = 'loader-section-row pending';
    r.innerHTML = '<span class="loader-icon">&#9675;</span> <span class="loader-label">' + n + '</span>';
    c.appendChild(r);
  });
  var rows = c.querySelectorAll('.loader-section-row');
  names.forEach(function (_, i) {
    setTimeout(function () { rows[i].className = 'loader-section-row loading'; }, i * 150 + 100);
    setTimeout(function () { rows[i].className = 'loader-section-row done'; }, i * 800 + 500);
  });
})();
</script>
</body>
</html>
