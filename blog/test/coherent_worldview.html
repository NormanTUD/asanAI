// ============ S18: CODA — seams visible in the whole ============
(function(){
  const {c, ctx, w, h} = setupCanvas('c18');

  // Similar to hero, but now the seams remain visibly gold —
  // the whole holds because of the fitting, not sameness
  const patches = [];
  const N = 55;
  for (let i = 0; i < N; i++) {
    patches.push({
      tx: 0, ty: 0,
      color: PATCH_COLORS[i % PATCH_COLORS.length],
      r: 25 + Math.random()*35,
      phase: Math.random()*Math.PI*2,
      seed: Math.random()
    });
  }

  let initialized = false;
  function init() {
    // Arrange in a mandala-like coherent shape
    const cx = w()/2, cy = h()/2;
    const R = Math.min(w(),h())*0.32;
    patches.forEach((p, i) => {
      // Fibonacci-like spiral for organic coherence
      const golden = Math.PI * (3 - Math.sqrt(5));
      const t = i / N;
      const r = R * Math.sqrt(t);
      const a = i * golden;
      p.tx = cx + Math.cos(a) * r;
      p.ty = cy + Math.sin(a) * r;
    });
  }

  function draw() {
    if (!initialized) { init(); initialized = true; }

    ctx.fillStyle = PAL.ink;
    ctx.fillRect(0,0,w(),h());

    const cx = w()/2, cy = h()/2;

    // Slow ambient rotation of the whole
    const rot = T * 0.03;

    // Draw seams FIRST (behind patches) — the gold "glue" is prominent
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(rot);
    ctx.translate(-cx, -cy);

    // Build seam graph: connect each patch to nearest neighbors
    const seams = [];
    for (let i = 0; i < patches.length; i++) {
      const neighbors = [];
      for (let j = 0; j < patches.length; j++) {
        if (i === j) continue;
        const dx = patches[i].tx - patches[j].tx;
        const dy = patches[i].ty - patches[j].ty;
        neighbors.push({ j, d: Math.sqrt(dx*dx + dy*dy) });
      }
      neighbors.sort((a,b) => a.d - b.d);
      for (let k = 0; k < 4; k++) {
        if (neighbors[k]) seams.push([i, neighbors[k].j, neighbors[k].d]);
      }
    }

    // Draw seams — pulsing gold, the coherent glue is always visible
    seams.forEach(([i, j, d]) => {
      if (d > 120) return;
      const p1 = patches[i], p2 = patches[j];
      const pulse = (Math.sin(T*0.8 + p1.phase) + 1) / 2;
      const alpha = 0.15 + pulse * 0.25;
      ctx.strokeStyle = `rgba(255,216,138,${alpha})`;
      ctx.lineWidth = 0.8;
      ctx.beginPath();
      ctx.moveTo(p1.tx, p1.ty);
      ctx.lineTo(p2.tx, p2.ty);
      ctx.stroke();
    });

    // Draw patches — DIFFERENT colors preserved
    patches.forEach(p => {
      const breathe = Math.sin(T*0.6 + p.phase) * 4;
      const rr = p.r + breathe;

      // Soft glow
      const grad = ctx.createRadialGradient(p.tx, p.ty, 0, p.tx, p.ty, rr);
      grad.addColorStop(0, p.color + 'ee');
      grad.addColorStop(0.7, p.color + '88');
      grad.addColorStop(1, p.color + '00');
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(p.tx, p.ty, rr, 0, Math.PI*2);
      ctx.fill();

      // Core — the patch keeps its distinct identity
      ctx.fillStyle = p.color;
      ctx.globalAlpha = 0.9;
      ctx.beginPath();
      ctx.arc(p.tx, p.ty, rr*0.35, 0, Math.PI*2);
      ctx.fill();
      ctx.globalAlpha = 1;
    });

    ctx.restore();

    // Central emergence — the "one whole" quietly present
    const globalPulse = (Math.sin(T*0.5) + 1) / 2;
    ctx.fillStyle = `rgba(242,237,228,${0.05 + globalPulse*0.05})`;
    ctx.beginPath();
    ctx.arc(cx, cy, Math.min(w(),h())*0.4, 0, Math.PI*2);
    ctx.fill();

    // Final settle — a hairline gold ring around the whole
    ctx.strokeStyle = `rgba(255,216,138,${0.3 + globalPulse*0.2})`;
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.arc(cx, cy, Math.min(w(),h())*0.36, 0, Math.PI*2);
    ctx.stroke();

    requestAnimationFrame(draw);
  }
  draw();
})();

// ============ REDUCED MOTION FALLBACK ============
if (reduced) {
  // Freeze T; render one static frame per section by not advancing time
  cancelAnimationFrame(tick);
  T = 3.14; // fixed pleasant state
}

// ============ FINAL: force first section visible ============
setTimeout(() => {
  document.getElementById('s0').classList.add('visible');
  if (dots[0]) dots[0].classList.add('active');
}, 100);

</script>
