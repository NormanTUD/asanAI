<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Attention</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#0b0d12;color:#e8ecf4;overflow:hidden;
    font-family:"Inter","Segoe UI",system-ui,sans-serif}
  canvas{position:fixed;inset:0;width:100%;height:100%}
  #t{position:fixed;left:50px;top:52px;font-size:30px;font-weight:600;z-index:2;
    max-width:420px;line-height:1.2}
  #f{position:fixed;left:50px;top:118px;font-family:Georgia,serif;font-size:19px;
    color:#ffd166;z-index:2}
  #b{position:fixed;left:50px;bottom:44px;display:flex;gap:8px;z-index:2}
  .d{width:30px;height:3px;background:#2a3040}.d.on{background:#ffd166}
  #h{position:fixed;right:50px;bottom:42px;font-size:12px;color:#4d5568;z-index:2}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="t"></div><div id="f"></div><div id="b"></div>
<div id="h">← →  &nbsp;·&nbsp; ziehen: drehen</div>

<script>
const cv=c,x=cv.getContext('2d');let W,H;
function rz(){const D=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;
 cv.width=W*D;cv.height=H*D;x.setTransform(D,0,0,D,0,0);}
onresize=rz;rz();

const L=(a,b,u)=>a+(b-a)*u, C=(v,a,b)=>Math.max(a,Math.min(b,v)), T=6.2832;
const E=u=>{const s=1/(1+Math.exp(-11*(u-.5))),a=1/(1+Math.exp(5.5));
 return (s-a)/(1/(1+Math.exp(-5.5))-a);};
const V=(a,b,c)=>({x:a,y:b,z:c});
const ad=(a,b)=>V(a.x+b.x,a.y+b.y,a.z+b.z), sb=(a,b)=>V(a.x-b.x,a.y-b.y,a.z-b.z);
const ml=(a,s)=>V(a.x*s,a.y*s,a.z*s), dt=(a,b)=>a.x*b.x+a.y*b.y+a.z*b.z;
const nm=a=>{const l=Math.hypot(a.x,a.y,a.z)||1;return V(a.x/l,a.y/l,a.z/l);};
const mx=(a,b,u)=>V(L(a.x,b.x,u),L(a.y,b.y,u),L(a.z,b.z,u));

/* Kamera: Szene + Nutzer, addiert. Nutzerdrehung bleibt. */
let sA=.5,sB=.28,uA=0,uB=0;
function P(p){const A=sA+uA,B=sB+uB,S=Math.min(W,H)*.26;
 const a=p.x*Math.cos(A)-p.y*Math.sin(A), b=p.x*Math.sin(A)+p.y*Math.cos(A);
 const Y=-b*Math.sin(B)+p.z*Math.cos(B), Z=b*Math.cos(B)+p.z*Math.sin(B);
 const k=5.6/(5.6+Z*.7);
 return {X:W/2+a*S*k+130, Y:H/2-Y*S*k, d:Z, k:k};}

/* Die Szene: 3 Wörter, 2 Bedeutungen */
const MO=V(-1.1,.8,.35), GE=V(1.1,-.85,-.3);
const TK=[{w:"Die",e:V(-.25,-1.1,-.6),c:'#6d7ea8'},
          {w:"Bank",e:ml(ad(MO,GE),.5),c:'#ffd166'},
          {w:"kalt",e:V(-1.0,1.05,.6),c:'#5ad2ff'}];
const Q=1, R=nm(sb(TK[2].e,TK[1].e));

function wgt(tau){const s=TK.map(t=>dt(sb(t.e,TK[Q].e),R)*2.2);s[Q]=.5;
 const m=Math.max(...s),e=s.map(v=>Math.exp((v-m)/tau)),z=e.reduce((a,b)=>a+b);
 return {s:s,w:e.map(v=>v/z)};}

const SC=[
{t:"Jedes Wort ist ein Punkt im Raum",
 f:"„Bank“ liegt genau in der Mitte",A:.5,B:.28,gh:1,ry:0,ms:0,mv:0},
{t:"„Bank“ fragt: wer passt zu mir?",
 f:"Lot fällen → Länge messen",A:.18,B:.24,gh:1,ry:1,ms:0,mv:0},
{t:"Längen werden zu Anteilen",
 f:"a₁ + a₂ + a₃ = 1",A:.18,B:.24,gh:1,ry:1,ms:1,mv:0},
{t:"„Bank“ rutscht zum Schwerpunkt",
 f:"neu = a₁·P₁ + a₂·P₂ + a₃·P₃",A:.18,B:.24,gh:1,ry:0,ms:1,mv:1}];

let i=0,j=0,t0=performance.now();
function up(){t.textContent=SC[i].t;f.textContent=SC[i].f;
 b.innerHTML=SC.map((_,k)=>'<div class="d'+(k<=i?' on':'')+'"></div>').join('');}
onkeydown=e=>{const d=/Right|Down| /.test(e.key)?1:/Left|Up/.test(e.key)?-1:0;
 if(d){e.preventDefault();const n=C(i+d,0,3);if(n!=i){j=i;i=n;t0=performance.now();up();}}};
let md=0,px,py;
cv.onmousedown=e=>{md=1;px=e.clientX;py=e.clientY};
onmouseup=()=>md=0;
onmousemove=e=>{if(!md)return;uA+=(e.clientX-px)*.006;
 uB=C(uB+(e.clientY-py)*.005,-1.2,1.2);px=e.clientX;py=e.clientY};

function ln(a,b,c,w,al,ds){const p=P(a),q=P(b);x.save();x.globalAlpha=al;
 x.strokeStyle=c;x.lineWidth=w;if(ds)x.setLineDash(ds);
 x.beginPath();x.moveTo(p.X,p.Y);x.lineTo(q.X,q.Y);x.stroke();x.restore();}
function ar(a,b,c,w,al){const p=P(a),q=P(b);x.save();x.globalAlpha=al;
 x.strokeStyle=c;x.lineWidth=w;x.beginPath();x.moveTo(p.X,p.Y);x.lineTo(q.X,q.Y);x.stroke();
 const g=Math.atan2(q.Y-p.Y,q.X-p.X),s=10+w;x.fillStyle=c;x.beginPath();
 x.moveTo(q.X,q.Y);x.lineTo(q.X-s*Math.cos(g-.36),q.Y-s*Math.sin(g-.36));
 x.lineTo(q.X-s*Math.cos(g+.36),q.Y-s*Math.sin(g+.36));x.fill();x.restore();}
function bl(p,r,c,al){const s=P(p),R=Math.max(3,r*s.k);
 const g=x.createRadialGradient(s.X-R*.35,s.Y-R*.35,R*.1,s.X,s.Y,R);
 g.addColorStop(0,'#fff');g.addColorStop(.4,c);g.addColorStop(1,c);
 x.globalAlpha=al*(.7+.3*s.k);x.beginPath();x.arc(s.X,s.Y,R,0,T);
 x.fillStyle=g;x.fill();x.globalAlpha=1;}
function tg(p,s,c,al,dx,dy,sz,bd){const q=P(p);x.globalAlpha=al;x.fillStyle=c;
 x.font=(bd?'600 ':'')+sz+'px Inter,sans-serif';x.textAlign='left';
 x.fillText(s,q.X+dx,q.Y+dy);x.globalAlpha=1;}

function draw(n){
 const u=E(C((n-t0)/2100,0,1)), a=SC[j], z=SC[i], G=k=>L(a[k],z[k],u);
 sA=L(a.A,z.A,u); sB=L(a.B,z.B,u);
 const gh=G('gh'),ry=G('ry'),ms=G('ms'),mv=G('mv');
 x.fillStyle='#0b0d12';x.fillRect(0,0,W,H);

 const A=wgt(L(2.4,.6,ms));
 let cn=V(0,0,0); A.w.forEach((w,k)=>cn=ad(cn,ml(TK[k].e,w)));
 const pos=TK.map((t,k)=>k==Q?mx(t.e,cn,mv):t.e);

 /* Bodengitter, dezent */
 x.globalAlpha=.10;x.strokeStyle='#46557a';x.lineWidth=.8;
 for(let k=0;k<=6;k++){const v=-1.35+2.7*k/6;
  let p=P(V(-1.35,v,-.9)),q=P(V(1.35,v,-.9));
  x.beginPath();x.moveTo(p.X,p.Y);x.lineTo(q.X,q.Y);x.stroke();
  p=P(V(v,-1.35,-.9));q=P(V(v,1.35,-.9));
  x.beginPath();x.moveTo(p.X,p.Y);x.lineTo(q.X,q.Y);x.stroke();}
 x.globalAlpha=1;

 /* die zwei Bedeutungen */
 if(gh>.01){
  [[MO,'Sitzbank','#5ad2ff'],[GE,'Geldhaus','#ff6b8a']].forEach(g=>{
   bl(g[0],10,g[2],gh*.28);
   const s=P(g[0]);x.globalAlpha=gh*.45;x.strokeStyle=g[2];x.lineWidth=1.3;
   x.setLineDash([3,4]);x.beginPath();x.arc(s.X,s.Y,17*s.k,0,T);x.stroke();
   x.setLineDash([]);x.globalAlpha=1;
   tg(g[0],g[1],g[2],gh*.7,16,-13,14);});
  ln(MO,GE,'#3f4a66',1.1,gh*.3,[4,5]);}

 /* Suchstrahl + Lote */
 if(ry>.01){
  const o=pos[Q], tp=ad(o,ml(R,1.9));
  ar(o,tp,'#ffd166',2.4,ry*.95);
  TK.forEach((t,k)=>{if(k==Q)return;
   const pr=dt(sb(t.e,o),R), ft=ad(o,ml(R,pr));
   ln(t.e,ft,'#6d7ea8',1,ry*.4,[3,4]);
   const p=P(o),q=P(ft);
   x.globalAlpha=ry*.9;x.strokeStyle=pr>0?'#5ad2ff':'#ff6b8a';
   x.lineWidth=5;x.lineCap='round';
   x.beginPath();x.moveTo(p.X,p.Y);x.lineTo(q.X,q.Y);x.stroke();
   x.lineCap='butt';x.globalAlpha=1;});}

 /* Anteilsbalken */
 if(ms>.01){
  const X0=W-330,Y0=H-96,BW=270,BH=22;let ac=0;
  x.globalAlpha=ms*.8;x.strokeStyle='#3c4560';x.lineWidth=1;
  x.strokeRect(X0,Y0,BW,BH);
  A.w.forEach((w,k)=>{const x1=X0+BW*ac,x2=X0+BW*(ac+w);ac+=w;
   x.globalAlpha=ms*.55;x.fillStyle=k==Q?'#ffd166':(A.s[k]>0?'#5ad2ff':'#ff6b8a');
   x.fillRect(x1,Y0,x2-x1,BH);
   if(w>.1){x.globalAlpha=ms*.95;x.fillStyle='#0b0d12';
    x.font='600 12px Inter,sans-serif';x.textAlign='center';
    x.fillText(TK[k].w,(x1+x2)/2,Y0+15);x.textAlign='left';}});
  x.globalAlpha=1;}

 /* Schwerpunkt + Hebel */
 if(mv>.01){
  A.w.forEach((w,k)=>{if(k==Q)return;
   ln(TK[k].e,cn,'#ffd166',.8+5*w,mv*(.12+.7*w));});
  const s=P(cn);x.globalAlpha=mv*.9;x.strokeStyle='#ffd166';x.lineWidth=1.4;
  x.beginPath();x.arc(s.X,s.Y,6*s.k,0,T);x.stroke();
  x.beginPath();x.moveTo(s.X-12*s.k,s.Y);x.lineTo(s.X+12*s.k,s.Y);
  x.moveTo(s.X,s.Y-12*s.k);x.lineTo(s.X,s.Y+12*s.k);x.stroke();x.globalAlpha=1;
  ln(TK[Q].e,pos[Q],'#ffd166',1.4,mv*.5,[4,5]);
  bl(TK[Q].e,5,'#8892a8',mv*.28);}

 /* Wörter */
 TK.map((t,k)=>({k:k,d:P(pos[k]).d})).sort((p,q)=>p.d-q.d).forEach(o=>{
  const k=o.k,t=TK[k],iQ=k==Q,w=ms>.01?A.w[k]:1/3;
  const r=7+(ms>.01?28*(w-1/3):0)+(iQ?2:0);
  bl(pos[k],r,t.c,.95);
  tg(pos[k],t.w,iQ?'#ffe9b0':'#c3ccdd',.95,13+r*.3,-r*.5-6,iQ?17:14,iQ);});

 requestAnimationFrame(draw);}
up();requestAnimationFrame(draw);
</script>
</body>
</html>
