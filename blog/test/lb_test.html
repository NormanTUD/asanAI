<!DOCTYPE html>
<html>
<head><title>Lightbox test</title></head>
<body>
<iframe id="f" src="http://localhost/asanai/blog/untold_history" style="width:1200px;height:900px;border:0"></iframe>
<script>
window.addEventListener('load', function() {
  const iframe = document.getElementById('f');
  setTimeout(function() {
    try {
      const doc = iframe.contentDocument;
      const win = iframe.contentWindow;
      const img = doc.querySelector('.md img');
      img.click();
      setTimeout(function() {
        const lb = doc.getElementById('cl-lb');
        const cap = lb.querySelector('figcaption');
        const cs = win.getComputedStyle(cap);
        const rect = cap.getBoundingClientRect();
        const lines = [
          'text: ' + (cap.textContent || '').substring(0,80).replace(/\n/g,' '),
          'display: ' + cs.display,
          'position: ' + cs.position,
          'bottom: ' + cs.bottom,
          'color: ' + cs.color,
          'fontSize: ' + cs.fontSize,
          'visibility: ' + cs.visibility,
          'opacity: ' + cs.opacity,
          'zIndex: ' + cs.zIndex,
          'rect top=' + rect.top + ' bot=' + rect.bottom + ' left=' + rect.left + ' right=' + rect.right,
          'viewport=' + win.innerWidth + 'x' + win.innerHeight,
          'inViewport=' + (rect.top < win.innerHeight && rect.bottom > 0)
        ];
        document.title = 'LB: ' + lines.join(' | ');
        const pre = document.createElement('pre');
        pre.textContent = lines.join('\n');
        pre.style.cssText = 'font:13px monospace;background:#fff;color:#000;padding:10px;white-space:pre-wrap;border:2px solid red;position:fixed;top:910px;left:0;z-index:99999';
        document.body.appendChild(pre);
      }, 1500);
    } catch(e) {
      const pre = document.createElement('pre');
      pre.textContent = 'ERR: ' + e.message;
      pre.style.cssText = 'font:14px monospace;background:#fff;color:red;padding:10px;border:2px solid red;position:fixed;top:910px;left:0;z-index:99999';
      document.body.appendChild(pre);
    }
  }, 3500);
});
</script>
</body>
</html>
