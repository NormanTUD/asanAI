<!doctype html>
<html lang="en"><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>·</title>
<style>
  html,body{margin:0;height:100%;background:#090b12;overflow:hidden}
  canvas{display:block;width:100vw;height:100vh;cursor:pointer}
</style>
<canvas id="c"></canvas>
<script>
/* ---------- config ---------- */
const N = 5;          // tokens
const D = 6;          // dimensions of EVERY vector, everywhere
const L = 3;          // layers (each = attention + ffn)
const V = 180;        // vocabulary size (the embedding "base space")
const CAUSAL = false; // true = GPT-style mask (tokens only look backwards)

const TOK = [[255,125,110],[255,196,98],[120,224,160],[96,205,235],[150,160,255],[226,140,240]];
const GOLD = [255,214,120];

/* ---------- helpers ---------- */
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const sm=x=>{x=clamp(x);return x*x*(3-2*x)};
const lerp=(a,b,t)=>a+(b-a)*t;
const rgba=(c,a)=>`rgba(${c[0]|0},${c[1]|0},${c[2]|0},${a})`;
const dot=(a,b)=>a.reduce((s,v,i)=>s+v*b[i],0);
function rng(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function gauss(r){return Math.sqrt(-2*Math.log(r()+1e-9))*Math.cos(6.2831853*r())}

/* ---------- a tiny real transformer ---------- */
let S,A,MIX,tokIdx,vocab,P,cand,probs;
function build(seed){
  const r=rng(seed), G=()=>gauss(r);
  const mat=(a,b,s)=>Array.from({length:a},()=>Array.from({length:b},()=>G()*s));
  const mv=(m,x)=>m.map(row=>dot(row,x));
  const add=(a,b)=>a.map((v,i)=>v+b[i]);
  const ln=x=>{const m=x.reduce((a,b)=>a+b)/x.length;const v=x.reduce((a,b)=>a+(b-m)**2,0)/x.length;return x.map(b=>(b-m)/Math.sqrt(v+1e-5))};
  const gelu=x=>0.5*x*(1+Math.tanh(0.79788*(x+0.044715*x**3)));

  vocab=Array.from({length:V},()=>ln(Array.from({length:D},G)));
  P=mat(2,D,1/Math.sqrt(D));
  const prj=x=>[dot(P[0],x),dot(P[1],x)];

  tokIdx=[];
  for(let tries=0;tokIdx.length<N&&tries<4000;tries++){
    const k=Math.floor(r()*V),p=prj(vocab[k]);
    if(Math.hypot(p[0],p[1])<1.6 && tokIdx.every(j=>{const q=prj(vocab[j]);return Math.hypot(p[0]-q[0],p[1]-q[1])>1.0})) tokIdx.push(k);
  }
  while(tokIdx.length<N) tokIdx.push(Math.floor(r()*V));

  const pos=Array.from({length:N},()=>ln(Array.from({length:D},G)).map(v=>v*0.35));
  let x=tokIdx.map((t,i)=>ln(add(vocab[t],pos[i])));
  S=[x]; A=[];
  let mx=Array.from({length:N},(_,i)=>Array.from({length:N},(_,j)=>+(i===j)));
  MIX=[mx];

  for(let l=0;l<L;l++){
    // ATTENTION: one set of weights, shared by every token
    const Wq=mat(D,D,1.2/Math.sqrt(D)),Wk=mat(D,D,1.2/Math.sqrt(D)),Wv=mat(D,D,1.2/Math.sqrt(D)),Wo=mat(D,D,1.2/Math.sqrt(D));
    const q=x.map(v=>mv(Wq,v)),k=x.map(v=>mv(Wk,v)),vv=x.map(v=>mv(Wv,v));
    const a=x.map((_,i)=>{
      const sc=x.map((_,j)=>(CAUSAL&&j>i)?-1e9:1.9*dot(q[i],k[j])/Math.sqrt(D));
      const m=Math.max(...sc),e=sc.map(s=>Math.exp(s-m)),z=e.reduce((p,c)=>p+c);
      return e.map(v=>v/z);
    });
    A.push(a);
    x=x.map((xi,i)=>{
      const o=Array(D).fill(0);
      a[i].forEach((w,j)=>vv[j].forEach((val,d)=>o[d]+=w*val));
      return ln(add(xi,mv(Wo,o)));
    });
    mx=mx.map((row,i)=>row.map((_,kk)=>0.5*row[kk]+0.5*a[i].reduce((s,w,j)=>s+w*mx[j][kk],0)));
    S.push(x); MIX.push(mx);

    // FFN: one set of weights, shared by every token
    const W1=mat(3*D,D,1.4/Math.sqrt(D)),W2=mat(D,3*D,1.2/Math.sqrt(3*D));
    x=x.map(xi=>ln(add(xi,mv(W2,mv(W1,xi).map(gelu)).map(v=>v*1.3))));
    S.push(x); MIX.push(mx);
  }

  // readout: last token vs. the same embedding space
  const last=S[2*L][N-1];
  const sc=vocab.map(v=>dot(v,last));
  cand=sc.map((s,i)=>[s,i]).sort((a,b)=>b[0]-a[0]).slice(0,8).map(p=>p[1]);
  const lg=cand.map(i=>sc[i]*0.8),m=Math.max(...lg),e=lg.map(v=>Math.exp(v-m)),z=e.reduce((a,b)=>a+b);
  probs=e.map(v=>v/z);
  place();
}

/* ---------- canvas + layout ---------- */
const cv=document.getElementById('c'),g=cv.getContext('2d');
let W,H,Ly,VP=[];
function pt(x){
  const z0=dot(P[0],x),z1=dot(P[1],x),s=Ly.sp;
  return [s.x+s.s/2+Math.tanh(z0/2.3)*s.s*0.45, s.y+s.s/2+Math.tanh(z1/2.3)*s.s*0.45];
}
function place(){ if(vocab&&Ly) VP=vocab.map(pt); }
function layout(){
  const portrait=W<H*0.85,pad=Math.max(16,Math.min(W,H)*0.045),barsW=clamp(W*0.07,40,120);
  let sp,px,py,pw,ph;
  if(!portrait){
    const side=Math.min(H-2*pad,W*0.3);
    sp={x:pad,y:(H-side)/2,s:side};
    px=sp.x+side+pad*1.6; pw=W-px-pad-barsW-pad*0.8;
    ph=Math.min(H*0.7,pw*0.5); py=(H-ph)/2;
  }else{
    const side=Math.min(W-2*pad,H*0.36);
    sp={x:(W-side)/2,y:pad,s:side};
    px=pad; pw=W-2*pad-barsW-pad*0.5;
    ph=Math.min(H-side-3*pad,pw); py=sp.y+side+pad*1.6;
  }
  const cols=2*L+1,colW=pw/(1+(cols-1)*2.3),s=colW/D;
  const pitchX=(pw-colW)/(cols-1),pitchY=ph/N;
  Ly={sp,px,py,pw,ph,colW,s,pitchX,pitchY,cellH:clamp(s*2.2,5,pitchY*0.42),bx:px+pw+pad*0.8,bw:barsW};
  place();
}
function resize(){
  const dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;
  cv.width=W*dpr;cv.height=H*dpr;g.setTransform(dpr,0,0,dpr,0,0);layout();
}
addEventListener('resize',resize);

const X=c=>Ly.px+c*Ly.pitchX, Y=i=>Ly.py+Ly.pitchY*(i+.5);
function rr(x,y,w,h,r){g.beginPath();g.roundRect?g.roundRect(x,y,w,h,r):g.rect(x,y,w,h)}
function cellColor(x){
  const v=clamp(x/2,-1,1);
  return v>=0?`hsl(${42-12*v} ${70+20*v}% ${14+58*v}%)`:`hsl(${232+20*v} ${50-20*v}% ${14-46*v}%)`;
}
function mixRGB(m){let r=0,gg=0,b=0;m.forEach((w,k)=>{r+=w*TOK[k][0];gg+=w*TOK[k][1];b+=w*TOK[k][2]});return[r,gg,b]}
function bz(x1,y1,x2,y2,p){const mx=(x1+x2)/2,q=1-p,a=q*q*q,b=3*q*q*p,c=3*q*p*p,d=p*p*p;return[a*x1+b*mx+c*mx+d*x2,a*y1+b*y1+c*y2+d*y2]}
function ribbon(x1,y1,x2,y2,w,col,al){g.beginPath();g.moveTo(x1,y1);const mx=(x1+x2)/2;g.bezierCurveTo(mx,y1,mx,y2,x2,y2);g.lineWidth=w;g.strokeStyle=rgba(col,al);g.stroke()}
function comet(x1,y1,x2,y2,p,col,r){
  for(let k=0;k<5;k++){const q=p-k*0.035;if(q<0||q>1)continue;
    const[x,y]=bz(x1,y1,x2,y2,q);g.fillStyle=rgba(col,(1-k/5)*0.95);g.beginPath();g.arc(x,y,r*(1-k*0.14),0,6.283);g.fill()}
}

/* ---------- timeline ---------- */
const T_EMB=2.8,T_STEP=2.7,T_OUT=3.2,T_HOLD=2.4;
const total=T_EMB+2*L*T_STEP+T_OUT+T_HOLD;
let stage,u,outU,cp=[];
const colVec=(c,i)=>{const p=cp[c];return(c===0||p>=1)?S[c][i]:S[c-1][i].map((v,d)=>lerp(v,S[c][i][d],p))};
const colMix=(c,i)=>{const p=cp[c];return(c===0||p>=1)?MIX[c][i]:MIX[c-1][i].map((v,k)=>lerp(v,MIX[c][i][k],p))};

function draw(t){
  const tt=t%total,tEnd=T_EMB+2*L*T_STEP;
  if(tt<T_EMB){stage=-1;u=tt/T_EMB}
  else if(tt<tEnd){const q=tt-T_EMB;stage=Math.floor(q/T_STEP);u=(q%T_STEP)/T_STEP}
  else if(tt<tEnd+T_OUT){stage=2*L;u=(tt-tEnd)/T_OUT}
  else{stage=2*L+1;u=(tt-tEnd-T_OUT)/T_HOLD}
  outU=stage===2*L?u:(stage>2*L?1:0);
  for(let c=0;c<=2*L;c++){
    cp[c]=c===0?(stage===-1?sm((u-0.3)/0.5):1):(stage===c-1?sm((u-0.45)/0.5):(stage>c-1?1:0));
  }
  const gA=sm(tt/0.7)*(1-sm((tt-(total-1.1))/1.0));

  // background
  g.globalAlpha=1;g.globalCompositeOperation='source-over';
  g.fillStyle='#090b12';g.fillRect(0,0,W,H);
  const bg=g.createRadialGradient(W/2,H/2,0,W/2,H/2,Math.max(W,H)*0.7);
  bg.addColorStop(0,'rgba(40,46,80,.28)');bg.addColorStop(1,'rgba(0,0,0,0)');
  g.fillStyle=bg;g.fillRect(0,0,W,H);
  g.globalAlpha=gA;

  /* ===== embedding / semantic space ===== */
  const sp=Ly.sp;
  rr(sp.x,sp.y,sp.s,sp.s,22);g.fillStyle='rgba(255,255,255,.015)';g.fill();
  g.strokeStyle='rgba(255,255,255,.08)';g.lineWidth=1;g.stroke();
  g.fillStyle='rgba(255,255,255,.05)';
  for(let a=1;a<9;a++)for(let b=1;b<9;b++){g.beginPath();g.arc(sp.x+sp.s*a/9,sp.y+sp.s*b/9,1,0,6.283);g.fill()}
  g.fillStyle='rgba(200,210,255,.24)';
  VP.forEach(p=>{g.beginPath();g.arc(p[0],p[1],1.5,0,6.283);g.fill()});

  let front=0;for(let c=0;c<=2*L;c++)if(cp[c]>0)front=c;
  const heads=[];
  const tokA=stage===-1?sm(u*4):1;

  // embed: chosen vocabulary points light up
  if(stage===-1){
    g.globalCompositeOperation='lighter';
    tokIdx.forEach((k,i)=>{
      g.strokeStyle=rgba(TOK[i],(1-u)*0.9);g.lineWidth=1.5;
      g.beginPath();g.arc(VP[k][0],VP[k][1],4+16*sm(u),0,6.283);g.stroke();
    });
    g.globalCompositeOperation='source-over';
  }

  // attention lines inside the space
  const isAttn=stage>=0&&stage<2*L&&stage%2===0;
  for(let i=0;i<N;i++)heads[i]=pt(colVec(front,i));
  if(isAttn){
    const env=Math.sin(Math.PI*clamp(u)),a=A[stage>>1];
    g.globalCompositeOperation='lighter';
    for(let i=0;i<N;i++)for(let j=0;j<N;j++){
      if(i===j||a[i][j]<0.06)continue;
      g.strokeStyle=rgba(TOK[j],a[i][j]*0.6*env);g.lineWidth=0.5+2.5*a[i][j];
      g.beginPath();g.moveTo(heads[j][0],heads[j][1]);g.lineTo(heads[i][0],heads[i][1]);g.stroke();
    }
    g.globalCompositeOperation='source-over';
  }

  // trails + glowing token points
  for(let i=0;i<N;i++){
    const pts=[];for(let c=0;c<=front;c++)pts.push(pt(colVec(c,i)));
    g.beginPath();pts.forEach((p,k)=>k?g.lineTo(p[0],p[1]):g.moveTo(p[0],p[1]));
    g.strokeStyle=rgba(TOK[i],0.4*tokA);g.lineWidth=1.3;g.stroke();
    pts.slice(0,-1).forEach(p=>{g.fillStyle=rgba(TOK[i],0.55*tokA);g.beginPath();g.arc(p[0],p[1],2,0,6.283);g.fill()});
    const h=pts[pts.length-1];
    g.shadowColor=rgba(TOK[i],0.9);g.shadowBlur=16;
    g.fillStyle=rgba(TOK[i],tokA);g.beginPath();g.arc(h[0],h[1],5,0,6.283);g.fill();g.shadowBlur=0;
  }

  // readout rings in the space
  if(outU>0){
    const grow=sm((outU-0.4)/0.5);
    cand.forEach((k,n)=>{
      g.strokeStyle=rgba(n===0?GOLD:[190,200,230],(n===0?0.9:0.35)*grow);g.lineWidth=n===0?2:1;
      g.beginPath();g.arc(VP[k][0],VP[k][1],3+18*probs[n]*grow/probs[0]*0.9,0,6.283);g.stroke();
    });
  }

  /* ===== layer brackets ===== */
  const yb=Ly.py-14;
  for(let l=0;l<L;l++){
    const x1=X(2*l)+Ly.colW/2+5,x2=X(2*l+2)+Ly.colW/2-5;
    const act=(stage===2*l||stage===2*l+1)?1:0, seen=stage>=2*l?1:0;
    g.strokeStyle=`rgba(255,255,255,${0.04+0.08*seen+0.4*act})`;g.lineWidth=1.4;
    g.beginPath();g.moveTo(x1,yb+5);g.lineTo(x1,yb);g.lineTo(x2,yb);g.lineTo(x2,yb+5);g.stroke();
  }

  /* ===== gaps: attention (ribbons) and ffn (shared lenses) ===== */
  for(let c=1;c<=2*L;c++){
    if(stage<c-1)continue;
    const attn=(c-1)%2===0,layer=(c-1)>>1,active=stage===c-1;
    const uu=active?u:1,env=active?Math.sin(Math.PI*clamp(u)):0;
    const xs=X(c-1)+Ly.colW+8,xd=X(c)-12,gap=xd-xs;

    // the shared operator: identical capsule for every token
    rr(xs-3,Ly.py-6,gap+6,Ly.ph+12,16);
    g.fillStyle=`rgba(255,255,255,${0.012+0.03*env})`;g.fill();
    g.strokeStyle=`rgba(255,255,255,${0.06+0.18*env})`;g.lineWidth=1;g.stroke();

    // residual stream
    for(let i=0;i<N;i++){
      g.strokeStyle=rgba(mixRGB(MIX[c-1][i]),0.1);g.lineWidth=1;
      g.beginPath();g.moveTo(xs,Y(i));g.lineTo(xd,Y(i));g.stroke();
    }
    const pp=clamp((uu-0.08)/0.55);
    g.globalCompositeOperation='lighter';

    if(attn){
      const a=A[layer];
      for(let i=0;i<N;i++)for(let j=0;j<N;j++){
        const w=a[i][j];if(w<0.03)continue;
        const col=mixRGB(MIX[c-1][j]);
        if(active){
          const al=(0.12+0.65*w)*sm(u/0.2)*(1-0.7*sm((u-0.85)/0.15));
          ribbon(xs,Y(j),xd,Y(i),0.6+4*w,col,al);
          if(pp>0&&pp<1)comet(xs,Y(j),xd,Y(i),pp,col,1.2+3*Math.sqrt(w));
        }else if(w>0.08){
          ribbon(xs,Y(j),xd,Y(i),0.5+2*w,col,0.04+0.1*w);
        }
      }
    }else{
      const gx0=xs+gap*0.3,gx1=xd-gap*0.3,hh=Ly.cellH*1.1,mid=(gx0+gx1)/2;
      for(let i=0;i<N;i++){
        const y=Y(i),col=mixRGB(MIX[c-1][i]);
        const inside=active&&pp>0.3&&pp<0.7?Math.sin(Math.PI*(pp-0.3)/0.4):0;
        g.beginPath();g.moveTo(xs,y);g.lineTo(gx0,y);
        g.quadraticCurveTo(mid,y-2*hh,gx1,y);g.lineTo(xd,y);
        g.moveTo(gx0,y);g.quadraticCurveTo(mid,y+2*hh,gx1,y);
        g.strokeStyle=rgba(col,0.18+0.35*env);g.lineWidth=1.2;g.stroke();
        if(inside>0){
          g.beginPath();g.moveTo(gx0,y);g.quadraticCurveTo(mid,y-2*hh,gx1,y);g.quadraticCurveTo(mid,y+2*hh,gx0,y);
          g.fillStyle=rgba(col,0.16*inside);g.fill();
        }
        if(active&&pp>0&&pp<1){ // every token moves in lock-step
          const x=lerp(xs,xd,pp);
          g.fillStyle=rgba(col,0.95);g.beginPath();g.arc(x,y,2.8,0,6.283);g.fill();
        }
      }
    }
    g.globalCompositeOperation='source-over';
  }

  /* ===== embed: space -> vectors ===== */
  if(stage===-1){
    const head=sm(clamp(u/0.75)),fade=1-sm((u-0.75)/0.25);
    g.globalCompositeOperation='lighter';
    for(let i=0;i<N;i++){
      const p0=VP[tokIdx[i]],x1=p0[0],y1=p0[1],x2=X(0)-14,y2=Y(i);
      g.beginPath();
      for(let k=0;k<=28;k++){const[x,y]=bz(x1,y1,x2,y2,head*k/28);k?g.lineTo(x,y):g.moveTo(x,y)}
      g.strokeStyle=rgba(TOK[i],0.5*fade);g.lineWidth=1.6;g.stroke();
      if(head<1)comet(x1,y1,x2,y2,head,TOK[i],3);
    }
    g.globalCompositeOperation='source-over';
  }

  /* ===== columns of vectors (identical shape at every stage) ===== */
  for(let c=0;c<=2*L;c++){
    if(c>0&&stage<c-1)continue;
    if(c===0&&cp[0]<=0)continue;
    const a=c===0?sm(cp[0]):1;
    for(let i=0;i
<N;i++){
      const v=colVec(c,i),x0=X(c),y=Y(i),h=Ly.cellH;
      // each dimension = one cell; same width and count in every column
      for(let d=0;d<D;d++){
        g.globalAlpha=gA*a;
        rr(x0+d*Ly.s+0.5,y-h/2,Ly.s-1,h,Math.min(3,Ly.s/3));
        g.fillStyle=cellColor(v[d]);g.fill();
      }
      // thin strip underneath: whose meaning is mixed into this token right now
      const m=colMix(c,i),tot=m.reduce((p,q)=>p+q,0)||1;
      let sx=x0;
      m.forEach((w,k)=>{
        const sw=Ly.colW*w/tot;if(sw<0.3)return;
        g.fillStyle=rgba(TOK[k],0.9);
        g.fillRect(sx,y+h/2+3,sw,2.5);
        sx+=sw;
      });
      // identity dot on the left, so you can follow each token through the layers
      g.fillStyle=rgba(TOK[i],0.9);
      g.beginPath();g.arc(x0-7,y,2.2,0,6.283);g.fill();
    }
  }
  g.globalAlpha=gA;

  /* ===== readout: last column -> probability bars ===== */
  if(outU>0){
    const grow=sm((outU-0.15)/0.6),xs=X(2*L)+Ly.colW+8,xd=Ly.bx-6;
    const slot=Ly.ph/cand.length,bh=Math.min(10,slot*0.45);
    g.globalCompositeOperation='lighter';
    cand.forEach((k,n)=>{
      const by=Ly.py+slot*(n+0.5),first=n===0;
      const col=first?GOLD:[190,200,230];
      const al=(first?0.7:0.2+0.5*probs[n])*grow;
      ribbon(xs,Y(N-1),xd,by,0.6+3*probs[n]*3,col,al*0.8);
      if(grow<1)comet(xs,Y(N-1),xd,by,grow,col,2);
    });
    g.globalCompositeOperation='source-over';
    cand.forEach((k,n)=>{
      const by=Ly.py+slot*(n+0.5),first=n===0;
      const bw=Ly.bw*(probs[n]/probs[0])*sm((outU-0.35)/0.5);
      rr(Ly.bx,by-bh/2,Math.max(bw,2),bh,bh/2);
      g.fillStyle=first?rgba(GOLD,0.95):'rgba(190,200,230,.45)';
      if(first){g.shadowColor=rgba(GOLD,0.8);g.shadowBlur=14}
      g.fill();g.shadowBlur=0;
    });
  }

  g.globalAlpha=1;
  g.globalCompositeOperation='source-over';
}

/* ---------- loop + interaction ---------- */
let seed=7,clock=0,paused=false,lastT=performance.now();
function frame(now){
  const dt=Math.min(0.05,(now-lastT)/1000);
  lastT=now;
  if(!paused)clock+=dt;
  draw(clock);
  requestAnimationFrame(frame);
}
cv.addEventListener('click',()=>{
  seed=(Math.random()*1e9)|0;
  build(seed);
  clock=0;
});
addEventListener('keydown',e=>{
  if(e.code==='Space'){paused=!paused;e.preventDefault()}
});
resize();
build(seed);
requestAnimationFrame(frame);
</script>
</html>
