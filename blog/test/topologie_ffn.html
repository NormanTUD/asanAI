      tDiffuse: { value: null },
      uDir: { value: new THREE.Vector2(1, 0) },
      uTexel: { value: new THREE.Vector2(1 / 100, 1 / 100) }
    });
    compMat = makeFSMaterial(COMP_FRAG, {
      tScene: { value: sceneRT.texture },
      tBloomA: { value: bloomA.texture },
      tBloomB: { value: bloomC.texture },
      uTime: { value: 0 },
      uExposure: { value: 1.02 }
    });
  }

  function drawFS(material, target) {
    fsQuad.material = material;
    fsQuad.visible = true;
    renderer.setRenderTarget(target);
    renderer.clear();
    renderer.render(fsQuad, fsCam);
    fsQuad.visible = false;
  }

  function resize() {
    const w = window.innerWidth, h = window.innerHeight;
    renderer.setPixelRatio(DPR);
    renderer.setSize(w, h);
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
    const W = Math.floor(w * DPR), H = Math.floor(h * DPR);
    if (sceneRT) {
      sceneRT.setSize(W, H);
      bloomA.setSize(Math.floor(W / 4), Math.floor(H / 4));
      bloomB.setSize(Math.floor(W / 4), Math.floor(H / 4));
      bloomC.setSize(Math.floor(W / 8), Math.floor(H / 8));
      bloomD.setSize(Math.floor(W / 8), Math.floor(H / 8));
    }
  }
  window.addEventListener("resize", resize);

  function renderPost() {
    renderer.setRenderTarget(sceneRT);
    renderer.clear(true, true, true);
    renderer.render(scene, camera);

    drawFS(brightMat, bloomA);

    blurMat.uniforms.tDiffuse.value = bloomA.texture;
    blurMat.uniforms.uDir.value.set(1, 0);
    blurMat.uniforms.uTexel.value.set(1 / bloomA.width, 1 / bloomA.height);
    drawFS(blurMat, bloomB);
    blurMat.uniforms.tDiffuse.value = bloomB.texture;
    blurMat.uniforms.uDir.value.set(0, 1);
    drawFS(blurMat, bloomA);

    // wider, softer level
    blurMat.uniforms.tDiffuse.value = bloomA.texture;
    blurMat.uniforms.uDir.value.set(1, 0);
    blurMat.uniforms.uTexel.value.set(1 / bloomA.width, 1 / bloomA.height);
    drawFS(blurMat, bloomC);
    blurMat.uniforms.tDiffuse.value = bloomC.texture;
    blurMat.uniforms.uDir.value.set(0, 1);
    drawFS(blurMat, bloomD);
    blurMat.uniforms.tDiffuse.value = bloomD.texture;
    blurMat.uniforms.uDir.value.set(1, 0);
    blurMat.uniforms.uTexel.value.set(1 / bloomC.width, 1 / bloomC.height);
    drawFS(blurMat, bloomC);

    drawFS(compMat, null);
  }

  /* ============================================================
     build the base mesh
     ============================================================ */
  const buildStart = performance.now();
  const meshData = buildSurfaceMesh();
  const meshGeo = new THREE.BufferGeometry();
  meshGeo.setAttribute("position", new THREE.BufferAttribute(meshData.positions, 3));
  meshGeo.setAttribute("normal", new THREE.BufferAttribute(meshData.normals, 3));
  meshGeo.setAttribute("aBary", new THREE.BufferAttribute(meshData.bary, 3));
  meshGeo.setAttribute("aCentroid", new THREE.BufferAttribute(meshData.centroids, 3));
  meshGeo.setAttribute("aSeed", new THREE.BufferAttribute(meshData.seeds, 1));
  meshGeo.computeBoundingSphere();
  const buildMs = performance.now() - buildStart;

  /* ============================================================
     materials
     ============================================================ */
  const COL = {
    cyan:   new THREE.Color(0.16, 0.62, 0.95),
    violet: new THREE.Color(0.52, 0.22, 0.92),
    gold:   new THREE.Color(1.00, 0.62, 0.24),
    rose:   new THREE.Color(0.95, 0.30, 0.52),
    ice:    new THREE.Color(0.30, 0.85, 1.00)
  };

  const materialRecords = [];

  function regMat(mat, offset) {
    materialRecords.push({ mat, offset: offset || 0 });
    return mat;
  }

  function surfaceMaterial(seed, colA, colB, rimA, rimB) {
    return regMat(new THREE.ShaderMaterial({
      uniforms: {
        uTime: { value: 0 },
        uMorph: { value: 1 },
        uSeed: { value: seed },
        uGrow: { value: 0 },
        uOpacity: { value: 0 },
        uColA: { value: colA.clone() },
        uColB: { value: colB.clone() },
        uRimA: { value: (rimA || colA).clone() },
        uRimB: { value: (rimB || colB).clone() }
      },
      vertexShader: SURFACE_VERT,
      fragmentShader: SURFACE_FRAG,
      transparent: true,
      depthWrite: false,
      depthTest: true,
      side: THREE.DoubleSide,
      blending: THREE.NormalBlending
    }), seed * 4.1);
  }

  function depthMaterial(seed) {
    return regMat(new THREE.ShaderMaterial({
      uniforms: {
        uTime: { value: 0 },
        uMorph: { value: 1 },
        uSeed: { value: seed },
        uGrow: { value: 1 }
      },
      vertexShader: WARP_GLSL + `
        uniform float uGrow;
        void main() {
          vec3 w = mnWarp(position);
          gl_Position = projectionMatrix * viewMatrix * modelMatrix * vec4(w, 1.0);
        }
      `,
      fragmentShader: `void main() { gl_FragColor = vec4(0.0); }`,
      colorWrite: false,
      depthWrite: true,
      depthTest: true,
      side: THREE.DoubleSide
    }), seed * 4.1);
  }

  function edgeMaterial(seed, colA, colB) {
    return regMat(new THREE.ShaderMaterial({
      uniforms: {
        uTime: { value: 0 },
        uMorph: { value: 1 },
        uSeed: { value: seed },
        uGrow: { value: 0 },
        uOpacity: { value: 0 },
        uColA: { value: colA.clone() },
        uColB: { value: colB.clone() }
      },
      vertexShader: EDGE_VERT,
      fragmentShader: EDGE_FRAG,
      transparent: true,
      depthWrite: false,
      depthTest: true,
      side: THREE.DoubleSide,
      blending: THREE.AdditiveBlending
    }), seed * 4.7);
  }

  function pointMaterial(seed, flowDir, sizeScale) {
    return regMat(new THREE.ShaderMaterial({
      uniforms: {
        uTime: { value: 0 },
        uMorph: { value: 1 },
        uSeed: { value: seed },
        uFlowDir: { value: flowDir || 1 },
        uOpacity: { value: 0 },
        uPixelRatio: { value: DPR },
        uSizeScale: { value: sizeScale || 1.0 }
      },
      vertexShader: POINT_VERT,
      fragmentShader: POINT_FRAG,
      transparent: true,
      depthWrite: false,
      depthTest: true,
      blending: THREE.AdditiveBlending
    }), seed * 5.3);
  }

  function trailMaterial(seed, flowDir) {
    return regMat(new THREE.ShaderMaterial({
      uniforms: {
        uTime: { value: 0 },
        uMorph: { value: 1 },
        uSeed: { value: seed },
        uFlowDir: { value: flowDir || 1 },
        uOpacity: { value: 0 }
      },
      vertexShader: TRAIL_VERT,
      fragmentShader: TRAIL_FRAG,
      transparent: true,
      depthWrite: false,
      depthTest: true,
      blending: THREE.AdditiveBlending
    }), seed * 5.9);
  }

  function sparkMaterial(seed, sizeScale) {
    return regMat(new THREE.ShaderMaterial({
      uniforms: {
        uTime: { value: 0 },
        uMorph: { value: 1 },
        uSeed: { value: seed },
        uOpacity: { value: 0 },
        uPixelRatio: { value: DPR },
        uSizeScale: { value: sizeScale || 1.0 }
      },
      vertexShader: SPARK_VERT,
      fragmentShader: POINT_FRAG,
      transparent: true,
      depthWrite: false,
      depthTest: true,
      blending: THREE.AdditiveBlending
    }), seed * 6.1);
  }

  /* ============================================================
     the main island
     ============================================================ */
  const mainGroup = new THREE.Group();
  scene.add(mainGroup);

  const mainSeed = 0;
  const mainDepthMat = depthMaterial(mainSeed);
  const mainDepth = new THREE.Mesh(meshGeo, mainDepthMat);
  mainDepth.renderOrder = 1;
  mainDepth.frustumCulled = false;
  mainGroup.add(mainDepth);

  const mainSurfaceMat = surfaceMaterial(mainSeed, COL.cyan, COL.violet, COL.ice, COL.violet);
  const mainSurface = new THREE.Mesh(meshGeo, mainSurfaceMat);
  mainSurface.renderOrder = 2;
  mainSurface.frustumCulled = false;
  mainGroup.add(mainSurface);

  const mainEdgeMat = edgeMaterial(mainSeed, COL.ice, COL.rose);
  const mainEdges = new THREE.Mesh(meshGeo, mainEdgeMat);
  mainEdges.renderOrder = 6;
  mainEdges.frustumCulled = false;
  mainGroup.add(mainEdges);

  /* particles that flow on the two handles */
  function makeTorusPoints(count, seed, sizeScale) {
    const g = new THREE.BufferGeometry();
    const phase = new Float32Array(count);
    const speed = new Float32Array(count);
    const vv = new Float32Array(count);
    const size = new Float32Array(count);
    const torus = new Float32Array(count);
    const hue = new Float32Array(count);
    const s = new Float32Array(count);
    for (let i = 0; i < count; i++) {
      phase[i] = rand() * Math.PI * 2;
      speed[i] = (0.10 + rand() * 0.22) * (rand() < 0.5 ? 1 : -1);
      vv[i] = rand() * Math.PI * 2;
      size[i] = 1.2 + Math.pow(rand(), 1.5) * 4.6;
      torus[i] = rand() < 0.5 ? 0 : 1;
      hue[i] = rand();
      s[i] = rand();
    }
    g.setAttribute("position", new THREE.BufferAttribute(new Float32Array(count * 3), 3));
    g.setAttribute("aPhase", new THREE.BufferAttribute(phase, 1));
    g.setAttribute("aSpeed", new THREE.BufferAttribute(speed, 1));
    g.setAttribute("aV", new THREE.BufferAttribute(vv, 1));
    g.setAttribute("aSize", new THREE.BufferAttribute(size, 1));
    g.setAttribute("aTorus", new THREE.BufferAttribute(torus, 1));
    g.setAttribute("aHue", new THREE.BufferAttribute(hue, 1));
    g.setAttribute("aSeed", new THREE.BufferAttribute(s, 1));
    const m = pointMaterial(seed, 1, sizeScale);
    const p = new THREE.Points(g, m);
    p.frustumCulled = false;
    p.renderOrder = 5;
    return { points: p, geo: g, mat: m };
  }

  const mainPoints = makeTorusPoints(2600, 0.02, 1.12);
  mainGroup.add(mainPoints.points);

  /* a few comet trails */
  function makeTrails(count, segments, seed) {
    const g = new THREE.BufferGeometry();
    const verts = count * segments * 2;
    const age = new Float32Array(verts);
    const phase = new Float32Array(verts);
    const speed = new Float32Array(verts);
    const vv = new Float32Array(verts);
    const torus = new Float32Array(verts);
    const hue = new Float32Array(verts);
    const s = new Float32Array(verts);
    const pos = new Float32Array(verts * 3);
    for (let i = 0; i < count; i++) {
      const ph = rand() * Math.PI * 2;
      const sp = (0.12 + rand() * 0.18) * (rand() < 0.5 ? 1 : -1);
      const v0 = rand() * Math.PI * 2;
      const tc = rand() < 0.5 ? 0 : 1;
      const hu = rand() < 0.72 ? rand() * 0.45 : 0.65 + rand() * 0.35;
      const sd = rand();
      for (let j = 0; j < segments; j++) {
        const a0 = j / segments;
        for (let e = 0; e < 2; e++) {
          const idx = (i * segments + j) * 2 + e;
          age[idx] = a0 + (e ? 1 / segments : 0);
          phase[idx] = ph;
          speed[idx] = sp;
          vv[idx] = v0;
          torus[idx] = tc;
          hue[idx] = hu;
          s[idx] = sd;
        }
      }
    }
    g.setAttribute("position", new THREE.BufferAttribute(pos, 3));
    g.setAttribute("aAge", new THREE.BufferAttribute(age, 1));
    g.setAttribute("aPhase", new THREE.BufferAttribute(phase, 1));
    g.setAttribute("aSpeed", new THREE.BufferAttribute(speed, 1));
    g.setAttribute("aV", new THREE.BufferAttribute(vv, 1));
    g.setAttribute("aTorus", new THREE.BufferAttribute(torus, 1));
    g.setAttribute("aHue", new THREE.BufferAttribute(hue, 1));
    g.setAttribute("aSeed", new THREE.BufferAttribute(s, 1));
    const m = trailMaterial(seed, 1);
    const lines = new THREE.LineSegments(g, m);
    lines.frustumCulled = false;
    lines.renderOrder = 4;
    return { lines, geo: g, mat: m };
  }

  const mainTrails = makeTrails(420, 7, 0.04);
  mainGroup.add(mainTrails.lines);

  /* static sparkles sampling the real triangle mesh (fills the bridge) */
  function makeSparks(count, seed) {
    const g = new THREE.BufferGeometry();
    const n = meshData.vertexCount;
    const pos = new Float32Array(count * 3);
    const size = new Float32Array(count);
    const s = new Float32Array(count);
    const hue = new Float32Array(count);
    for (let i = 0; i < count; i++) {
      const vi = Math.floor(rand() * n);
      pos[i*3] = meshData.sourcePositions[vi*3];
      pos[i*3+1] = meshData.sourcePositions[vi*3+1];
      pos[i*3+2] = meshData.sourcePositions[vi*3+2];
      size[i] = 0.8 + Math.pow(rand(), 2) * 2.8;
      s[i] = rand();
      hue[i] = rand();
    }
    g.setAttribute("position", new THREE.BufferAttribute(pos, 3));
    g.setAttribute("aSize", new THREE.BufferAttribute(size, 1));
    g.setAttribute("aSeed", new THREE.BufferAttribute(s, 1));
    g.setAttribute("aHue", new THREE.BufferAttribute(hue, 1));
    const m = sparkMaterial(seed, 1.15);
    const p = new THREE.Points(g, m);
    p.frustumCulled = false;
    p.renderOrder = 5;
    return { points: p, geo: g, mat: m };
  }

  const mainSparks = makeSparks(1500, 0.06);
  mainGroup.add(mainSparks.points);

  /* ============================================================
     a library of other surfaces for the surrounding landscape
     ============================================================ */
  const RED_A = new THREE.Color(0.98, 0.06, 0.11);
  const RED_B = new THREE.Color(1.00, 0.40, 0.10);
  const GREEN = new THREE.Color(0.18, 0.95, 0.62);
  const PINK  = new THREE.Color(0.96, 0.28, 0.84);
  const ORANGE = new THREE.Color(1.00, 0.54, 0.16);

  function mergeNonIndexed(geos) {
    let total = 0;
    for (const g of geos) total += g.attributes.position.count;
    const pos = new Float32Array(total * 3);
    const nor = new Float32Array(total * 3);
    let off = 0;
    for (const g of geos) {
      const p = g.attributes.position.array;
      const n = g.attributes.normal.array;
      pos.set(p, off * 3);
      nor.set(n, off * 3);
      off += p.length / 3;
    }
    const out = new THREE.BufferGeometry();
    out.setAttribute("position", new THREE.BufferAttribute(pos, 3));
    out.setAttribute("normal", new THREE.BufferAttribute(nor, 3));
    return out;
  }

  function makeChainGeo() {
    const list = [];
    for (let i = -1; i <= 1; i++) {
      const g = new THREE.TorusGeometry(0.62, 0.22, 16, 84);
      g.rotateY(i * 0.34);
      g.rotateZ(i * 0.12);
      g.translate(i * 0.72, 0, 0);
      list.push(g.toNonIndexed());
    }
    return mergeNonIndexed(list);
  }

  function makeShellGeo() {
    const nu = 210, nv = 28, turns = 3.35;
    const pos = [];
    const idx = [];
    const center = (u) => {
      const th = u * turns * Math.PI * 2;
      const R = 0.18 + 1.02 * u;
      return new THREE.Vector3(Math.cos(th) * R, -1.0 + 1.85 * u, Math.sin(th) * R);
    };
    for (let i = 0; i <= nu; i++) {
      const u = i / nu;
      const c = center(u);
      const c0 = center(Math.max(0, u - 0.002));
      const c1 = center(Math.min(1, u + 0.002));
      const T = c1.clone().sub(c0).normalize();
      const up = new THREE.Vector3(0, 1, 0);
      const N = new THREE.Vector3().crossVectors(T, up).normalize();
      const B = new THREE.Vector3().crossVectors(T, N).normalize();
      const rad = 0.055 + 0.285 * u;
      for (let j = 0; j <= nv; j++) {
        const v = j / nv * Math.PI * 2;
        const p = c.clone()
          .addScaledVector(N, Math.cos(v) * rad)
          .addScaledVector(B, Math.sin(v) * rad);
        pos.push(p.x, p.y, p.z);
      }
    }
    for (let i = 0; i < nu; i++) {
      for (let j = 0; j < nv; j++) {
        const a = i * (nv + 1) + j;
        const b = a + (nv + 1);
        idx.push(a, b, a + 1, b, b + 1, a + 1);
      }
    }
    const g = new THREE.BufferGeometry();
    g.setAttribute("position", new THREE.Float32BufferAttribute(pos, 3));
    g.setIndex(idx);
    g.computeVertexNormals();
    return g;
  }

  function makeBlobGeo(spiky) {
    const nu = 92, nv = 46;
    const pos = [];
    const idx = [];
    for (let j = 0; j <= nv; j++) {
      const phi = j / nv * Math.PI;
      const sp = Math.sin(phi), cp = Math.cos(phi);
      for (let i = 0; i <= nu; i++) {
        const th = i / nu * Math.PI * 2;
        const r = spiky
          ? 0.84 + 0.23 * Math.sin(7 * th) * Math.sin(6 * phi) + 0.10 * Math.sin(13 * th + 4 * phi)
          : 0.92 + 0.17 * Math.sin(5 * th) * Math.sin(3 * phi) + 0.055 * Math.sin(9 * th + 2 * phi);
        pos.push(r * sp * Math.cos(th), r * cp, r * sp * Math.sin(th));
      }
    }
    for (let j = 0; j < nv; j++) {
      for (let i = 0; i < nu; i++) {
        const a = j * (nu + 1) + i;
        const b = a + 1;
        const c = a + (nu + 1);
        const d = c + 1;
        idx.push(a, b, d, a, d, c);
      }
    }
    const g = new THREE.BufferGeometry();
    g.setAttribute("position", new THREE.Float32BufferAttribute(pos, 3));
    g.setIndex(idx);
    g.computeVertexNormals();
    return g;
  }

  function toSimplicial(src) {
    let g = src.index ? src.toNonIndexed() : src;
    if (!g.attributes.normal) g.computeVertexNormals();
    const pos = g.attributes.position.array;
    const nor = g.attributes.normal.array;
    const triCount = pos.length / 9;
    const P = new Float32Array(triCount * 9);
    const N = new Float32Array(triCount * 9);
    const B = new Float32Array(triCount * 9);
    const C = new Float32Array(triCount * 9);
    const S = new Float32Array(triCount * 3);
    for (let t = 0; t < triCount; t++) {
      const o = t * 9;
      const ax = pos[o], ay = pos[o+1], az = pos[o+2];
      const bx = pos[o+3], by = pos[o+4], bz = pos[o+5];
      const cx = pos[o+6], cy = pos[o+7], cz = pos[o+8];
      const mx = (ax + bx + cx) / 3, my = (ay + by + cy) / 3, mz = (az + bz + cz) / 3;
      const seed = 0.62 * fract(0.5 + 0.5 * Math.sin(mx*1.37 + my*2.13 + mz*1.71)) + 0.06 * rand();
      for (let q = 0; q < 3; q++) {
        const k = o + q * 3;
        P[k] = pos[k]; P[k+1] = pos[k+1]; P[k+2] = pos[k+2];
        N[k] = nor[k]; N[k+1] = nor[k+1]; N[k+2] = nor[k+2];
        B[k] = q === 0 ? 1 : 0;
        B[k+1] = q === 1 ? 1 : 0;
        B[k+2] = q === 2 ? 1 : 0;
        C[k] = mx; C[k+1] = my; C[k+2] = mz;
        S[t*3+q] = seed;
      }
    }
    const out = new THREE.BufferGeometry();
    out.setAttribute("position", new THREE.BufferAttribute(P, 3));
    out.setAttribute("normal", new THREE.BufferAttribute(N, 3));
    out.setAttribute("aBary", new THREE.BufferAttribute(B, 3));
    out.setAttribute("aCentroid", new THREE.BufferAttribute(C, 3));
    out.setAttribute("aSeed", new THREE.BufferAttribute(S, 1));
    out.computeBoundingSphere();
    return { geo: out, sparkPositions: P };
  }

  const islandGeoCache = {};
  function getIslandGeo(kind) {
    if (kind === "genus2") return { geo: meshGeo, sparkPositions: meshData.sourcePositions };
    if (islandGeoCache[kind]) return islandGeoCache[kind];
    let src;
    if (kind === "torus") src = new THREE.TorusGeometry(1.0, 0.33, 18, 120);
    else if (kind === "knot") src = new THREE.TorusKnotGeometry(0.82, 0.24, 210, 18, 2, 3);
    else if (kind === "chain") src = makeChainGeo();
    else if (kind === "shell") src = makeShellGeo();
    else if (kind === "flower") src = makeBlobGeo(false);
    else if (kind === "urchin") src = makeBlobGeo(true);
    else src = new THREE.TorusGeometry(0.9, 0.3, 16, 96);
    const res = toSimplicial(src);
    islandGeoCache[kind] = res;
    return res;
  }

  function makeIslandSparks(posArr, seed, count, sizeScale) {
    const g = new THREE.BufferGeometry();
    const n = posArr.length / 3;
    const pos = new Float32Array(count * 3);
    const size = new Float32Array(count);
    const s = new Float32Array(count);
    const hue = new Float32Array(count);
    for (let i = 0; i < count; i++) {
      const vi = Math.floor(rand() * n);
      pos[i*3] = posArr[vi*3];
      pos[i*3+1] = posArr[vi*3+1];
      pos[i*3+2] = posArr[vi*3+2];
      size[i] = 0.75 + Math.pow(rand(), 2) * 2.1;
      s[i] = rand();
      hue[i] = rand();
    }
    g.setAttribute("position", new THREE.BufferAttribute(pos, 3));
    g.setAttribute("aSize", new THREE.BufferAttribute(size, 1));
    g.setAttribute("aSeed", new THREE.BufferAttribute(s, 1));
    g.setAttribute("aHue", new THREE.BufferAttribute(hue, 1));
    const m = sparkMaterial(seed, sizeScale || 0.9);
    const p = new THREE.Points(g, m);
    p.frustumCulled = false;
    p.renderOrder = 8;
    return { points: p, mat: m };
  }

  /* points that fly around an island: inward for attractors,
     approach-then-bounce for repellors; each with a short, quick trace */
  function makeAura(repel, seed, count) {
    const dir = repel ? -1 : 1;
    const n = count, segs = 4;
    const phase = new Float32Array(n);
    const speed = new Float32Array(n);
    const radius = new Float32Array(n);
    const yy = new Float32Array(n);
    const sd = new Float32Array(n);
    const size = new Float32Array(n);
    const hue = new Float32Array(n);
    for (let i = 0; i < n; i++) {
      phase[i] = rand();
      speed[i] = 0.06 + rand() * 0.16;
      radius[i] = 0.82 + rand() * 0.42;
      yy[i] = (rand() - 0.5) * 1.5;
      sd[i] = rand();
      size[i] = 0.8 + Math.pow(rand(), 2) * 2.4;
      hue[i] = rand();
    }

    const pg = new THREE.BufferGeometry();
    pg.setAttribute("position", new THREE.BufferAttribute(new Float32Array(n * 3), 3));
    pg.setAttribute("aPhase", new THREE.BufferAttribute(phase, 1));
    pg.setAttribute("aSpeed", new THREE.BufferAttribute(speed, 1));
    pg.setAttribute("aRadius", new THREE.BufferAttribute(radius, 1));
    pg.setAttribute("aY", new THREE.BufferAttribute(yy, 1));
    pg.setAttribute("aSeed", new THREE.BufferAttribute(sd, 1));
    pg.setAttribute("aSize", new THREE.BufferAttribute(size, 1));
    pg.setAttribute("aHue", new THREE.BufferAttribute(hue, 1));
    const pm = regMat(new THREE.ShaderMaterial({
      uniforms: {
        uTime: { value: 0 },
        uOpacity: { value: 0 },
        uDir: { value: dir },
        uPixelRatio: { value: DPR },
        uSizeScale: { value: 0.9 }
      },
      vertexShader: AURA_VERT,
      fragmentShader: AURA_FRAG,
      transparent: true,
      depthWrite: false,
      depthTest: true,
      blending: THREE.AdditiveBlending
    }), seed * 7.1);
    const points = new THREE.Points(pg, pm);
    points.frustumCulled = false;
    points.renderOrder = 8;

    const verts = n * segs * 2;
    const tg = new THREE.BufferGeometry();
    const tpos = new Float32Array(verts * 3);
    const age = new Float32Array(verts);
    const tphase = new Float32Array(verts);
    const tspeed = new Float32Array(verts);
    const tradius = new Float32Array(verts);
    const tyy = new Float32Array(verts);
    const tsd = new Float32Array(verts);
    const thue = new Float32Array(verts);
    for (let i = 0; i < n; i++) {
      for (let j = 0; j < segs; j++) {
        for (let e = 0; e < 2; e++) {
          const idx = (i * segs + j) * 2 + e;
          age[idx] = (j + e) / segs;
          tphase[idx] = phase[i];
          tspeed[idx] = speed[i];
          tradius[idx] = radius[i];
          tyy[idx] = yy[i];
          tsd[idx] = sd[i];
          thue[idx] = hue[i];
        }
      }
    }
    tg.setAttribute("position", new THREE.BufferAttribute(tpos, 3));
    tg.setAttribute("aAge", new THREE.BufferAttribute(age, 1));
    tg.setAttribute("aPhase", new THREE.BufferAttribute(tphase, 1));
    tg.setAttribute("aSpeed", new THREE.BufferAttribute(tspeed, 1));
    tg.setAttribute("aRadius", new THREE.BufferAttribute(tradius, 1));
    tg.setAttribute("aY", new THREE.BufferAttribute(tyy, 1));
    tg.setAttribute("aSeed", new THREE.BufferAttribute(tsd, 1));
    tg.setAttribute("aHue", new THREE.BufferAttribute(thue, 1));
    const tm = regMat(new THREE.ShaderMaterial({
      uniforms: {
        uTime: { value: 0 },
        uOpacity: { value: 0 },
        uDir: { value: dir }
      },
      vertexShader: AURA_TRAIL_VERT,
      fragmentShader: AURA_TRAIL_FRAG,
      transparent: true,
      depthWrite: false,
      depthTest: true,
      blending: THREE.AdditiveBlending
    }), seed * 8.3);
    const lines = new THREE.LineSegments(tg, tm);
    lines.frustumCulled = false;
    lines.renderOrder = 7;

    return { points, mat: pm, lines, trailMat: tm };
  }

  /* the palette of the wider landscape: attractors of many shapes,
     plus soft red repellors */
  const ISLAND_TYPES = [
    { kind: "genus2", repel: false, a: COL.ice,   b: COL.violet, ra: COL.cyan, rb: COL.violet },
    { kind: "knot",   repel: false, a: COL.gold,  b: COL.rose,   ra: COL.gold, rb: COL.rose },
    { kind: "torus",  repel: false, a: COL.cyan,  b: COL.ice,    ra: COL.cyan, rb: COL.ice },
    { kind: "urchin", repel: true,  a: RED_A,     b: RED_B,      ra: RED_A,    rb: RED_B },
    { kind: "shell",  repel: false, a: ORANGE,    b: COL.rose,   ra: ORANGE,   rb: COL.rose },
    { kind: "chain",  repel: false, a: GREEN,     b: COL.cyan,   ra: GREEN,    rb: COL.cyan },
    { kind: "flower", repel: false, a: PINK,      b: COL.violet, ra: PINK,     rb: COL.violet },
    { kind: "genus2", repel: false, a: COL.cyan,  b: COL.rose,   ra: COL.ice,  rb: COL.rose },
    { kind: "knot",   repel: false, a: COL.ice,   b: COL.gold,   ra: COL.ice,  rb: COL.gold },
    { kind: "urchin", repel: true,  a: RED_A,     b: RED_B,      ra: RED_A,    rb: RED_B },
    { kind: "torus",  repel: false, a: COL.violet,b: COL.ice,    ra: COL.violet,rb: COL.ice },
    { kind: "shell",  repel: false, a: COL.rose,  b: ORANGE,     ra: COL.rose, rb: ORANGE },
    { kind: "genus2", repel: false, a: COL.ice,   b: COL.cyan,   ra: COL.cyan, rb: COL.ice },
    { kind: "flower", repel: false, a: COL.gold,  b: PINK,       ra: COL.gold, rb: PINK },
    { kind: "chain",  repel: false, a: COL.cyan,  b: GREEN,      ra: COL.cyan, rb: GREEN },
    { kind: "urchin", repel: true,  a: RED_A,     b: RED_B,      ra: RED_A,    rb: RED_B }
  ];


  /* ============================================================
     four invariant cycles: two around the holes, two around the tubes
     ============================================================ */
  const cycles = [];
  function torusPoint(which, u, v) {
    const cx = which < 0.5 ? -D0 * 0.5 : D0 * 0.5;
    const rad = R0 + r0 * Math.cos(v);
    return new THREE.Vector3(cx + rad * Math.cos(u), r0 * Math.sin(v), rad * Math.sin(u));
  }
  function makeCycle(which, fixed, isHole, color, opacity) {
    const n = 260;
    const pos = new Float32Array(n * 3);
    const along = new Float32Array(n);
    for (let i = 0; i < n; i++) {
      const a = i / n * Math.PI * 2;
      const p = isHole ? torusPoint(which, a, fixed) : torusPoint(which, fixed, a);
      pos[i*3] = p.x; pos[i*3+1] = p.y; pos[i*3+2] = p.z;
      along[i] = i / n;
    }
    const g = new THREE.BufferGeometry();
    g.setAttribute("position", new THREE.BufferAttribute(pos, 3));
    g.setAttribute("aAlong", new THREE.BufferAttribute(along, 1));
    const m = regMat(new THREE.ShaderMaterial({
      uniforms: {
        uTime: { value: 0 },
        uMorph: { value: 1 },
        uSeed: { value: 0 },
        uOpacity: { value: 0 },
        uColor: { value: color.clone() }
      },
      vertexShader: CYCLE_VERT,
      fragmentShader: CYCLE_FRAG,
      transparent: true,
      depthWrite: false,
      depthTest: true,
      blending: THREE.AdditiveBlending
    }), which * 3.7 + (isHole ? 0 : 1.3));
    const line = new THREE.LineLoop(g, m);
    line.frustumCulled = false;
    line.renderOrder = 7;
    mainGroup.add(line);
    cycles.push({ line, mat: m, base: opacity });
  }
  makeCycle(0, 0.0, true,  new THREE.Color(0.35, 0.95, 1.00), 0.8);
  makeCycle(1, 0.0, true,  new THREE.Color(1.00, 0.72, 0.32), 0.8);
  makeCycle(0, Math.PI * 0.5, false, new THREE.Color(0.72, 0.38, 1.00), 0.42);
  makeCycle(1, Math.PI * 0.5, false, new THREE.Color(0.35, 0.62, 1.00), 0.42);

  /* ============================================================
     the wider landscape: many islands, some attractors, some repellors
     ============================================================ */
  function haloTexture() {
    const s = 256;
    const c = document.createElement("canvas");
    c.width = c.height = s;
    const ctx = c.getContext("2d");
    const g = ctx.createRadialGradient(s/2, s/2, 0, s/2, s/2, s/2);
    g.addColorStop(0.00, "rgba(255,255,255,0.55)");
    g.addColorStop(0.08, "rgba(220,245,255,0.30)");
    g.addColorStop(0.30, "rgba(120,200,255,0.11)");
    g.addColorStop(0.62, "rgba(90,150,255,0.03)");
    g.addColorStop(1.00, "rgba(0,0,0,0)");
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, s, s);
    ctx.globalCompositeOperation = "lighter";
    ctx.strokeStyle = "rgba(190,235,255,0.16)";
    ctx.lineWidth = 2.0;
    ctx.beginPath();
    ctx.arc(s/2, s/2, s*0.37, 0, Math.PI*2);
    ctx.stroke();
    const t = new THREE.CanvasTexture(c);
    t.colorSpace = THREE.SRGBColorSpace;
    return t;
  }
  const haloTex = haloTexture();

  const islandCount = ISLAND_TYPES.length;
  const islands = [];

  function createIsland(i) {
    const type = ISLAND_TYPES[i];
    const repel = !!type.repel;
    const seed = 1.7 + i * 2.31;
    const t = i / (islandCount - 1);
    const ga = i * 2.399963229728653;
    const radius = 4.2 + 9.4 * Math.sqrt((i + 0.5) / islandCount);
    const mapPos = new THREE.Vector3(
      Math.cos(ga) * radius,
      (rand() - 0.5) * 4.2 - 0.4,
      Math.sin(ga) * radius
    );
    const layer = i % 5;
    const lr = 1.6 + 3.6 * ((i * 0.618) % 1);
    const la = ga * 0.62;
    const ffnPos = new THREE.Vector3(
      Math.cos(la) * lr,
      -5.0 + layer * 2.5 + (rand() - 0.5) * 0.4,
      Math.sin(la) * lr
    );
    const mapScale = 0.28 + rand() * 0.24;
    const ffnScale = 0.16 + rand() * 0.12;

    const group = new THREE.Group();
    group.position.copy(mapPos);
    group.scale.setScalar(mapScale);
    group.rotation.set(rand()*0.5, rand()*Math.PI*2, rand()*0.4);

    const ig = getIslandGeo(type.kind);

    const surfaceMat = surfaceMaterial(seed, type.a, type.b, type.ra, type.rb);
    surfaceMat.uniforms.uGrow.value = 1;
    const surface = new THREE.Mesh(ig.geo, surfaceMat);
    surface.renderOrder = 7;
    surface.frustumCulled = false;
    group.add(surface);

    const edgeMat = edgeMaterial(seed, type.a, type.b);
    edgeMat.uniforms.uGrow.value = 1;
    const edge = new THREE.Mesh(ig.geo, edgeMat);
    edge.renderOrder = 8;
    edge.frustumCulled = false;
    group.add(edge);

    let pts = null;
    if (type.kind === "genus2") {
      pts = makeTorusPoints(repel ? 280 : 420, seed, 0.9);
      pts.points.material.uniforms.uFlowDir.value = repel ? -1 : 1;
      group.add(pts.points);
    }

    let sparks = null;
    if (type.kind !== "genus2") {
      sparks = makeIslandSparks(ig.sparkPositions, seed, repel ? 70 : 120, 0.9);
      group.add(sparks.points);
    }

    const aura = makeAura(repel, seed, repel ? 92 : 62);
    group.add(aura.points);
    group.add(aura.lines);

    const halo = new THREE.Sprite(new THREE.SpriteMaterial({
      map: haloTex,
      color: type.a.clone().lerp(type.b, 0.28),
      transparent: true,
      depthWrite: false,
      depthTest: true,
      blending: THREE.AdditiveBlending,
      opacity: 0
    }));
    halo.scale.setScalar(repel ? 8.5 : 6.4);
    group.add(halo);

    scene.add(group);
    islands.push({
      group, edge, surface, pts, sparks, aura, halo,
      seed, repel, kind: type.kind, type,
      mapPos, ffnPos, mapScale, ffnScale,
      edgeMat, surfaceMat,
      pointMat: pts ? pts.points.material : null,
      sparkMat: sparks ? sparks.mat : null,
      auraMat: aura.mat,
      auraTrailMat: aura.trailMat,
      rotation: new THREE.Euler(rand()*0.5, rand()*Math.PI*2, rand()*0.4)
    });
  }
  for (let i = 0; i < islandCount; i++) createIsland(i);

  /* faint threads between nearby islands, one merged line set */
  let threadMat, threads;
  {
    const segs = [];
    const links = [];
    for (let i = 0; i < islandCount; i++) {
      const candidates = [];
      for (let j = 0; j < islandCount; j++) {
        if (i === j) continue;
        candidates.push({ j, d: islands[i].mapPos.distanceTo(islands[j].mapPos) });
      }
      candidates.sort((a, b) => a.d - b.d);
      for (let q = 0; q < 2; q++) {
        const j = candidates[q].j;
        const key = i < j ? i + ":" + j : j + ":" + i;
        if (links.indexOf(key) === -1) links.push(key);
      }
    }
    const grouped = {};
    for (const key of links) {
      const [a, b] = key.split(":").map(Number);
      if (!grouped[a]) grouped[a] = [];
      grouped[a].push(b);
    }
    for (const a in grouped) {
      for (const b of grouped[a]) {
        const A = islands[a].mapPos, B = islands[b].mapPos;
        const mid = A.clone().add(B).multiplyScalar(0.5);
        const dirx = B.x - A.x, dirz = B.z - A.z;
        mid.x += -dirz * 0.09;
        mid.z +=  dirx * 0.09;
        mid.y += 0.8;
        const curve = new THREE.QuadraticBezierCurve3(A, mid, B);
        const pts = curve.getPoints(14);
        for (let k = 0; k < pts.length - 1; k++) {
          segs.push(pts[k], pts[k+1]);
        }
      }
    }
    const pos = new Float32Array(segs.length * 3);
    const along = new Float32Array(segs.length);
    for (let i = 0; i < segs.length; i++) {
      pos[i*3] = segs[i].x; pos[i*3+1] = segs[i].y; pos[i*3+2] = segs[i].z;
      along[i] = (i % 14) / 14;
    }
    const g = new THREE.BufferGeometry();
    g.setAttribute("position", new THREE.BufferAttribute(pos, 3));
    g.setAttribute("aAlong", new THREE.BufferAttribute(along, 1));
    threadMat = new THREE.ShaderMaterial({
      uniforms: {
        uTime: { value: 0 },
        uOpacity: { value: 0 }
      },
      vertexShader: `
        attribute float aAlong;
        varying float vAlong;
        varying vec3 vW;
        void main() {
          vec4 world = modelMatrix * vec4(position, 1.0);
          gl_Position = projectionMatrix * viewMatrix * world;
          vAlong = aAlong;
          vW = world.xyz;
        }
      `,
      fragmentShader: `
        uniform float uTime;
        uniform float uOpacity;
        varying float vAlong;
        varying vec3 vW;
        void main() {
          float edge = smoothstep(0.0, 0.12, vAlong) * smoothstep(1.0, 0.88, vAlong);
          float pulse = 0.35 + 0.65 * pow(0.5 + 0.5 * sin(vAlong * 42.0 - uTime * 1.4), 3.0);
          float a = uOpacity * edge * (0.10 + 0.35 * pulse);
          gl_FragColor = vec4(vec3(0.35, 0.72, 1.0) * (0.4 + pulse), a);
        }
      `,
      transparent: true,
      depthWrite: false,
      depthTest: true,
      blending: THREE.AdditiveBlending
    });
    threads = new THREE.LineSegments(g, threadMat);
    threads.frustumCulled = false;
    threads.renderOrder = 3;
    scene.add(threads);
  }

  /* dust around the landscape */
  let mapDust, mapDustMat;
  {
    const n = 1800;
    const pos = new Float32Array(n * 3);
    const size = new Float32Array(n);
    const s = new Float32Array(n);
    for (let i = 0; i < n; i++) {
      const r = 2 + Math.pow(rand(), 0.7) * 15;
      const th = rand() * Math.PI * 2;
      const ph = Math.acos(2 * rand() - 1);
      pos[i*3] = r * Math.sin(ph) * Math.cos(th);
      pos[i*3+1] = r * Math.cos(ph) * 0.52;
      pos[i*3+2] = r * Math.sin(ph) * Math.sin(th);
      size[i] = 0.7 + Math.pow(rand(), 3) * 2.8;
      s[i] = rand();
    }
    const g = new THREE.BufferGeometry();
    g.setAttribute("position", new THREE.BufferAttribute(pos, 3));
    g.setAttribute("aSize", new THREE.BufferAttribute(size, 1));
    g.setAttribute("aPhase", new THREE.BufferAttribute(s, 1));
    mapDustMat = makePointsMaterial(`
      attribute float aSize;
      attribute float aPhase;
      uniform float uPixelRatio;
      uniform float uTime;
      uniform float uOpacity;
      varying float vTw;
      void main() {
        vec3 p = position;
        p.x += 0.18 * sin(uTime * 0.12 + aPhase * 6.2831);
        p.y += 0.16 * cos(uTime * 0.10 + aPhase * 4.1);
        p.z += 0.18 * sin(uTime * 0.11 + aPhase * 5.3);
        vec4 mv = modelViewMatrix * vec4(p, 1.0);
        gl_Position = projectionMatrix * mv;
        gl_PointSize = clamp(aSize * uPixelRatio * 30.0 / max(1.0, -mv.z), 0.4, 6.0);
        vTw = uOpacity * (0.35 + 0.65 * pow(0.5 + 0.5 * sin(uTime * 0.5 + aPhase * 6.2831), 2.0));
      }
    `, `
      varying float vTw;
      void main() {
        vec2 q = gl_PointCoord * 2.0 - 1.0;
        float d = length(q);
        if (d > 1.0) discard;
        float a = pow(max(0.0, 1.0 - d), 2.8) * vTw;
        gl_FragColor = vec4(vec3(0.30, 0.58, 1.0) * 1.2, a);
      }
    `, {
      uPixelRatio: { value: DPR },
      uTime: { value: 0 },
      uOpacity: { value: 0 }
    });
    mapDust = new THREE.Points(g, mapDustMat);
    mapDust.frustumCulled = false;
    mapDust.renderOrder = -80;
    scene.add(mapDust);
  }

  /* ============================================================
     the FFN: stacked activation planes, dense edges, rising tokens
     ============================================================ */
  const layerY = [-5.0, -2.5, 0.0, 2.5, 5.0];
  const layerNodes = [];
  const ffnGroup = new THREE.Group();
  scene.add(ffnGroup);

  const layerDiscs = [];
  const layerNodeMats = [];
  let ffnEdgeMat, ffnEdges, ffnTokenMat, ffnTokens;

  for (let li = 0; li < layerY.length; li++) {
    const y = layerY[li];

    const discMat = new THREE.ShaderMaterial({
      uniforms: {
        uTime: { value: 0 },
        uOpacity: { value: 0 }
      },
      vertexShader: `
        varying vec2 vUv;
        void main() {
          vUv = uv;
          gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
        }
      `,
      fragmentShader: `
        uniform float uTime;
        uniform float uOpacity;
        varying vec2 vUv;
        void main() {
          vec2 p = vUv * 2.0 - 1.0;
          float r = length(p);
          if (r > 1.0) discard;
          float rim = smoothstep(0.995, 0.945, r) * smoothstep(0.885, 0.955, r);
          float inner = pow(max(0.0, 1.0 - r), 2.2);
          float rings = 0.5 + 0.5 * sin(r * 44.0 - uTime * 1.05);
          float spokes = 0.5 + 0.5 * sin(atan(p.y, p.x) * 22.0 + uTime * 0.23);
          float a = uOpacity * (0.022 + 0.085 * inner + 0.17 * rim + 0.010 * rings * (1.0 - r));
          vec3 col = mix(vec3(0.06, 0.28, 0.78), vec3(0.45, 0.16, 0.82),
                         0.5 + 0.5 * sin(uTime * 0.14 + r * 2.0));
          col += 0.35 * spokes * rim;
          gl_FragColor = vec4(col, a);
        }
      `,
      transparent: true,
      depthWrite: false,
      depthTest: true,
      side: THREE.DoubleSide,
      blending: THREE.AdditiveBlending
    });
    const disc = new THREE.Mesh(new THREE.CircleGeometry(5.55, 96), discMat);
    disc.rotation.x = -Math.PI / 2;
    disc.position.y = y;
    disc.renderOrder = 9;
    ffnGroup.add(disc);
    layerDiscs.push(discMat);

    const nodeCount = 150 + li * 8;
    const pos = new Float32Array(nodeCount * 3);
    const size = new Float32Array(nodeCount);
    const seed = new Float32Array(nodeCount);
    const hue = new Float32Array(nodeCount);
    const nodes = [];
    for (let n = 0; n < nodeCount; n++) {
      const r = 4.55 * Math.sqrt(rand());
      const a = rand() * Math.PI * 2;
      const x = Math.cos(a) * r;
      const z = Math.sin(a) * r;
      pos[n*3] = x;
      pos[n*3+1] = y + (rand() - 0.5) * 0.035;
      pos[n*3+2] = z;
      size[n] = 1.0 + Math.pow(rand(), 2) * 2.2;
      seed[n] = rand();
      hue[n] = rand();
      nodes.push(new THREE.Vector3(x, y + (rand() - 0.5) * 0.035, z));
    }
    layerNodes.push(nodes);

    const g = new THREE.BufferGeometry();
    g.setAttribute("position", new THREE.BufferAttribute(pos, 3));
    g.setAttribute("aSize", new THREE.BufferAttribute(size, 1));
    g.setAttribute("aSeed", new THREE.BufferAttribute(seed, 1));
    g.setAttribute("aHue", new THREE.BufferAttribute(hue, 1));
    const m = new THREE.ShaderMaterial({
      uniforms: {
        uTime: { value: 0 },
        uOpacity: { value: 0 },
        uPixelRatio: { value: DPR }
      },
      vertexShader: `
        attribute float aSize;
        attribute float aSeed;
        attribute float aHue;
        uniform float uPixelRatio;
        uniform float uTime;
        uniform float uOpacity;
        varying vec3 vColor;
        varying float vAlpha;
        void main() {
          vec4 mv = modelViewMatrix * vec4(position, 1.0);
          gl_Position = projectionMatrix * mv;
          float tw = 0.62 + 0.38 * sin(uTime * (0.9 + aSeed * 1.8) + aSeed * 6.2831);
          gl_PointSize = clamp(aSize * uPixelRatio * 26.0 / max(1.0, -mv.z) * tw, 0.5, 7.0);
          vColor = mix(vec3(0.45, 0.82, 1.0), vec3(0.80, 0.48, 1.0), aHue);
          vAlpha = uOpacity * (0.35 + 0.65 * tw);
        }
      `,
      fragmentShader: `
        varying vec3 vColor;
        varying float vAlpha;
        void main() {
          vec2 q = gl_PointCoord * 2.0 - 1.0;
          float d = length(q);
          if (d > 1.0) discard;
          float a = pow(max(0.0, 1.0 - d), 2.2) * vAlpha;
          gl_FragColor = vec4(vColor * 1.3, a);
        }
      `,
      transparent: true,
      depthWrite: false,
      depthTest: true,
      blending: THREE.AdditiveBlending
    });
    const pts = new THREE.Points(g, m);
    pts.frustumCulled = false;
    pts.renderOrder = 10;
    ffnGroup.add(pts);
    layerNodeMats.push(m);
  }

  /* connections between adjacent layers */
  {
    const segs = [];
    const along = [];
    const seeds = [];
    for (let li = 0; li < layerY.length - 1; li++) {
      const A = layerNodes[li], B = layerNodes[li + 1];
      const density = window.innerWidth < 700 ? 1 : 2;
      for (let k = 0; k < A.length; k++) {
        for (let q = 0; q < density; q++) {
          const b = B[Math.floor(rand() * B.length)];
          const a = A[k];
          const mid = a.clone().add(b).multiplyScalar(0.5);
          mid.x += (rand() - 0.5) * 0.6;
          mid.z += (rand() - 0.5) * 0.6;
          const curve = new THREE.QuadraticBezierCurve3(a, mid, b);
          const pts = curve.getPoints(7);
          for (let s = 0; s < pts.length - 1; s++) {
            segs.push(pts[s], pts[s+1]);
            along.push(s / (pts.length - 1));
            along.push((s+1) / (pts.length - 1));
            seeds.push(rand()); seeds.push(rand());
          }
        }
      }
    }
    const pos = new Float32Array(segs.length * 3);
    const al = new Float32Array(segs.length);
    const sd = new Float32Array(segs.length);
    for (let i = 0; i < segs.length; i++) {
      pos[i*3] = segs[i].x; pos[i*3+1] = segs[i].y; pos[i*3+2] = segs[i].z;
      al[i] = along[i];
      sd[i] = seeds[i];
    }
    const g = new THREE.BufferGeometry();
    g.setAttribute("position", new THREE.BufferAttribute(pos, 3));
    g.setAttribute("aAlong", new THREE.BufferAttribute(al, 1));
    g.setAttribute("aSeed", new THREE.BufferAttribute(sd, 1));
    ffnEdgeMat = new THREE.ShaderMaterial({
      uniforms: {
        uTime: { value: 0 },
        uOpacity: { value: 0 }
      },
      vertexShader: `
        attribute float aAlong;
        attribute float aSeed;
        varying float vAlong;
        varying float vSeed;
        void main() {
          vec4 world = modelMatrix * vec4(position, 1.0);
          gl_Position = projectionMatrix * viewMatrix * world;
          vAlong = aAlong;
          vSeed = aSeed;
        }
      `,
      fragmentShader: `
        uniform float uTime;
        uniform float uOpacity;
        varying float vAlong;
        varying float vSeed;
        void main() {
          float signal = smoothstep(0.0, 0.08, fract(vAlong - uTime * 0.22 + vSeed));
          float a = uOpacity * (0.035 + 0.20 * signal * signal);
          vec3 col = mix(vec3(0.20, 0.55, 1.0), vec3(0.70, 0.35, 1.0), vSeed);
          gl_FragColor = vec4(col * (0.5 + 1.5 * signal), a);
        }
      `,
      transparent: true,
      depthWrite: false,
      depthTest: true,
      blending: THREE.AdditiveBlending
    });
    ffnEdges = new THREE.LineSegments(g, ffnEdgeMat);
    ffnEdges.frustumCulled = false;
    ffnEdges.renderOrder = 9;
    ffnGroup.add(ffnEdges);
  }

  /* tokens rising through the stack */
  {
    const tokenCount = 20;
    const segs = [];
    const along = [];
    const token = [];
    for (let i = 0; i < tokenCount; i++) {
      const pts = [];
      for (let li = 0; li < layerY.length; li++) {
        const nodes = layerNodes[li];
        const n = nodes[Math.floor(rand() * nodes.length)];
        pts.push(new THREE.Vector3(
          n.x * 0.92 + (rand() - 0.5) * 0.25,
          n.y + 0.04,
          n.z * 0.92 + (rand() - 0.5) * 0.25
        ));
      }
      const curve = new THREE.CatmullRomCurve3(pts, false, "catmullrom", 0.35);
      const samples = curve.getPoints(96);
      for (let s = 0; s < samples.length - 1; s++) {
        segs.push(samples[s], samples[s+1]);
        along.push(s / (samples.length - 1));
        along.push((s+1) / (samples.length - 1));
        token.push(i / tokenCount);
        token.push(i / tokenCount);
      }
    }
    const pos = new Float32Array(segs.length * 3);
    const al = new Float32Array(segs.length);
    const tk = new Float32Array(segs.length);
    for (let i = 0; i < segs.length; i++) {
      pos[i*3] = segs[i].x; pos[i*3+1] = segs[i].y; pos[i*3+2] = segs[i].z;
      al[i] = along[i];
      tk[i] = token[i];
    }
    const g = new THREE.BufferGeometry();
    g.setAttribute("position", new THREE.BufferAttribute(pos, 3));
    g.setAttribute("aAlong", new THREE.BufferAttribute(al, 1));
    g.setAttribute("aToken", new THREE.BufferAttribute(tk, 1));
    ffnTokenMat = new THREE.ShaderMaterial({
      uniforms: {
        uTime: { value: 0 },
        uOpacity: { value: 0 }
      },
      vertexShader: `
        attribute float aAlong;
        attribute float aToken;
        varying float vAlong;
        varying float vToken;
        void main() {
          vec4 world = modelMatrix * vec4(position, 1.0);
          gl_Position = projectionMatrix * viewMatrix * world;
          vAlong = aAlong;
          vToken = aToken;
        }
      `,
      fragmentShader: `
        uniform float uTime;
        uniform float uOpacity;
        varying float vAlong;
        varying float vToken;
        void main() {
          float prog = fract(uTime * 0.028 + vToken * 0.713);
          float d = vAlong - prog;
          d = d - floor(d + 0.5);
          float head = exp(-d * d * 700.0);
          float tail = d < 0.0 ? exp(d * 9.0) : 0.0;
          float a = uOpacity * (head * 0.95 + tail * 0.32);
          vec3 col = mix(vec3(1.0, 0.78, 0.38), vec3(0.62, 0.95, 1.0), smoothstep(0.0, 1.0, vAlong));
          gl_FragColor = vec4(col * (0.5 + 2.2 * head), a);
        }
      `,
      transparent: true,
      depthWrite: false,
      depthTest: true,
      blending: THREE.AdditiveBlending
    });
    ffnTokens = new THREE.LineSegments(g, ffnTokenMat);
    ffnTokens.frustumCulled = false;
    ffnTokens.renderOrder = 11;
    ffnGroup.add(ffnTokens);
  }

  /* ============================================================
     story, camera, UI
     ============================================================ */
  let story = 0;
  let storySmooth = 0;
  let playing = true;
  let orbitOn = true;
  let elapsed = 0;
  let autoTheta = 0;
  let userTheta = 0;
  let userPhi = 0;
  let userZoom = 1;
  let userZoomTarget = 1;
  let camR = 5.0, camPhi = 1.22, camTy = 0.0;
  let scrubbing = false;
  let wasPlaying = false;
  let uiTimer = 0;
  const clock = new THREE.Clock();

  const actStops = [0.01, 0.14, 0.29, 0.44, 0.58, 0.80, 0.95];
  const actButtons = [];
  for (let i = 0; i < actStops.length; i++) {
    const b = document.createElement("button");
    b.type = "button";
    b.setAttribute("aria-label", "Phase " + (i + 1));
    b.innerHTML = "<i></i>";
    b.addEventListener("click", () => {
      story = actStops[i];
      playing = true;
      updatePlayButton();
      wakeUI();
    });
    actsEl.appendChild(b);
    actButtons.push(b);
  }

  for (let i = 0; i < 11; i++) {
    const d = document.createElement("i");
    d.style.left = (i / 10 * 100) + "%";
    ticks.appendChild(d);
  }

  const CAM_KEYS = [
    { t: 0.00, r: 24.5, phi: 1.03, ty: 0.00, th: 0.10 },
    { t: 0.05, r: 20.0, phi: 1.06, ty: 0.20, th: 0.16 },
    { t: 0.10, r: 12.4, phi: 1.10, ty: 0.10, th: 0.22 },
    { t: 0.15, r: 7.1,  phi: 1.16, ty: 0.00, th: 0.28 },
    { t: 0.21, r: 5.0,  phi: 1.18, ty: 0.00, th: 0.34 },
    { t: 0.34, r: 4.4,  phi: 1.15, ty: 0.00, th: 0.42 },
    { t: 0.50, r: 4.0,  phi: 1.20, ty: 0.00, th: 0.50 },
    { t: 0.64, r: 4.5,  phi: 1.18, ty: 0.00, th: 0.58 },
    { t: 0.82, r: 12.0, phi: 1.04, ty: 1.05, th: 0.78 },
    { t: 0.93, r: 16.4, phi: 1.10, ty: 1.30, th: 0.92 },
    { t: 1.00, r: 18.4, phi: 1.15, ty: 1.30, th: 1.02 }
  ];

  function camSample(s) {
    let a = CAM_KEYS[0], b = CAM_KEYS[CAM_KEYS.length - 1];
    for (let i = 0; i < CAM_KEYS.length - 1; i++) {
      if (s >= CAM_KEYS[i].t && s <= CAM_KEYS[i + 1].t) {
        a = CAM_KEYS[i]; b = CAM_KEYS[i + 1];
        break;
      }
    }
    const u = smoothstep(0, 1, (s - a.t) / Math.max(0.0001, b.t - a.t));
    return {
      r: lerp(a.r, b.r, u),
      phi: lerp(a.phi, b.phi, u),
      ty: lerp(a.ty, b.ty, u),
      th: lerp(a.th, b.th, u)
    };
  }

  function updatePlayButton() {
    if (playing) {
      playBtn.classList.add("on");
      playIcon.innerHTML = '<path d="M8 5.5h3v13H8zM13 5.5h3v13h-3z" fill="currentColor" stroke="none"/>';
      playBtn.setAttribute("aria-label", "Pause");
    } else {
      playBtn.classList.remove("on");
      playIcon.innerHTML = story >= 0.999
        ? '<path d="M4.5 12a7.5 7.5 0 1 0 2.2-5.3"/><path d="M4 4.5v4h4"/>'
        : '<path d="M8 5.5v13l11-6.5z" fill="currentColor" stroke="none"/>';
      playBtn.setAttribute("aria-label", story >= 0.999 ? "Erneut abspielen" : "Abspielen");
    }
  }

  function wakeUI() {
    ui.classList.add("visible");
    clearTimeout(uiTimer);
    uiTimer = setTimeout(() => ui.classList.remove("visible"), 3000);
  }

  playBtn.addEventListener("click", () => {
    if (story >= 0.999 && !playing) {
      story = 0;
      playing = true;
    } else {
      playing = !playing;
    }
    updatePlayButton();
    wakeUI();
  });
  restartBtn.addEventListener("click", () => {
    story = 0;
    playing = true;
    updatePlayButton();
    wakeUI();
  });
  orbitBtn.addEventListener("click", () => {
    orbitOn = !orbitOn;
    orbitBtn.classList.toggle("on", orbitOn);
    wakeUI();
  });
  fullBtn.addEventListener("click", () => {
    if (!document.fullscreenElement) {
      document.documentElement.requestFullscreen && document.documentElement.requestFullscreen();
    } else {
      document.exitFullscreen && document.exitFullscreen();
    }
    wakeUI();
  });

  scrub.addEventListener("pointerdown", () => {
    scrubbing = true;
    wasPlaying = playing;
    playing = false;
    updatePlayButton();
  });
  window.addEventListener("pointerup", () => {
    if (scrubbing) {
      scrubbing = false;
      if (wasPlaying) {
        playing = true;
        updatePlayButton();
      }
      wasPlaying = false;
    }
  });
  scrub.addEventListener("input", () => {
    story = clamp(parseFloat(scrub.value) || 0, 0, 1);
    wakeUI();
  });
  window.addEventListener("pointermove", wakeUI, { passive: true });
  window.addEventListener("touchstart", wakeUI, { passive: true });
  window.addEventListener("keydown", (e) => {
    if (e.target && (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA")) return;
    if (e.code === "Space") {
      e.preventDefault();
      playBtn.click();
    } else if (e.code === "ArrowRight") {
      story = clamp(story + 0.018, 0, 1);
      wakeUI();
    } else if (e.code === "ArrowLeft") {
      story = clamp(story - 0.018, 0, 1);
      wakeUI();
    } else if (e.code === "KeyR") {
      restartBtn.click();
    } else if (e.code === "KeyF") {
      fullBtn.click();
    } else if (e.code === "KeyO") {
      orbitBtn.click();
    }
  });

  /* drag / pinch */
  const pointers = new Map();
  let pinchStart = 0, pinchZoom = 1;
  canvas.addEventListener("pointerdown", (e) => {
    canvas.setPointerCapture && canvas.setPointerCapture(e.pointerId);
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pointers.size === 1) canvas.classList.add("dragging");
    if (pointers.size === 2) {
      const arr = [...pointers.values()];
      pinchStart = Math.hypot(arr[0].x - arr[1].x, arr[0].y - arr[1].y);
      pinchZoom = userZoomTarget;
    }
    wakeUI();
  });
  canvas.addEventListener("pointermove", (e) => {
    if (!pointers.has(e.pointerId)) return;
    const prev = pointers.get(e.pointerId);
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pointers.size === 1) {
      const dx = e.clientX - prev.x;
      const dy = e.clientY - prev.y;
      userTheta -= dx * 0.0052;
      userPhi = clamp(userPhi - dy * 0.0044, -1.02, 1.28);
    } else if (pointers.size === 2 && pinchStart > 0) {
      const arr = [...pointers.values()];
      const d = Math.hypot(arr[0].x - arr[1].x, arr[0].y - arr[1].y);
      userZoomTarget = clamp(pinchZoom * (pinchStart / Math.max(1, d)), 0.62, 2.4);
    }
  });
  function endPointer(e) {
    pointers.delete(e.pointerId);
    if (pointers.size === 0) canvas.classList.remove("dragging");
    if (pointers.size < 2) pinchStart = 0;
  }
  canvas.addEventListener("pointerup", endPointer);
  canvas.addEventListener("pointercancel", endPointer);
  canvas.addEventListener("wheel", (e) => {
    e.preventDefault();
    userZoomTarget = clamp(userZoomTarget * Math.exp(e.deltaY * 0.00085), 0.62, 2.4);
    wakeUI();
  }, { passive: false });
  canvas.addEventListener("dblclick", () => fullBtn.click());

  /* ============================================================
     story -> visible state
     ============================================================ */
  function updateStory(s) {
    const introOn = smoothstep(0.00, 0.02, s) * (1 - smoothstep(0.10, 0.24, s));
    const appear = smoothstep(0.07, 0.20, s);
    const grow = smoothstep(0.32, 0.54, s);
    const surfOn = smoothstep(0.35, 0.50, s);
    const isolate = smoothstep(0.51, 0.63, s);
    const morphOut = smoothstep(0.63, 0.79, s);
    const mapOn = smoothstep(0.77, 0.89, s);
    const ffnOn = smoothstep(0.89, 0.995, s);

    const morph = 1 - morphOut;
    const pointOp = appear * (1 - 0.30 * isolate) * (1 - 0.58 * ffnOn);
    const mainScale = lerp(lerp(1.0, 0.54, mapOn), 0.63, ffnOn);

    mainGroup.scale.setScalar(mainScale);
    mainGroup.rotation.y = elapsed * 0.035 * (1 - 0.55 * mapOn);

    mainSurfaceMat.uniforms.uMorph.value = morph;
    mainSurfaceMat.uniforms.uGrow.value = grow;
    mainSurfaceMat.uniforms.uOpacity.value =
      surfOn * (0.88 + 0.12 * isolate) * (1 - 0.78 * mapOn) * (1 - 0.55 * ffnOn);
    mainSurface.visible = surfOn > 0.003;

    mainEdgeMat.uniforms.uMorph.value = morph;
    mainEdgeMat.uniforms.uGrow.value = grow;
    mainEdgeMat.uniforms.uOpacity.value =
      0.62 * smoothstep(0.25, 0.44, s) * (0.82 + 0.18 * isolate)
      * (1 - 0.30 * mapOn) * (1 - 0.45 * ffnOn);
    mainEdges.visible = grow > 0.003;

    mainDepthMat.uniforms.uMorph.value = morph;
    mainDepth.visible = (surfOn > 0.02 || grow > 0.02);

    mainPoints.mat.uniforms.uMorph.value = morph;
    mainPoints.mat.uniforms.uOpacity.value = pointOp;
    mainPoints.points.visible = pointOp > 0.003;

    mainTrails.mat.uniforms.uMorph.value = morph;
    mainTrails.mat.uniforms.uOpacity.value = pointOp * 0.92;
    mainTrails.lines.visible = pointOp > 0.01;

    mainSparks.mat.uniforms.uMorph.value = morph;
    mainSparks.mat.uniforms.uOpacity.value = pointOp * 0.72;
    mainSparks.points.visible = pointOp > 0.01;

    for (const c of cycles) {
      c.mat.uniforms.uMorph.value = morph;
      c.mat.uniforms.uOpacity.value =
        c.base * smoothstep(0.52, 0.64, s) * (1 - smoothstep(0.82, 0.92, s));
      c.line.visible = c.mat.uniforms.uOpacity.value > 0.006;
    }

    const islandOp = Math.max(introOn * 0.72, mapOn * (1 - 0.38 * ffnOn));
    for (let i = 0; i < islands.length; i++) {
      const isl = islands[i];
      isl.group.position.copy(isl.mapPos).lerp(isl.ffnPos, ffnOn);
      isl.group.scale.setScalar(lerp(isl.mapScale, isl.ffnScale, ffnOn));
      isl.group.rotation.y = isl.rotation.y + elapsed * (isl.repel ? -0.045 : 0.055) * (1 - 0.5 * ffnOn);
      isl.group.visible = islandOp > 0.004;
      const im = 0.26 + 0.60 * fract(isl.seed * 0.371);
      isl.edgeMat.uniforms.uMorph.value = im;
      isl.edgeMat.uniforms.uOpacity.value = islandOp * (isl.repel ? 0.32 : 0.48);
      isl.surfaceMat.uniforms.uMorph.value = im;
      isl.surfaceMat.uniforms.uOpacity.value = islandOp * (isl.repel ? 0.48 : 0.13);
      if (isl.pointMat) {
        isl.pointMat.uniforms.uMorph.value = im;
        isl.pointMat.uniforms.uOpacity.value = islandOp * 0.62;
      }
      if (isl.sparkMat) {
        isl.sparkMat.uniforms.uMorph.value = im;
        isl.sparkMat.uniforms.uOpacity.value = islandOp * (isl.repel ? 0.12 : 0.38);
      }
      isl.auraMat.uniforms.uOpacity.value = islandOp * (isl.repel ? 0.66 : 0.34);
      isl.auraTrailMat.uniforms.uOpacity.value = islandOp * (isl.repel ? 0.55 : 0.24);
      isl.halo.material.opacity = islandOp * (isl.repel ? 0.40 : 0.16);
    }

    const threadOp = Math.max(introOn * 0.45, mapOn * (1 - ffnOn));
    threadMat.uniforms.uOpacity.value = threadOp * 0.95;
    threads.visible = threadMat.uniforms.uOpacity.value > 0.004;
    mapDustMat.uniforms.uOpacity.value = Math.min(1, introOn * 0.9 + mapOn * (1 - 0.42 * ffnOn)) * 0.8;
    mapDust.visible = mapDustMat.uniforms.uOpacity.value > 0.004;

    ffnGroup.visible = ffnOn > 0.003;
    for (const m of layerDiscs) m.uniforms.uOpacity.value = ffnOn * 0.82;
    for (const m of layerNodeMats) m.uniforms.uOpacity.value = ffnOn * 0.92;
    ffnEdgeMat.uniforms.uOpacity.value = ffnOn * 0.82;
    ffnTokenMat.uniforms.uOpacity.value = ffnOn;
  }

  function updateCamera(dt) {
    const c = camSample(storySmooth);
    camR = damp(camR, c.r, 4.2, dt);
    camPhi = damp(camPhi, c.phi, 4.2, dt);
    camTy = damp(camTy, c.ty, 3.4, dt);
    userZoom = damp(userZoom, userZoomTarget, 6.0, dt);

    if (orbitOn && !reduceMotion) autoTheta += dt * 0.032;
    const theta = c.th + autoTheta + userTheta;
    const phi = clamp(camPhi + userPhi, 0.16, 2.72);
    const radius = camR * userZoom;
    cameraTarget.set(0, camTy, 0);

    const sp = Math.sin(phi);
    camera.position.set(
      cameraTarget.x + radius * sp * Math.sin(theta),
      cameraTarget.y + radius * Math.cos(phi),
      cameraTarget.z + radius * sp * Math.cos(theta)
    );
    camera.lookAt(cameraTarget);
  }

  function updateUI() {
    fill.style.width = (story * 100).toFixed(2) + "%";
    if (!scrubbing) scrub.value = story;
    let active = 0;
    for (let i = 0; i < actStops.length; i++) {
      if (story >= actStops[i] - 0.018) active = i;
    }
    for (let i = 0; i < actButtons.length; i++) {
      actButtons[i].classList.toggle("on", i === active);
    }
  }

  /* ============================================================
     loop
     ============================================================ */
  function frame() {
    requestAnimationFrame(frame);
    const dt = Math.min(clock.getDelta(), 0.05);
    elapsed += dt;

    if (playing) {
      story = Math.min(1, story + dt / 118);
      if (story >= 1) {
        story = 1;
        playing = false;
        updatePlayButton();
      }
    }
    storySmooth = damp(storySmooth, story, 5.2, dt);

    updateCamera(dt);
    updateStory(storySmooth);

    for (const rec of materialRecords) {
      rec.mat.uniforms.uTime.value = elapsed + rec.offset;
    }
    bgUniforms.uTime.value = elapsed;
    if (starMat) starMat.uniforms.uTime.value = elapsed;
    mapDustMat.uniforms.uTime.value = elapsed;
    threadMat.uniforms.uTime.value = elapsed;
    for (const m of layerDiscs) m.uniforms.uTime.value = elapsed;
    for (const m of layerNodeMats) m.uniforms.uTime.value = elapsed;
    ffnEdgeMat.uniforms.uTime.value = elapsed;
    ffnTokenMat.uniforms.uTime.value = elapsed;

    updateUI();
    renderPost();
  }

  /* ============================================================
     boot
     ============================================================ */
  const params = new URLSearchParams(location.search);
  if (params.has("story")) {
    story = clamp(parseFloat(params.get("story")) || 0, 0, 1);
    storySmooth = story;
  }
  if (params.get("pause") === "1") playing = false;

  initPost();
  resize();
  updateStory(0);
  updatePlayButton();
  wakeUI();

  // handy for checking and for focused screenshots
  window.__topo = {
    ready: true,
    buildMs,
    setStory(v) { story = clamp(v, 0, 1); storySmooth = story; },
    get story() { return story; },
    play() { playing = true; updatePlayButton(); },
    pause() { playing = false; updatePlayButton(); },
    islands: islands.length,
    triangles: meshData.vertexCount
  };

  requestAnimationFrame(() => {
    loader.classList.add("hide");
    setTimeout(() => { if (loader.parentNode) loader.parentNode.removeChild(loader); }, 1500);
    frame();
  });
})();
</script>
</body>
</html>
