<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>diag3</title></head>
<body>
<iframe id="pg" src="../transformer" style="width:900px;height:600px;border:0"></iframe>
<script>
var lg = [];
function finish(m){ document.title = 'DIAG3 ' + m; }
function snap(){
  var w = document.getElementById('pg').contentWindow;
  var det = w.document.getElementById('tda-live-details');
  return 'open=' + (det.open?1:0) + ' attr=' + (det.hasAttribute('open')?1:0);
}
function ph(){
  var w = document.getElementById('pg').contentWindow;
  var el = w.document.getElementById('tda-live-phase');
  return el ? (el.innerHTML.length + ';svg=' + (el.querySelector('svg')?1:0)) : 'nop';
}
function waitLoaded(){ var w = document.getElementById('pg').contentWindow; return w && w.document.getElementById('tda-live-details'); }
var tries = 0;
function t0(){ if(!waitLoaded()){ if(++tries>200){finish('TO');return;} setTimeout(t0,200); return; } lg.push('state:'+snap()+' phase='+ph()); document.getElementById('pg').contentWindow.document.getElementById('tda-live-details').getElementsByTagName('summary')[0].click(); lg.push('afterClick:'+snap()); setTimeout(t1,800); }
function t1(){ lg.push('settle:'+snap()); var w=document.getElementById('pg').contentWindow; w.document.getElementById('tda-live-details').scrollIntoView({block:'center'}); setTimeout(t2,800); }
function t2(){ lg.push('scrolled:'+snap()+' phase='+ph()); finish(lg.join('|')); }
document.getElementById('pg').addEventListener('load', function(){ setTimeout(t0,300); });
</script>
</body></html>
