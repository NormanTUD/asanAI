<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>diag2</title></head>
<body>
<iframe id="pg" src="../transformer" style="width:900px;height:600px;border:0"></iframe>
<script>
var lg = [];
function finish(m){ document.title = 'DIAG2 ' + m; }
function snap(){
  var w = document.getElementById('pg').contentWindow;
  var det = w.document.getElementById('tda-live-details');
  return 'open=' + (det.open?1:0) + ' attr=' + (det.hasAttribute('open')?1:0);
}
function poll(tag){
  var w = document.getElementById('pg').contentWindow;
  if (!w || !w.document.getElementById('tda-live-details')) { setTimeout(function(){poll(tag);},300); return; }
  lg.push(tag + ':' + snap());
  if (tag === 't2') {
    lg.push('click:' + snap());
    finish(lg.join('|'));
    return;
  }
  setTimeout(function(){ poll('t2'); }, 1500);
}
document.getElementById('pg').addEventListener('load', function(){ setTimeout(function(){ poll('t1'); }, 300); });
</script>
</body></html>
