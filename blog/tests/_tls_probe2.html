<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>tlsprobe2</title></head>
<body>
<iframe id="pg" src="http://localhost/asanai/blog/transformer" style="width:1200px;height:900px;border:0"></iframe>
<pre id="out">pending</pre>
<script>
function done(m) { document.getElementById('out').textContent = 'TLS_RESULT ' + m; document.title = 'tls done'; }
function snap() {
	try {
		var w = document.getElementById('pg').contentWindow, d = w.document;
		var panel = d.getElementById('transformer-layer-summary');
		var st = d.getElementById('tls-status');
		var layers = d.getElementById('tls-layers');
		var eq = d.getElementById('tls-equations');
		var cites = 0;
		if (eq) cites = eq.querySelectorAll('a[href^="#"], sup, [id^="cite-"]').length;
		return {
			panel: !!panel,
			status: st ? st.textContent.slice(0, 200) : 'no-status',
			cardCount: d.querySelectorAll('.tls-card').length,
			layersLen: layers ? layers.innerHTML.length : -1,
			eq: !!eq, cites: cites,
			weights: Array.isArray(w.currentWeights) ? w.currentWeights.length : ('null/' + typeof w.currentWeights),
			emb: !!w.persistentEmbeddingSpace,
			training: !!w.isTraining,
			epoch: (w.lossHistory && w.lossHistory.length) || 0
		};
	} catch (e) { return { err: e.message }; }
}
var tries = 0;
function poll() {
	var s = snap();
	if (!s.panel) { if (++tries > 250) return done('PANEL_TIMEOUT ' + JSON.stringify(s)); }
	else if (!tries) { /* keep waiting until stable */ }
	if (s.panel && (s.status.indexOf('Measured') === 0 || s.status.indexOf('Error') === 0 || s.status.indexOf('not initialised') === 0)) {
		if (++tries > 60) return done(JSON.stringify(s));
		if (s.cardCount > 0 || s.status.indexOf('Error') === 0) return done(JSON.stringify(s));
	}
	if (++tries > 350) return done(JSON.stringify(s));
	setTimeout(poll, 250);
}
document.getElementById('pg').addEventListener('load', function () { setTimeout(poll, 300); });
</script>
</body></html>
