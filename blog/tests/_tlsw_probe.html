<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>wprobe</title></head>
<body>
<iframe id="pg" src="http://localhost/asanai/blog/transformer" style="width:1600px;height:1000px;border:0"></iframe>
<pre id="out">pending</pre>
<script>
function done(m) { document.getElementById('out').textContent = 'W_RESULT ' + m; document.title = 'w done'; }
function run() {
	try {
		var w = document.getElementById('pg').contentWindow;
		var g = w.__layoutGuardrailCheck ? w.__layoutGuardrailCheck() : null;
		var offs = [];
		if (g && g.offenders) offs = g.offenders.filter(function (o) { return /transformer-layer-summary|tls-/.test(o.tag || o.id || o.className || '') }).map(function (o) { return o.tag + '#' + o.id; });
		var eq = document.getElementById('pg').contentDocument.getElementById('tls-equations');
		done('ready=' + (g && g.ready) + ' allowed=' + (g && g.allowed) + ' n=' + (g && g.offenders ? g.offenders.length : 'n/a') + ' tlsOffenders=' + JSON.stringify(offs) + ' eqRect=' + JSON.stringify(eq ? { w: Math.round(eq.getBoundingClientRect().width), scrollW: eq.scrollWidth } : null));
	} catch (e) { done('ERR ' + e.message); }
}
var tries = 0;
function poll() { var w = document.getElementById('pg').contentWindow; try { if (w && w.__layoutGuardrailCheck && w.__layoutGuardrailCheck().ready === true) return run(); } catch (e) {} if (++tries > 200) return done('timout'); setTimeout(poll, 300); }
document.getElementById('pg').addEventListener('load', function () { setTimeout(poll, 400); });
</script>
</body></html>
