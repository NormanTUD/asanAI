<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>tlsprobe5</title></head>
<body>
<iframe id="pg" src="http://localhost/asanai/blog/transformer" style="width:1200px;height:900px;border:0"></iframe>
<pre id="out">pending</pre>
<script>
function done(m) { document.getElementById('out').textContent = 'TLS_RESULT ' + m; document.title = 'tls done'; }
function snap() {
	var w = document.getElementById('pg').contentWindow, d = w.document;
	var panel = d.getElementById('transformer-layer-summary');
	var eq = d.getElementById('tls-equations');
	var seg = eq ? eq.innerHTML : '';
	return {
		panel: !!panel,
		cardCount: d.querySelectorAll('.tls-card').length,
		status: (function(){ var s = d.getElementById('tls-status'); return s ? s.textContent.slice(0,150) : 'no'; })(),
		arxLinks: (seg.match(/href="https:\/\/arxiv\.org[^"]*"/g) || []).length,
		tpgLinks: (seg.match(/transformer-circuits\.pub/g) || []).length,
		litCite: (seg.match(/\\cite|cite\{|cite\[/) || []).length,
		mdMath: (seg.match(/<math>/g) || []).length
	};
}
var tries = 0;
function poll() {
	var s = snap();
	if (!s.panel || (s.cardCount === 0 && s.status.indexOf('not initialised') === -1 && s.status.indexOf('Error') === -1)) {
		if (++tries > 420) return done('TIMEOUT ' + JSON.stringify(s));
		setTimeout(poll, 250); return;
	}
	done(JSON.stringify(s));
}
document.getElementById('pg').addEventListener('load', function () { setTimeout(poll, 400); });
</script>
</body></html>
