<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>audit pending</title></head>
<body>
<iframe id="pg" src="../transformer" style="width:900px;height:600px;border:0"></iframe>
<script>
function finish(msg) {
	document.title = 'LG_AUDIT ' + msg;
}
var attempts = 0;
function poll() {
	var w = null;
	try { w = document.getElementById('pg').contentWindow; } catch (e) { w = null; }
	var r = null;
	if (w && w.__layoutGuardrailCheck) {
		try { r = w.__layoutGuardrailCheck(); } catch (e2) { r = null; }
		if (r && r.ready === true) {
			finish(JSON.stringify({ ok: r.ok, allowed: Math.round(r.allowedPx), n: r.offenders.length, off: r.offenders }));
			return;
		}
		if (++attempts > 120) { finish('TIMEOUT ' + JSON.stringify(r)); return; }
		setTimeout(poll, 500);
		return;
	}
	if (++attempts > 120) { finish('TIMEOUT guardrail not found'); return; }
	setTimeout(poll, 500);
}
document.getElementById('pg').addEventListener('load', function () { setTimeout(poll, 600); });
</script>
</body></html>
